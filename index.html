empo.<\u002Fp>\n<\u002Fsection>\n<section class=\"sec\" aria-label=\"Guias\">\n<sc-for list=\"{{guides}}\" as=\"g\" hint-placeholder-count=\"5\">\n<div class=\"acc\" id=\"{{g.anchor}}\">\n<h3><button class=\"acc-btn\" aria-expanded=\"{{g.expanded}}\" sc-camel-on-click=\"{{g.toggle}}\"><span><span class=\"acc-title\">{{g.title}}<\u002Fspan><span class=\"acc-sub\">{{g.summary}} · {{g.time}}<\u002Fspan><\u002Fspan><span class=\"acc-icon\" aria-hidden=\"true\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton><\u002Fh3>\n<sc-if value=\"{{g.isOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"acc-body\">\n<sc-for list=\"{{g.blocks}}\" as=\"b\" hint-placeholder-count=\"2\">\n<sc-if value=\"{{b.hasH}}\" hint-placeholder-val=\"{{false}}\"><h4>{{b.h}}<\u002Fh4><\u002Fsc-if>\n<sc-if value=\"{{b.hasP}}\" hint-placeholder-val=\"{{true}}\"><p>{{b.p}}<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{b.hasList}}\" hint-placeholder-val=\"{{false}}\"><ul class=\"ul\"><sc-for list=\"{{b.list}}\" as=\"li\" hint-placeholder-count=\"3\"><li>{{li.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fsc-if>\n<sc-if value=\"{{b.hasLink}}\" hint-placeholder-val=\"{{false}}\"><div><button class=\"btn-link\" sc-camel-on-click=\"{{b.go}}\">{{b.linkLabel}} <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n<\u002Fsc-for>\n<sc-if value=\"{{g.hasSources}}\" hint-placeholder-val=\"{{false}}\">\n<div><p class=\"small muted\">Fontes oficiais (verificadas em {{verifiedAt}}):<\u002Fp>\n<ul class=\"src-list\"><sc-for list=\"{{g.sources}}\" as=\"sr\" hint-placeholder-count=\"2\"><li><a href=\"{{sr.url}}\" target=\"_blank\" rel=\"noopener noreferrer\">{{sr.title}}<\u002Fa><small>{{sr.tool}}<\u002Fsmall><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"row\"><button class=\"btn-ghost sm {{g.favCls}}\" aria-pressed=\"{{g.favPressed}}\" sc-camel-on-click=\"{{g.toggleFav}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg>{{g.favLabel}}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<section class=\"sec\" aria-labelledby=\"t-ck\">\n<div class=\"sec-head\"><div><h2 class=\"h2\" id=\"t-ck\">Checklists essenciais<\u002Fh2><p class=\"h2-sub\">Marque os itens enquanto confere. O progresso fica salvo na Minha biblioteca quando o armazenamento do navegador está disponível.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"grid\">\n<sc-for list=\"{{checklists}}\" as=\"ck\" hint-placeholder-count=\"3\">\n<article class=\"card {{ck.focusCls}}\" id=\"{{ck.anchor}}\">\n<div class=\"card-top\"><span class=\"badge badge-type\">Checklist<\u002Fspan><span class=\"badge badge-outline\">{{ck.done}} de {{ck.total}}<\u002Fspan><\u002Fdiv>\n<h3 class=\"card-title\">{{ck.title}}<\u002Fh3>\n<p class=\"card-text\">{{ck.summary}}<\u002Fp>\n<ul class=\"checks\">\n<sc-for list=\"{{ck.items}}\" as=\"it\" hint-placeholder-count=\"5\"><li><label class=\"check\" for=\"{{it.id}}\"><input type=\"checkbox\" id=\"{{it.id}}\" checked=\"{{it.checked}}\" sc-camel-on-change=\"{{it.toggle}}\"><span>{{it.text}}<\u002Fspan><\u002Flabel><\u002Fli><\u002Fsc-for>\n<\u002Ful>\n<div class=\"row\"><button class=\"btn-ghost sm\" sc-camel-on-click=\"{{ck.reset}}\">Desmarcar tudo<\u002Fbutton><\u002Fdiv>\n<button class=\"fav {{ck.favCls}}\" aria-pressed=\"{{ck.favPressed}}\" aria-label=\"{{ck.favAria}}\" sc-camel-on-click=\"{{ck.toggleFav}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{vBiblioteca}}\" hint-placeholder-val=\"{{false}}\">\n<section>\n<p class=\"eyebrow\">Biblioteca de aplicações<\u002Fp>\n<h1 class=\"h1\"><span class=\"v\">Aplicações<\u002Fspan> por necessidade real<\u002Fh1>\n<p class=\"lead\">Busque por tema, problema, ferramenta ou palavra-chave e combine filtros. Tutoriais, prompts, checklists, fluxos, guias e comparativos aparecem juntos.<\u002Fp>\n<\u002Fsection>\n<div class=\"lib\">\n<aside class=\"filters {{filtersOpenCls}}\" id=\"painel-filtros\" aria-label=\"Filtros\">\n<sc-for list=\"{{filterGroups}}\" as=\"fg\" hint-placeholder-count=\"6\">\n<fieldset class=\"fgroup\">\n<legend>{{fg.label}}<\u002Flegend>\n<div class=\"chips\">\n<sc-for list=\"{{fg.options}}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"chip {{o.cls}}\" aria-pressed=\"{{o.pressed}}\" sc-camel-on-click=\"{{o.toggle}}\">{{o.label}} <span class=\"chip-count\">{{o.count}}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Ffieldset>\n<\u002Fsc-for>\n<div><button class=\"btn-ghost\" sc-camel-on-click=\"{{clearFilters}}\" disabled=\"{{noActive}}\">Limpar filtros<\u002Fbutton><\u002Fdiv>\n<\u002Faside>\n<div class=\"lib-main\">\n<div class=\"lib-tools\">\n<div class=\"searchbar\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.35-4.35\"><\u002Fpath><\u002Fsvg>\n<label class=\"sr-only\" for=\"busca-biblioteca\">Buscar na biblioteca<\u002Flabel>\n<input id=\"busca-biblioteca\" type=\"search\" autocomplete=\"off\" placeholder=\"Buscar por título, problema, ferramenta ou palavra-chave\" value=\"{{libQ}}\" sc-camel-on-change=\"{{onLibQ}}\">\n<sc-if value=\"{{libHasQ}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn-ghost sm\" sc-camel-on-click=\"{{clearLibQ}}\">Limpar<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<button class=\"btn-ghost filters-toggle\" aria-expanded=\"{{filtersExpanded}}\" aria-controls=\"painel-filtros\" sc-camel-on-click=\"{{toggleFilters}}\">{{filtersBtnLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"lib-status\">\n<p class=\"count\" role=\"status\"><strong>{{libCount}}<\u002Fstrong> de {{libTotal}} conteúdos<\u002Fp>\n<sc-if value=\"{{hasActive}}\" hint-placeholder-val=\"{{false}}\"><button class=\"btn-link\" sc-camel-on-click=\"{{clearFilters}}\">Limpar busca e filtros<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{hasActive}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"row\" style=\"margin-bottom:18px\">\n<sc-for list=\"{{activeChips}}\" as=\"ac\" hint-placeholder-count=\"2\"><button class=\"chip-x\" sc-camel-on-click=\"{{ac.remove}}\" aria-label=\"Remover filtro {{ac.label}}\">{{ac.label}} <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{libHasResults}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"grid\">\n<sc-for list=\"{{libResults}}\" as=\"c\" hint-placeholder-count=\"6\">\n<article class=\"card\">\n<div class=\"card-top\"><span class=\"badge badge-type\">{{c.typeLabel}}<\u002Fspan><span class=\"badge badge-outline\">{{c.catLabel}}<\u002Fspan><sc-if value=\"{{c.partial}}\" hint-placeholder-val=\"{{false}}\"><span class=\"badge badge-warn\">Conteúdo inicial<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<h3 class=\"card-title\"><button class=\"card-link\" sc-camel-on-click=\"{{c.open}}\">{{c.title}}<\u002Fbutton><\u002Fh3>\n<p class=\"card-text\">{{c.summary}}<\u002Fp>\n<div class=\"card-meta\"><span>{{c.toolLabel}}<\u002Fspan><span>{{c.levelLabel}}<\u002Fspan><span>{{c.time}}<\u002Fspan><span>{{c.availLabel}}<\u002Fspan><\u002Fdiv>\n<button class=\"fav {{c.favCls}}\" aria-pressed=\"{{c.favPressed}}\" aria-label=\"{{c.favAria}}\" sc-camel-on-click=\"{{c.toggleFav}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{libEmpty}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"empty\">\n<h3>Nenhum conteúdo com essa combinação<\u002Fh3>\n<p>Remova um dos filtros ativos ou troque a busca por um termo mais geral. Os números ao lado de cada filtro mostram quantos resultados ele traria.<\u002Fp>\n<button class=\"btn-solid\" sc-camel-on-click=\"{{clearFilters}}\">Limpar busca e filtros<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{vApp}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"crumbs\">\n<button class=\"btn-ghost sm\" sc-camel-on-click=\"{{back}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5M12 19l-7-7 7-7\"><\u002Fpath><\u002Fsvg>{{backLabel}}<\u002Fbutton>\n<sc-for list=\"{{app.catLabels}}\" as=\"cl\" hint-placeholder-count=\"1\"><button class=\"chip\" sc-camel-on-click=\"{{cl.go}}\">{{cl.label}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"detail-head\">\n<div style=\"max-width:980px\">\n<p class=\"detail-num\">Aplicação {{app.n}}<\u002Fp>\n<h1 class=\"h1\">{{app.title}}<\u002Fh1>\n<p class=\"lead\">{{app.summary}}<\u002Fp>\n<div class=\"meta-row\">\n<sc-for list=\"{{app.toolSummary}}\" as=\"ts\" hint-placeholder-count=\"3\"><span class=\"badge {{ts.stCls}}\">{{ts.name}}: {{ts.stLabel}}<\u002Fspan><\u002Fsc-for>\n<span class=\"badge badge-outline\">{{app.levelLabel}}<\u002Fspan>\n<span class=\"badge badge-outline\">{{app.time}}<\u002Fspan>\n<span class=\"badge badge-outline\">{{app.availLabel}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<button class=\"btn-ghost {{app.favCls}}\" aria-pressed=\"{{app.favPressed}}\" sc-camel-on-click=\"{{app.toggleFav}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg>{{app.favLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{app.notFull}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"notice\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex:0 0 auto;margin-top:2px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 8v4M12 16h.01\"><\u002Fpath><\u002Fsvg><p><strong>Conteúdo inicial.<\u002Fstrong> Este guia rápido traz o essencial para começar: problema, resultado, passos, como fazer em cada ferramenta, prompt testável, refinamentos e checklist. Exemplo aplicado e erros comuns entram na próxima versão da biblioteca.<\u002Fp><\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"detail-grid\">\n<div>\n<section class=\"dsec\"><h2>Problema resolvido<\u002Fh2><p>{{app.problem}}<\u002Fp><\u002Fsection>\n<section class=\"dsec\"><h2>Resultado esperado<\u002Fh2><p>{{app.result}}<\u002Fp><\u002Fsection>\n<section class=\"dsec\"><h2>Quando utilizar<\u002Fh2><ul class=\"ul\"><sc-for list=\"{{app.when}}\" as=\"w\" hint-placeholder-count=\"3\"><li>{{w.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fsection>\n<sc-if value=\"{{app.hasBefore}}\" hint-placeholder-val=\"{{true}}\"><section class=\"dsec\"><h2>Antes de começar<\u002Fh2><ul class=\"ul\"><sc-for list=\"{{app.before}}\" as=\"w\" hint-placeholder-count=\"3\"><li>{{w.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fsection><\u002Fsc-if>\n<section class=\"dsec\"><h2>{{app.stepsTitle}}<\u002Fh2><p class=\"small muted\" style=\"margin-bottom:14px\">{{app.stepsNote}}<\u002Fp><ol class=\"steps\"><sc-for list=\"{{app.steps}}\" as=\"st\" hint-placeholder-count=\"4\"><li><span class=\"step-n\">{{st.n}}<\u002Fspan><span>{{st.text}}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Fol><\u002Fsection>\n<section class=\"dsec\" id=\"como-fazer\"><h2>Como fazer em cada ferramenta<\u002Fh2><p class=\"small muted\" style=\"margin-bottom:14px\">Mesma estrutura para ChatGPT, Claude e Gemini. A recomendação depende da tarefa e dos recursos de cada ferramenta, não de uma ordem fixa entre elas.<\u002Fp>\n<div class=\"tool-grid\">\n<sc-for list=\"{{app.toolCards}}\" as=\"tc\" hint-placeholder-count=\"3\">\n<article class=\"tool-card\">\n<div class=\"tool-head\"><h3>{{tc.name}}<\u002Fh3><span class=\"badge {{tc.stCls}}\">{{tc.stLabel}}<\u002Fspan><\u002Fdiv>\n<p class=\"tool-why\">{{tc.why}}<\u002Fp>\n<sc-if value=\"{{tc.hasAvail}}\" hint-placeholder-val=\"{{true}}\"><p class=\"tool-meta\"><b>Disponibilidade<\u002Fb>{{tc.avail}}<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{tc.hasWhen}}\" hint-placeholder-val=\"{{true}}\"><p class=\"tool-meta\"><b>Quando usar<\u002Fb>{{tc.when}}<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{tc.hasFeat}}\" hint-placeholder-val=\"{{true}}\"><div><p class=\"tool-label\">Recursos relevantes<\u002Fp><div class=\"tags\"><sc-for list=\"{{tc.feat}}\" as=\"ft\" hint-placeholder-count=\"2\"><span class=\"tag\">{{ft.text}}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{tc.hasHow}}\" hint-placeholder-val=\"{{true}}\"><div><p class=\"tool-label\">Como executar<\u002Fp><ol class=\"tool-steps\"><sc-for list=\"{{tc.how}}\" as=\"hw\" hint-placeholder-count=\"3\"><li>{{hw.text}}<\u002Fli><\u002Fsc-for><\u002Fol><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{tc.hasAdapt}}\" hint-placeholder-val=\"{{false}}\"><div class=\"prompt-box\"><div class=\"prompt-bar\"><span class=\"pb-label\">{{tc.adaptLabel}}<\u002Fspan><button class=\"btn-ghost sm\" sc-camel-on-click=\"{{tc.copyAdapt}}\">{{tc.adaptCopyLabel}}<\u002Fbutton><\u002Fdiv><pre class=\"prompt\">{{tc.adapt}}<\u002Fpre><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{tc.hasEq}}\" hint-placeholder-val=\"{{false}}\"><p class=\"tool-meta\"><b>Como fazer<\u002Fb>{{tc.eq}}<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{tc.hasEqApp}}\" hint-placeholder-val=\"{{false}}\"><div><button class=\"btn-link\" sc-camel-on-click=\"{{tc.openEq}}\">{{tc.eqLabel}} <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{tc.hasTip}}\" hint-placeholder-val=\"{{false}}\"><p class=\"tool-meta\"><b>Dica<\u002Fb>{{tc.tip}}<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{tc.hasLimits}}\" hint-placeholder-val=\"{{true}}\"><div><p class=\"tool-label\">Limitações<\u002Fp><ul class=\"tool-limits\"><sc-for list=\"{{tc.limits}}\" as=\"lm\" hint-placeholder-count=\"2\"><li>{{lm.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{tc.hasSources}}\" hint-placeholder-val=\"{{true}}\"><ul class=\"src-list tool-src\"><sc-for list=\"{{tc.sources}}\" as=\"sr\" hint-placeholder-count=\"2\"><li><a href=\"{{sr.url}}\" target=\"_blank\" rel=\"noopener noreferrer\">{{sr.title}}<\u002Fa><small>Fonte oficial · verificado em {{verifiedAt}}<\u002Fsmall><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fsc-if>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"dsec\"><h2>Prompt principal<\u002Fh2>\n<div class=\"prompt-box\"><div class=\"prompt-bar\"><span class=\"pb-label\">{{app.promptNote}}<\u002Fspan><button class=\"btn-solid sm\" sc-camel-on-click=\"{{app.copyPrompt}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg>{{app.promptCopyLabel}}<\u002Fbutton><\u002Fdiv><pre class=\"prompt\">{{app.prompt}}<\u002Fpre><\u002Fdiv>\n<\u002Fsection>\n<sc-if value=\"{{app.hasRef}}\" hint-placeholder-val=\"{{true}}\">\n<section class=\"dsec\"><h2>Refinamentos<\u002Fh2><p class=\"small muted\" style=\"margin-bottom:14px\">Use na mesma conversa, depois do primeiro resultado.<\u002Fp>\n<div class=\"ref-list\"><sc-for list=\"{{app.refinements}}\" as=\"r\" hint-placeholder-count=\"3\"><div class=\"ref\"><div><h3>{{r.t}}<\u002Fh3><p>{{r.p}}<\u002Fp><\u002Fdiv><button class=\"btn-ghost sm\" sc-camel-on-click=\"{{r.copy}}\">{{r.label}}<\u002Fbutton><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{app.hasExample}}\" hint-placeholder-val=\"{{true}}\">\n<section class=\"dsec\"><h2>Exemplo aplicado<\u002Fh2>\n<div class=\"example\"><h3>{{app.example.title}}<\u002Fh3><p class=\"small muted\" style=\"margin-bottom:12px\">{{app.example.context}}<\u002Fp><ul class=\"ul\"><sc-for list=\"{{app.example.lines}}\" as=\"w\" hint-placeholder-count=\"3\"><li>{{w.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<section class=\"dsec\"><h2>Checklist de qualidade<\u002Fh2><p class=\"small muted\" style=\"margin-bottom:10px\">{{app.checkDone}} de {{app.checkTotal}} itens conferidos<\u002Fp>\n<ul class=\"checks\"><sc-for list=\"{{app.checklist}}\" as=\"it\" hint-placeholder-count=\"5\"><li><label class=\"check\" for=\"{{it.id}}\"><input type=\"checkbox\" id=\"{{it.id}}\" checked=\"{{it.checked}}\" sc-camel-on-change=\"{{it.toggle}}\"><span>{{it.text}}<\u002Fspan><\u002Flabel><\u002Fli><\u002Fsc-for><\u002Ful>\n<\u002Fsection>\n<sc-if value=\"{{app.hasMistakes}}\" hint-placeholder-val=\"{{true}}\">\n<section class=\"dsec\"><h2>Erros comuns<\u002Fh2><div><sc-for list=\"{{app.mistakes}}\" as=\"m\" hint-placeholder-count=\"3\"><div class=\"mistake\"><span class=\"e\">{{m.e}}<\u002Fspan><span class=\"c\">Como corrigir: {{m.c}}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsection>\n<\u002Fsc-if>\n<section class=\"dsec\"><h2>Próximo passo<\u002Fh2>\n<div class=\"grid\">\n<sc-for list=\"{{app.next}}\" as=\"c\" hint-placeholder-count=\"3\">\n<article class=\"card\">\n<div class=\"card-top\"><span class=\"badge badge-type\">{{c.typeLabel}}<\u002Fspan><sc-if value=\"{{c.partial}}\" hint-placeholder-val=\"{{false}}\"><span class=\"badge badge-warn\">Conteúdo inicial<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<h3 class=\"card-title\"><button class=\"card-link\" sc-camel-on-click=\"{{c.open}}\">{{c.title}}<\u002Fbutton><\u002Fh3>\n<p class=\"card-text\">{{c.summary}}<\u002Fp>\n<button class=\"fav {{c.favCls}}\" aria-pressed=\"{{c.favPressed}}\" aria-label=\"{{c.favAria}}\" sc-camel-on-click=\"{{c.toggleFav}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<aside class=\"aside\" aria-label=\"Identificação\">\n<div class=\"panel\"><h2>Ferramentas<\u002Fh2><ul class=\"tool-sum\"><sc-for list=\"{{app.toolSummary}}\" as=\"ts\" hint-placeholder-count=\"3\"><li><span>{{ts.name}}<\u002Fspan><span class=\"badge {{ts.stCls}}\">{{ts.stLabel}}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful><p class=\"small muted\" style=\"margin:10px 0 0\">Detalhes, limites e fontes em \"Como fazer em cada ferramenta\".<\u002Fp><\u002Fdiv>\n<div class=\"panel\"><h2>Identificação<\u002Fh2>\n<dl class=\"kv\">\n<div><dt>Nível<\u002Fdt><dd>{{app.levelLabel}}<\u002Fdd><\u002Fdiv>\n<div><dt>Tempo estimado<\u002Fdt><dd>{{app.time}}<\u002Fdd><\u002Fdiv>\n<div><dt>Disponibilidade<\u002Fdt><dd>{{app.availLabel}}<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<\u002Fdiv>\n<div class=\"panel\"><h2>Requisitos<\u002Fh2><ul class=\"ul\" style=\"font-size:15px\"><sc-for list=\"{{app.reqs}}\" as=\"w\" hint-placeholder-count=\"2\"><li>{{w.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<div class=\"panel\"><h2>Palavras-chave<\u002Fh2><div class=\"tags\"><sc-for list=\"{{app.kw}}\" as=\"k\" hint-placeholder-count=\"5\"><span class=\"tag\">{{k.text}}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<sc-if value=\"{{app.hasSources}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"panel\"><h2>Fontes oficiais<\u002Fh2><ul class=\"src-list\"><sc-for list=\"{{app.sources}}\" as=\"sr\" hint-placeholder-count=\"2\"><li><a href=\"{{sr.url}}\" target=\"_blank\" rel=\"noopener noreferrer\">{{sr.title}}<\u002Fa><small>{{sr.tool}} · verificado em {{verifiedAt}}<\u002Fsmall><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"panel\"><h2>Privacidade<\u002Fh2><p style=\"margin:0;font-size:14px;line-height:1.6\" class=\"muted\">Não envie dados pessoais ou documentos confidenciais sem autorização e sem revisar as configurações de privacidade da sua conta.<\u002Fp><\u002Fdiv>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{vFluxos}}\" hint-placeholder-val=\"{{false}}\">\n<section>\n<p class=\"eyebrow\">Fluxos inteligentes<\u002Fp>\n<h1 class=\"h1\"><span class=\"v\">Processos completos,<\u002Fspan> etapa por etapa<\u002Fh1>\n<p class=\"lead\">Cada fluxo indica as ferramentas compatíveis, a recomendação por etapa quando ela muda, onde a revisão humana é obrigatória e o que pode ser agendado em plano pago.<\u002Fp>\n<\u002Fsection>\n<div class=\"callout sec\" style=\"margin-top:36px\">\n<h2>Três tipos de execução<\u002Fh2>\n<p><strong>Fluxo manual orientado por IA:<\u002Fstrong> você conduz cada etapa, copia o prompt, revisa o resultado e decide seguir. <strong>Parcialmente automatizado:<\u002Fstrong> uma etapa que se repete, como um lembrete ou um levantamento semanal, pode ser agendada em plano pago (tarefas agendadas no ChatGPT e no Claude, ações agendadas no Gemini). <strong>Automação executável:<\u002Fstrong> roda sozinha no horário definido, sem condução a cada vez. Nenhum fluxo desta biblioteca está nesse nível, e nenhum envia nada a terceiros sem revisão humana.<\u002Fp>\n<\u002Fdiv>\n<div class=\"grid sec\" style=\"margin-top:28px\">\n<sc-for list=\"{{flowCards}}\" as=\"c\" hint-placeholder-count=\"5\">\n<article class=\"card\">\n<div class=\"card-top\"><span class=\"badge {{c.modeCls}}\">{{c.modeLabel}}<\u002Fspan><span class=\"badge badge-outline\">{{c.stepCount}} etapas<\u002Fspan><\u002Fdiv>\n<h3 class=\"card-title\"><button class=\"card-link\" sc-camel-on-click=\"{{c.open}}\">{{c.title}}<\u002Fbutton><\u002Fh3>\n<p class=\"card-text\">{{c.summary}}<\u002Fp>\n<div class=\"tags\"><sc-for list=\"{{c.stepNames}}\" as=\"sn\" hint-placeholder-count=\"5\"><span class=\"tag\">{{sn.n}}. {{sn.text}}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<div class=\"card-meta\"><span>{{c.toolLabel}}<\u002Fspan><span>{{c.levelLabel}}<\u002Fspan><span>{{c.time}}<\u002Fspan><\u002Fdiv>\n<button class=\"fav {{c.favCls}}\" aria-pressed=\"{{c.favPressed}}\" aria-label=\"{{c.favAria}}\" sc-camel-on-click=\"{{c.toggleFav}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{vFlow}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"crumbs\"><button class=\"btn-ghost sm\" sc-camel-on-click=\"{{back}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5M12 19l-7-7 7-7\"><\u002Fpath><\u002Fsvg>{{backLabel}}<\u002Fbutton><\u002Fdiv>\n<div class=\"detail-head\">\n<div style=\"max-width:980px\">\n<p class=\"detail-num\">Fluxo inteligente<\u002Fp>\n<h1 class=\"h1\">{{flow.title}}<\u002Fh1>\n<p class=\"lead\">{{flow.summary}}<\u002Fp>\n<div class=\"meta-row\"><span class=\"badge {{flow.modeCls}}\">{{flow.modeLabel}}<\u002Fspan><span class=\"badge badge-outline\">{{flow.toolLabel}}<\u002Fspan><span class=\"badge badge-outline\">{{flow.levelLabel}}<\u002Fspan><span class=\"badge badge-outline\">{{flow.time}}<\u002Fspan><span class=\"badge badge-outline\">{{flow.availLabel}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<button class=\"btn-ghost {{flow.favCls}}\" aria-pressed=\"{{flow.favPressed}}\" sc-camel-on-click=\"{{flow.toggleFav}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg>{{flow.favLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"notice info\"><p><strong>{{flow.modeLabel}}.<\u002Fstrong> {{flow.modeNote}}<\u002Fp><\u002Fdiv>\n<div class=\"detail-grid\">\n<div>\n<section class=\"dsec\"><h2>Objetivo<\u002Fh2><p>{{flow.goal}}<\u002Fp><\u002Fsection>\n<section class=\"dsec\"><h2>Etapas<\u002Fh2>\n<ol class=\"flow-steps\">\n<sc-for list=\"{{flow.steps}}\" as=\"st\" hint-placeholder-count=\"5\">\n<li class=\"flow-step\"><span class=\"flow-n\">{{st.n}}<\u002Fspan>\n<div class=\"flow-body\">\n<div class=\"row\"><h3>{{st.name}}<\u002Fh3><span class=\"badge badge-outline\">{{st.tool}}<\u002Fspan><sc-if value=\"{{st.review}}\" hint-placeholder-val=\"{{false}}\"><span class=\"badge badge-warn\">Revisão humana<\u002Fspan><\u002Fsc-if><sc-if value=\"{{st.auto}}\" hint-placeholder-val=\"{{false}}\"><span class=\"badge badge-ok\">Agendável em plano pago<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<p>{{st.text}}<\u002Fp>\n<sc-if value=\"{{st.hasTips}}\" hint-placeholder-val=\"{{false}}\"><div class=\"step-tips\"><sc-for list=\"{{st.tips}}\" as=\"tp\" hint-placeholder-count=\"3\"><p class=\"gem-step\"><b>{{tp.name}}:<\u002Fb> {{tp.text}}<\u002Fp><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{st.hasPrompt}}\" hint-placeholder-val=\"{{true}}\"><div class=\"prompt-box\"><div class=\"prompt-bar\"><span class=\"pb-label\">Prompt da etapa<\u002Fspan><button class=\"btn-ghost sm\" sc-camel-on-click=\"{{st.copy}}\">{{st.label}}<\u002Fbutton><\u002Fdiv><pre class=\"prompt\">{{st.prompt}}<\u002Fpre><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{st.hasLink}}\" hint-placeholder-val=\"{{false}}\"><div><button class=\"btn-link\" sc-camel-on-click=\"{{st.openLink}}\">{{st.linkLabel}} <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fsection>\n<section class=\"dsec\"><h2>Entregável final<\u002Fh2><p>{{flow.deliverable}}<\u002Fp><\u002Fsection>\n<\u002Fdiv>\n<aside class=\"aside\">\n<div class=\"panel\"><h2>Ferramentas compatíveis<\u002Fh2><ul class=\"tool-sum tool-sum-col\"><sc-for list=\"{{flow.compat}}\" as=\"cp\" hint-placeholder-count=\"3\"><li><span>{{cp.name}}<\u002Fspan><small>{{cp.text}}<\u002Fsmall><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<div class=\"panel\"><h2>Entradas necessárias<\u002Fh2><ul class=\"ul\" style=\"font-size:15px\"><sc-for list=\"{{flow.inputs}}\" as=\"w\" hint-placeholder-count=\"3\"><li>{{w.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<sc-if value=\"{{flow.hasNeeds}}\" hint-placeholder-val=\"{{true}}\"><div class=\"panel\"><h2>Recursos necessários<\u002Fh2><ul class=\"ul\" style=\"font-size:15px\"><sc-for list=\"{{flow.needs}}\" as=\"w\" hint-placeholder-count=\"2\"><li>{{w.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{flow.hasLimits}}\" hint-placeholder-val=\"{{true}}\"><div class=\"panel\"><h2>Limitações<\u002Fh2><ul class=\"ul\" style=\"font-size:15px\"><sc-for list=\"{{flow.limits}}\" as=\"w\" hint-placeholder-count=\"2\"><li>{{w.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{flow.hasAuto}}\" hint-placeholder-val=\"{{false}}\"><div class=\"panel\"><h2>Etapa agendável<\u002Fh2><p class=\"small muted\" style=\"margin:0 0 10px\">Agendar uma etapa não torna o fluxo automático: decisões e envios continuam com você.<\u002Fp><ul class=\"tool-sum tool-sum-col\"><sc-for list=\"{{flow.autoTools}}\" as=\"cp\" hint-placeholder-count=\"3\"><li><span>{{cp.name}}<\u002Fspan><small>{{cp.text}}<\u002Fsmall><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv><\u002Fsc-if>\n<div class=\"panel\"><h2>Pontos de revisão humana<\u002Fh2><p style=\"margin:0;font-size:15px;line-height:1.6\">As etapas marcadas com \"Revisão humana\" exigem que você confira o resultado antes de seguir. Informações factuais, valores e qualquer envio a terceiros sempre passam por você.<\u002Fp><\u002Fdiv>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{vPrompting}}\" hint-placeholder-val=\"{{false}}\">\n<section>\n<p class=\"eyebrow\">Boas práticas de prompting<\u002Fp>\n<h1 class=\"h1\"><span class=\"v\">Como escrever<\u002Fspan> comandos melhores<\u002Fh1>\n<p class=\"lead\">{{promptIntro}}<\u002Fp>\n<\u002Fsection>\n<div class=\"callout sec\" style=\"margin-top:36px\">\n<h2>Não existe palavra mágica<\u002Fh2>\n<p>Frases como \"aja como especialista\" ajudam a definir o papel, mas sozinhas não garantem qualidade. O que muda o resultado é a combinação de objetivo, contexto, público, referências, formato e revisão. Teste, compare e guarde os prompts que funcionam para você.<\u002Fp>\n<\u002Fdiv>\n<section class=\"sec\" aria-labelledby=\"t-princ\">\n<div class=\"sec-head\"><div><h2 class=\"h2\" id=\"t-princ\">Doze princípios com exemplos<\u002Fh2><p class=\"h2-sub\">Cada princípio mostra um comando vago e uma versão melhorada.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"principles\">\n<sc-for list=\"{{principles}}\" as=\"p\" hint-placeholder-count=\"6\">\n<article class=\"principle\"><span class=\"pn\">{{p.n}}<\u002Fspan><h3>{{p.title}}<\u002Fh3><p>{{p.text}}<\u002Fp>\n<div class=\"vs\"><div class=\"bad\"><strong>Comando vago<\u002Fstrong>{{p.bad}}<\u002Fdiv><div class=\"good\"><strong>Versão melhorada<\u002Fstrong>{{p.good}}<\u002Fdiv><\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" aria-labelledby=\"t-part\">\n<div class=\"sec-head\"><div><h2 class=\"h2\" id=\"t-part\">Particularidades de cada ferramenta<\u002Fh2><p class=\"h2-sub\">Os princípios valem para as três. Estes detalhes mudam a forma de aplicar em cada uma.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"tool-grid\">\n<sc-for list=\"{{toolNotes}}\" as=\"tn\" hint-placeholder-count=\"3\">\n<article class=\"tool-card\"><div class=\"tool-head\"><h3>{{tn.name}}<\u002Fh3><\u002Fdiv><ul class=\"tool-limits\" style=\"color:var(--t1)\"><sc-for list=\"{{tn.items}}\" as=\"ti\" hint-placeholder-count=\"3\"><li>{{ti.text}}<\u002Fli><\u002Fsc-for><\u002Ful><ul class=\"src-list tool-src\"><sc-for list=\"{{tn.sources}}\" as=\"sr\" hint-placeholder-count=\"2\"><li><a href=\"{{sr.url}}\" target=\"_blank\" rel=\"noopener noreferrer\">{{sr.title}}<\u002Fa><small>Fonte oficial<\u002Fsmall><\u002Fli><\u002Fsc-for><\u002Ful><\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" aria-labelledby=\"t-tpl\">\n<div class=\"sec-head\"><div><h2 class=\"h2\" id=\"t-tpl\">Modelos de prompt<\u002Fh2><p class=\"h2-sub\">Copie, troque o que está entre colchetes e ajuste ao seu caso.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"tpl-grid\">\n<sc-for list=\"{{templates}}\" as=\"t\" hint-placeholder-count=\"4\">\n<div class=\"prompt-box\" id=\"modelo-{{t.id}}\"><div class=\"prompt-bar\"><span class=\"pb-label\">{{t.title}}<\u002Fspan><div class=\"row\" style=\"gap:6px\"><button class=\"fav {{t.favCls}}\" style=\"position:static\" aria-pressed=\"{{t.favPressed}}\" aria-label=\"{{t.favAria}}\" sc-camel-on-click=\"{{t.toggleFav}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg><\u002Fbutton><button class=\"btn-solid sm\" sc-camel-on-click=\"{{t.copy}}\">{{t.label}}<\u002Fbutton><\u002Fdiv><\u002Fdiv><pre class=\"prompt\">{{t.prompt}}<\u002Fpre><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{vComparativo}}\" hint-placeholder-val=\"{{false}}\">\n<section>\n<p class=\"eyebrow\">Comparativo<\u002Fp>\n<h1 class=\"h1\"><span class=\"v\">ChatGPT, Claude e Gemini,<\u002Fspan> recurso por recurso<\u002Fh1>\n<p class=\"lead\">O que cada ferramenta oferece, como usar, limitações conhecidas e a fonte oficial de cada informação. Nenhuma delas é superior em tudo: a escolha depende da tarefa, do seu plano e de onde seu trabalho já está.<\u002Fp>\n<div class=\"meta-row\"><span class=\"badge st-verificado\">Verificado<\u002Fspan><span class=\"badge st-parcial\">Verificado em parte<\u002Fspan><span class=\"badge st-pendente\">Pendente de confirmação<\u002Fspan><span class=\"badge badge-outline\">Última verificação: {{verifiedAt}}<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<div class=\"callout sec\" style=\"margin-top:36px\">\n<h2>Como decidir<\u002Fh2>\n<ul class=\"ul\"><sc-for list=\"{{criteria}}\" as=\"w\" hint-placeholder-count=\"4\"><li>{{w.text}}<\u002Fli><\u002Fsc-for><\u002Ful>\n<\u002Fdiv>\n<section class=\"sec\" aria-labelledby=\"t-task\">\n<div class=\"sec-head\"><div><h2 class=\"h2\" id=\"t-task\">Qual ferramenta faz mais sentido para a tarefa?<\u002Fh2><p class=\"h2-sub\">Um resumo por objetivo. Os detalhes, limites e fontes estão nos recursos comparados logo abaixo.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"table-wrap\"><sc-raw-table class=\"task-table\"><sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\">Tarefa<\u002Fsc-raw-th><sc-raw-th scope=\"col\">ChatGPT<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Claude<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Gemini<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Faz sentido quando<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n<sc-for list=\"{{byTask}}\" as=\"bt\" hint-placeholder-count=\"6\"><sc-raw-tr><sc-raw-td>{{bt.task}}<\u002Fsc-raw-td><sc-raw-td>{{bt.chatgpt}}<\u002Fsc-raw-td><sc-raw-td>{{bt.claude}}<\u002Fsc-raw-td><sc-raw-td>{{bt.gemini}}<\u002Fsc-raw-td><sc-raw-td class=\"hint\">{{bt.hint}}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for>\n<\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" aria-label=\"Recursos comparados\">\n<sc-for list=\"{{compare}}\" as=\"r\" hint-placeholder-count=\"4\">\n<article class=\"cmp {{r.focusCls}}\" id=\"{{r.anchor}}\">\n<div class=\"cmp-head\"><h3>{{r.title}}<\u002Fh3><span class=\"badge {{r.statusCls}}\">{{r.statusLabel}}<\u002Fspan><\u002Fdiv>\n<p class=\"cmp-what\">{{r.what}}<\u002Fp>\n<div class=\"cmp-cols\">\n<sc-for list=\"{{r.cols}}\" as=\"col\" hint-placeholder-count=\"2\">\n<div class=\"cmp-col\">\n<div class=\"cmp-tool\"><strong>{{col.tool}}<\u002Fstrong><span class=\"badge {{col.hasCls}}\">{{col.hasLabel}}<\u002Fspan><\u002Fdiv>\n<p>{{col.text}}<\u002Fp>\n<h4>Como usar<\u002Fh4><p>{{col.how}}<\u002Fp>\n<h4>Limitações conhecidas<\u002Fh4><p>{{col.limits}}<\u002Fp>\n<h4>Fonte oficial<\u002Fh4>\n<ul class=\"src-list\"><sc-for list=\"{{col.sources}}\" as=\"sr\" hint-placeholder-count=\"1\"><li><a href=\"{{sr.url}}\" target=\"_blank\" rel=\"noopener noreferrer\">{{sr.title}}<\u002Fa><\u002Fli><\u002Fsc-for><\u002Ful>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p class=\"cmp-foot\">Última verificação: {{verifiedAt}}<\u002Fp>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fsection>\n<section class=\"sec\" id=\"fontes-verificacao\" aria-labelledby=\"t-fontes\" style=\"scroll-margin-top:120px\">\n<div class=\"sec-head\"><div><h2 class=\"h2\" id=\"t-fontes\">Fontes e verificação<\u002Fh2><p class=\"h2-sub\">{{verifyNote}}<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"panel\"><ul class=\"src-list\" style=\"columns:2 320px;column-gap:32px;display:block\"><sc-for list=\"{{allSources}}\" as=\"sr\" hint-placeholder-count=\"6\"><li style=\"break-inside:avoid;margin-bottom:12px\"><a href=\"{{sr.url}}\" target=\"_blank\" rel=\"noopener noreferrer\">{{sr.title}}<\u002Fa><small>{{sr.tool}}<\u002Fsmall><\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{vGlossario}}\" hint-placeholder-val=\"{{false}}\">\n<section>\n<p class=\"eyebrow\">Glossário de IA<\u002Fp>\n<h1 class=\"h1\"><span class=\"v\">Termos explicados<\u002Fspan> sem complicação<\u002Fh1>\n<p class=\"lead\">Explicações curtas, exemplos do dia a dia e relações entre conceitos. Nomes comerciais de produtos aparecem marcados para não serem confundidos com conceitos técnicos.<\u002Fp>\n<\u002Fsection>\n<div class=\"panel sec\" style=\"margin-top:32px\">\n<div class=\"searchbar\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.35-4.35\"><\u002Fpath><\u002Fsvg>\n<label class=\"sr-only\" for=\"busca-glossario\">Buscar no glossário<\u002Flabel>\n<input id=\"busca-glossario\" type=\"search\" autocomplete=\"off\" placeholder=\"Buscar termo, significado ou exemplo\" value=\"{{glossQ}}\" sc-camel-on-change=\"{{onGlossQ}}\">\n<\u002Fdiv>\n<div class=\"row\" style=\"margin-top:14px\"><sc-for list=\"{{kindChips}}\" as=\"k\" hint-placeholder-count=\"4\"><button class=\"chip {{k.cls}}\" aria-pressed=\"{{k.pressed}}\" sc-camel-on-click=\"{{k.go}}\">{{k.label}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"count\" role=\"status\" style=\"margin:22px 0 16px\"><strong>{{termCount}}<\u002Fstrong> termo(s)<\u002Fp>\n<sc-if value=\"{{termHas}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"terms\">\n<sc-for list=\"{{terms}}\" as=\"t\" hint-placeholder-count=\"6\">\n<article class=\"term {{t.focusCls}}\" id=\"{{t.anchor}}\">\n<div class=\"row\"><span class=\"badge {{t.kindCls}}\">{{t.kindLabel}}<\u002Fspan><\u002Fdiv>\n<h3>{{t.term}}<\u002Fh3>\n<dl>\n<div><dt>O que significa<\u002Fdt><dd>{{t.meaning}}<\u002Fdd><\u002Fdiv>\n<div><dt>Para que serve<\u002Fdt><dd>{{t.use}}<\u002Fdd><\u002Fdiv>\n<div><dt>Exemplo<\u002Fdt><dd>{{t.example}}<\u002Fdd><\u002Fdiv>\n<sc-if value=\"{{t.hasByTool}}\" hint-placeholder-val=\"{{false}}\"><div><dt>Em cada ferramenta<\u002Fdt><dd><ul class=\"term-tools\"><sc-for list=\"{{t.byTool}}\" as=\"bt\" hint-placeholder-count=\"3\"><li><b>{{bt.name}}:<\u002Fb> {{bt.text}}<\u002Fli><\u002Fsc-for><\u002Ful><\u002Fdd><\u002Fdiv><\u002Fsc-if>\n<div><dt>Relacionado a<\u002Fdt><dd><div class=\"rel\"><sc-for list=\"{{t.rel}}\" as=\"r\" hint-placeholder-count=\"3\"><a href=\"{{r.href}}\" sc-camel-on-click=\"{{r.go}}\">{{r.label}}<\u002Fa><\u002Fsc-for><\u002Fdiv><\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<button class=\"fav {{t.favCls}}\" aria-pressed=\"{{t.favPressed}}\" aria-label=\"{{t.favAria}}\" sc-camel-on-click=\"{{t.toggleFav}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{termEmpty}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"empty\"><h3>Nenhum termo encontrado<\u002Fh3><p>Tente outra palavra ou volte a mostrar todos os tipos de termo.<\u002Fp><button class=\"btn-ghost\" sc-camel-on-click=\"{{clearGlossQ}}\">Mostrar todos os termos<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<sc-if value=\"{{vMinha}}\" hint-placeholder-val=\"{{false}}\">\n<section>\n<p class=\"eyebrow\">Minha biblioteca<\u002Fp>\n<h1 class=\"h1\"><span class=\"v\">Favoritos e checklists<\u002Fspan> em andamento<\u002Fh1>\n<p class=\"lead\">Salve conteúdos com o ícone de marcador e acompanhe os checklists que você começou a conferir.<\u002Fp>\n<\u002Fsection>\n<sc-if value=\"{{storageOn}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"notice info\"><p><strong>Salvo neste navegador.<\u002Fstrong> Seus favoritos e checklists ficam guardados neste navegador e neste dispositivo. Eles não sincronizam com outros aparelhos nem com outras pessoas, e somem se o histórico do navegador for limpo. Use \"Copiar lista\" para guardar uma cópia.<\u002Fp><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{storageOff}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"notice\"><p><strong>Favoritos só nesta sessão.<\u002Fstrong> O armazenamento do navegador não está disponível neste ambiente. Você pode marcar favoritos e checklists normalmente, mas eles serão perdidos ao fechar ou recarregar a página. Use \"Copiar lista\" para guardar uma cópia.<\u002Fp><\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"row sec\" style=\"margin-top:24px\"><button class=\"btn-solid\" sc-camel-on-click=\"{{exportFavs}}\">{{exportLabel}}<\u002Fbutton><button class=\"btn-ghost\" sc-camel-on-click=\"{{clearAll}}\">Limpar Minha biblioteca<\u002Fbutton><\u002Fdiv>\n<sc-if value=\"{{noFavs}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"empty sec\" style=\"margin-top:32px\"><h3>Você ainda não salvou nenhum conteúdo<\u002Fh3><p>Abra a biblioteca e toque no ícone de marcador dos tutoriais, fluxos, prompts e termos que quer consultar depois.<\u002Fp><button class=\"btn-solid\" sc-camel-on-click=\"{{goLibrary}}\">Explorar a biblioteca<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{hasFavCards}}\" hint-placeholder-val=\"{{false}}\">\n<section class=\"sec\" aria-labelledby=\"t-favs\"><div class=\"sec-head\"><h2 class=\"h2\" id=\"t-favs\">Conteúdos salvos<\u002Fh2><\u002Fdiv>\n<div class=\"grid\">\n<sc-for list=\"{{favCards}}\" as=\"c\" hint-placeholder-count=\"3\">\n<article class=\"card\">\n<div class=\"card-top\"><span class=\"badge badge-type\">{{c.typeLabel}}<\u002Fspan><span class=\"badge badge-outline\">{{c.catLabel}}<\u002Fspan><\u002Fdiv>\n<h3 class=\"card-title\"><button class=\"card-link\" sc-camel-on-click=\"{{c.open}}\">{{c.title}}<\u002Fbutton><\u002Fh3>\n<p class=\"card-text\">{{c.summary}}<\u002Fp>\n<button class=\"fav {{c.favCls}}\" aria-pressed=\"{{c.favPressed}}\" aria-label=\"{{c.favAria}}\" sc-camel-on-click=\"{{c.toggleFav}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{hasFavTerms}}\" hint-placeholder-val=\"{{false}}\">\n<section class=\"sec\" aria-labelledby=\"t-favterms\"><div class=\"sec-head\"><h2 class=\"h2\" id=\"t-favterms\">Termos salvos<\u002Fh2><\u002Fdiv>\n<div class=\"guide-links\">\n<sc-for list=\"{{favTerms}}\" as=\"t\" hint-placeholder-count=\"3\"><div class=\"row\" style=\"gap:6px;flex-wrap:nowrap\"><button class=\"guide-link\" style=\"flex:1\" sc-camel-on-click=\"{{t.open}}\">{{t.term}}<\u002Fbutton><button class=\"fav is-on\" style=\"position:static\" aria-pressed=\"true\" aria-label=\"{{t.aria}}\" sc-camel-on-click=\"{{t.remove}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{hasProgress}}\" hint-placeholder-val=\"{{false}}\">\n<section class=\"sec\" aria-labelledby=\"t-prog\"><div class=\"sec-head\"><h2 class=\"h2\" id=\"t-prog\">Checklists em andamento<\u002Fh2><\u002Fdiv>\n<div class=\"grid\">\n<sc-for list=\"{{progress}}\" as=\"p\" hint-placeholder-count=\"2\">\n<article class=\"card\"><h3 class=\"card-title\"><button class=\"card-link\" sc-camel-on-click=\"{{p.open}}\">{{p.title}}<\u002Fbutton><\u002Fh3><p class=\"card-text\">{{p.done}} de {{p.total}} itens conferidos<\u002Fp><div class=\"progress\" aria-hidden=\"true\"><span style=\"{{p.pct}}\"><\u002Fspan><\u002Fdiv><\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer class=\"wrap footer-wrap\"><div class=\"footer\">\n<p>3ADS EDU AI Playbook, versão {{version}}. Informações sobre recursos e planos verificadas em {{verifiedAt}} nas fontes oficiais indicadas em cada conteúdo.<\u002Fp>\n<p><button class=\"btn-link\" sc-camel-on-click=\"{{goFontes}}\">Ver fontes e verificação<\u002Fbutton><\u002Fp>\n<\u002Fdiv><\u002Ffooter>\n<div class=\"toast {{toastCls}}\" role=\"status\" aria-live=\"polite\">{{toast}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3600}}\">\n/* =========================================================\n   3ADS EDU AI PLAYBOOK · BIBLIOTECA DE CONTEÚDO\n   Os dados ficam separados da interface. Para incluir uma\n   nova aplicação, categoria, ferramenta ou termo, edite\n   apenas os objetos abaixo, mantendo os ids únicos.\n   ========================================================= */\nconst PLAYBOOK = {};\n\nPLAYBOOK.meta = {\n  version: '1.0',\n  verifiedAt: '19/11/2026',\n  verifyNote: 'Recursos, planos e limites mudam com frequência. Cada informação variável traz a fonte oficial e a data em que foi conferida. As páginas da OpenAI foram conferidas pelos trechos indexados da própria central de ajuda, porque a leitura direta da página foi bloqueada no momento da verificação.'\n};\n\nPLAYBOOK.tools = {\n  chatgpt: { id: 'chatgpt', label: 'ChatGPT', maker: 'OpenAI' },\n  claude: { id: 'claude', label: 'Claude', maker: 'Anthropic' }\n};\n\nPLAYBOOK.categories = [\n  { id: 'educacao', label: 'Educação e ensino', desc: 'Aulas, avaliações, trilhas de estudo e adaptação de conteúdo.' },\n  { id: 'design', label: 'Design e materiais visuais', desc: 'Imagens, infográficos, roteiros e materiais com identidade.' },\n  { id: 'marketing', label: 'Marketing e conteúdo', desc: 'Textos, campanhas, roteiros e peças de comunicação.' },\n  { id: 'comercial', label: 'Comercial e vendas', desc: 'Propostas, reuniões, objeções e apresentações de serviço.' },\n  { id: 'produtividade', label: 'Produtividade pessoal', desc: 'Agenda, e-mails, resumos e rotinas do dia a dia.' },\n  { id: 'gestao', label: 'Gestão e organização', desc: 'Processos, reuniões, arquivos e bases de conhecimento.' },\n  { id: 'pesquisa', label: 'Pesquisa e análise', desc: 'Pesquisa com fontes, leitura de dados e documentos.' },\n  { id: 'assistentes', label: 'Assistentes e agentes', desc: 'Projetos, instruções e assistentes especializados.' },\n  { id: 'documentos', label: 'Documentos e apresentações', desc: 'Relatórios, propostas, slides e arquivos editáveis.' },\n  { id: 'automacao', label: 'Automação de processos', desc: 'Fluxos com etapas, tarefas agendadas e integrações.' }\n];\n\nPLAYBOOK.objectives = [\n  { id: 'criar', label: 'Criar' },\n  { id: 'pesquisar', label: 'Pesquisar' },\n  { id: 'organizar', label: 'Organizar' },\n  { id: 'analisar', label: 'Analisar' },\n  { id: 'automatizar', label: 'Automatizar' },\n  { id: 'planejar', label: 'Planejar' },\n  { id: 'revisar', label: 'Revisar' }\n];\n\nPLAYBOOK.levels = [\n  { id: 'iniciante', label: 'Iniciante' },\n  { id: 'intermediario', label: 'Intermediário' },\n  { id: 'avancado', label: 'Avançado' }\n];\n\nPLAYBOOK.types = [\n  { id: 'tutorial', label: 'Tutorial' },\n  { id: 'prompt', label: 'Prompt' },\n  { id: 'checklist', label: 'Checklist' },\n  { id: 'fluxo', label: 'Fluxo' },\n  { id: 'guia', label: 'Guia' },\n  { id: 'comparativo', label: 'Comparativo' }\n];\n\nPLAYBOOK.availability = [\n  { id: 'gratuito', label: 'Gratuito' },\n  { id: 'pago', label: 'Pago' },\n  { id: 'depende', label: 'Depende do plano ou recurso' }\n];\n\n/* Fontes oficiais. Use o id em \"src\" de qualquer conteúdo. */\nPLAYBOOK.sources = {\n  C1: { tool: 'claude', title: 'Planos e preços do Claude', url: 'https://claude.com/pricing' },\n  C2: { tool: 'claude', title: 'O que são projetos', url: 'https://support.claude.com/pt/articles/9517075-o-que-sao-projetos' },\n  C3: { tool: 'claude', title: 'O que são artefatos e como usá-los', url: 'https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them' },\n  C4: { tool: 'claude', title: 'Busca em conversas e memória do Claude', url: 'https://support.claude.com/en/articles/11817273' },\n  C5: { tool: 'claude', title: 'Enviar arquivos para o Claude', url: 'https://support.claude.com/en/articles/8241126-upload-files-to-claude' },\n  C6: { tool: 'claude', title: 'Ativar e usar a pesquisa na web', url: 'https://support.claude.com/en/articles/10684626-enable-and-use-web-search' },\n  C7: { tool: 'claude', title: 'Usar o Research no Claude', url: 'https://support.claude.com/en/articles/11088861-use-research-on-claude' },\n  C8: { tool: 'claude', title: 'Criar e editar arquivos com o Claude', url: 'https://support.claude.com/en/articles/12111783-create-and-edit-files-with-claude' },\n  C9: { tool: 'claude', title: 'Primeiros passos com o Claude Cowork', url: 'https://support.claude.com/en/articles/13345190-get-started-with-claude-cowork' },\n  C10: { tool: 'claude', title: 'O Claude pode produzir imagens?', url: 'https://support.claude.com/en/articles/9002504-can-claude-produce-images' },\n  C11: { tool: 'claude', title: 'Recursos de personalização do Claude', url: 'https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features' },\n  C12: { tool: 'claude', title: 'Configurar e usar estilos', url: 'https://support.claude.com/en/articles/10181068' },\n  C13: { tool: 'claude', title: 'Agendar tarefas recorrentes', url: 'https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork' },\n  C14: { tool: 'claude', title: 'Configurações de privacidade e treinamento', url: 'https://privacy.claude.com/en/articles/12109829-how-do-i-change-my-model-improvement-privacy-settings' },\n  C15: { tool: 'claude', title: 'Boas práticas de prompting (Anthropic)', url: 'https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices' },\n  C16: { tool: 'claude', title: 'Visuais personalizados no chat', url: 'https://support.claude.com/en/articles/13979539-visuals-in-claude' },\n  O1: { tool: 'chatgpt', title: 'Planos e preços do ChatGPT', url: 'https://chatgpt.com/pricing' },\n  O2: { tool: 'chatgpt', title: 'Projetos no ChatGPT', url: 'https://help.openai.com/pt-br/articles/10169521-projects-in-chatgpt' },\n  O3: { tool: 'chatgpt', title: 'Memória no ChatGPT (FAQ)', url: 'https://help.openai.com/en/articles/8590148-memory-faq' },\n  O4: { tool: 'chatgpt', title: 'Envio de arquivos (FAQ)', url: 'https://help.openai.com/en/articles/8555545-file-uploads-faq' },\n  O5: { tool: 'chatgpt', title: 'Deep research no ChatGPT', url: 'https://help.openai.com/en/articles/10500283-deep-research-faq' },\n  O6: { tool: 'chatgpt', title: 'Imagens no ChatGPT', url: 'https://help.openai.com/en/articles/9055440' },\n  O7: { tool: 'chatgpt', title: 'Blocos de escrita e blocos de código', url: 'https://help.openai.com/pt-br/articles/20001246-working-with-writing-blocks-and-code-blocks-in-chatgpt' },\n  O8: { tool: 'chatgpt', title: 'ChatGPT Work e Codex', url: 'https://help.openai.com/en/articles/20001275' },\n  O9: { tool: 'chatgpt', title: 'Criar e editar GPTs', url: 'https://help.openai.com/en/articles/8554397-creating-a-gpt' },\n  O10: { tool: 'chatgpt', title: 'Plugins no ChatGPT e no Codex', url: 'https://help.openai.com/en/articles/20001256-plugins-in-chatgpt-and-codex' },\n  O11: { tool: 'chatgpt', title: 'Tarefas agendadas no ChatGPT', url: 'https://help.openai.com/en/articles/10291617' },\n  O12: { tool: 'chatgpt', title: 'App do ChatGPT para desktop', url: 'https://help.openai.com/en/articles/9275200-downloading-the-chatgpt-macos-app' },\n  O13: { tool: 'chatgpt', title: 'Instruções personalizadas', url: 'https://help.openai.com/en/articles/8096356' },\n  O14: { tool: 'chatgpt', title: 'Personalidade do ChatGPT', url: 'https://help.openai.com/en/articles/11899719' },\n  O15: { tool: 'chatgpt', title: 'Controles de dados no ChatGPT', url: 'https://help.openai.com/en/articles/7730893-data-controls-faq' }\n};\n\n/* =========================================================\n   COMPARATIVO CHATGPT x CLAUDE\n   status: 'verificado' | 'parcial' | 'pendente'\n   ========================================================= */\nPLAYBOOK.compare = [\n  {\n    id: 'cmp-visao', title: 'Funcionalidades disponíveis',\n    what: 'O conjunto de modos de trabalho que cada produto oferece hoje, além da conversa simples.',\n    chatgpt: { has: 'sim', text: 'Três modos principais: Chat para conversas rápidas, Work para tarefas longas com várias etapas e entregáveis prontos, e Codex para desenvolvimento de software.', how: 'Escolha o modo na própria interface (Chat ou Work). O Codex fica separado e é voltado a código.', limits: 'O acesso ao Work e o volume de uso variam por plano e por configuração do workspace.', src: ['O8', 'O1'] },\n    claude: { has: 'sim', text: 'Conversa com pesquisa na web, artefatos (documentos, apresentações, designs), criação de arquivos, Cowork para tarefas com várias etapas e Claude Code para programação.', how: 'Conversa e artefatos estão no claude.ai e nos apps. Cowork e Claude Code exigem plano pago.', limits: 'Cowork, Claude Code, Research e Claude in Chrome não fazem parte do plano gratuito.', src: ['C1', 'C9'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-projetos', title: 'Projetos',\n    what: 'Espaços de trabalho que reúnem conversas, arquivos de referência e instruções sobre um mesmo assunto.',\n    chatgpt: { has: 'sim', text: 'Disponível para usuários conectados, inclusive no plano gratuito. O projeto guarda conversas, arquivos e instruções, e tem memória própria.', how: 'Barra lateral, opção de novo projeto. Dentro dele, adicione arquivos e instruções.', limits: 'Arquivos por projeto: até 5 no Free e até 25 no Go e no Plus, segundo a central de ajuda. Planos superiores têm limites maiores.', src: ['O2', 'O4'] },\n    claude: { has: 'sim', text: 'Disponível em todos os planos. Cada projeto tem conhecimento (arquivos), instruções e memória própria.', how: 'Barra lateral, Projetos, criar projeto. Adicione arquivos ao conhecimento e escreva as instruções.', limits: 'O plano gratuito permite até 5 projetos. Arquivos de projeto: até 30 MB cada. O modo RAG, que amplia a capacidade em até 10 vezes, existe só nos planos pagos. Compartilhamento apenas em Team e Enterprise.', src: ['C2', 'C1', 'C5'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-memoria', title: 'Memória',\n    what: 'Capacidade de lembrar preferências e contexto de conversas anteriores sem que você repita tudo.',\n    chatgpt: { has: 'sim', text: 'Memória automática a partir de conversas, arquivos e apps conectados, com um resumo de memória que você pode revisar e corrigir.', how: 'Configurações, Personalização, Memória. Para conversar sem memória, use o Chat temporário.', limits: 'No plano gratuito a memória é limitada. Para apagar algo por completo, é preciso remover todas as fontes onde a informação aparece.', src: ['O3', 'O1'] },\n    claude: { has: 'sim', text: 'Memória gerada a partir das conversas, disponível em todos os planos, na web, no desktop e no celular. Cada projeto tem memória separada.', how: 'Configurações, Memória (ou Your Claude no layout novo). Para uma conversa sem memória, desligue a opção no menu \"+\" antes da primeira mensagem, ou use o chat anônimo.', limits: 'Alguns dados nunca são salvos, como números de documentos e contas. A busca em conversas anteriores aparece com regras diferentes em versões da documentação: confirme no seu plano.', src: ['C4'] },\n    status: 'parcial'\n  },\n  {\n    id: 'cmp-arquivos', title: 'Arquivos',\n    what: 'Envio de PDFs, documentos, planilhas e imagens para leitura e análise.',\n    chatgpt: { has: 'sim', text: 'Aceita documentos, planilhas, imagens e áudio.', how: 'Botão \"+\" na caixa de mensagem, ou arraste o arquivo.', limits: 'Até 512 MB por arquivo; textos limitados a 2 milhões de tokens por arquivo; imagens até 20 MB; planilhas em torno de 50 MB. Até 80 arquivos a cada 3 horas, e 3 envios por dia no plano gratuito.', src: ['O4'] },\n    claude: { has: 'sim', text: 'Aceita PDF, DOCX, CSV, TXT, HTML, ODT, RTF, EPUB, JSON, XLSX e imagens (JPEG, PNG, GIF, WebP).', how: 'Botão \"+\" no canto inferior esquerdo da caixa de mensagem, \"Adicionar arquivos ou fotos\", ou arraste o arquivo.', limits: 'No chat: até 500 MB por arquivo e 20 arquivos por conversa. Em projetos: 30 MB por arquivo. PDFs acima de 1.000 páginas não são aceitos. XLSX exige a criação de arquivos ativada.', src: ['C5'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-pesquisa', title: 'Pesquisa',\n    what: 'Busca de informações atuais na web, com links para conferir as fontes.',\n    chatgpt: { has: 'sim', text: 'Busca na web para respostas rápidas e deep research para relatórios longos com citações, que podem usar sites específicos, arquivos enviados e apps conectados.', how: 'Deep research: digite /Deepresearch, use o menu de ferramentas \"+\" ou a barra lateral. Você revisa o plano de pesquisa antes de começar.', limits: 'Deep research é limitado nos planos Free e Go e ampliado no Plus e no Pro. Relatórios podem ser baixados em Markdown, Word e PDF.', src: ['O5', 'O1'] },\n    claude: { has: 'sim', text: 'Pesquisa na web em todos os planos, com citações em cada resposta. O Research faz várias buscas encadeadas e entrega um relatório mais longo.', how: 'Web search: ative no menu de ferramentas da conversa. Research: botão \"+\", opção Research.', limits: 'Research exige plano pago (Pro, Max, Team ou Enterprise) e a pesquisa na web ligada. No celular, o Research usa só a web, sem os conectores.', src: ['C6', 'C7', 'C1'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-imagens', title: 'Geração de imagens',\n    what: 'Criação de imagens novas (ilustrações, fotos, cartazes) a partir de uma descrição.',\n    chatgpt: { has: 'sim', text: 'O ChatGPT Images cria e edita imagens, aceita imagem de referência, modelos prontos, proporções diferentes e, no celular, esboço desenhado à mão.', how: 'Peça a imagem na conversa ou abra Imagens na barra lateral. Para editar, selecione a imagem e descreva a mudança.', limits: 'Disponível em todos os planos, com volume limitado no Free. A seleção de área nem sempre é precisa. A geração pode levar alguns minutos.', src: ['O6', 'O1'] },\n    claude: { has: 'nao', text: 'O Claude não gera fotos nem ilustrações como as ferramentas de imagem. Ele cria diagramas, gráficos e visuais interativos em HTML e SVG, e designs no artefato Design.', how: 'Peça um diagrama, gráfico ou layout na conversa, ou escolha o modelo Design em Output.', limits: 'Visuais no chat estão em beta na web e no desktop. Para imagens fotográficas, use outra ferramenta e peça ao Claude ajuda com o briefing e o prompt.', src: ['C10', 'C16', 'C3'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-documentos', title: 'Criação de documentos',\n    what: 'Produção de textos longos e arquivos editáveis, como Word, PDF e planilhas.',\n    chatgpt: { has: 'sim', text: 'Blocos de escrita editáveis dentro da resposta, com edição direta, revisão por trecho e tela cheia. O modo Work cria documentos, planilhas e relatórios prontos.', how: 'Peça um rascunho na conversa e edite o bloco. Para entregáveis maiores, use o Work.', limits: 'O canvas deixou de estar disponível nos modelos atuais e foi substituído pelos blocos de escrita. As ações disponíveis variam por plano, dispositivo e modelo.', src: ['O7', 'O8'] },\n    claude: { has: 'sim', text: 'Cria arquivos .docx, .xlsx, .pptx e .pdf para baixar ou salvar no Google Drive, e documentos colaborativos no artefato Docs.', how: 'Ative \"Criar e editar arquivos\" em Configurações, Capacidades. Depois descreva o arquivo que você quer. Docs: Output, modelo Docs.', limits: 'Arquivos de até 30 MB. O Docs exporta para Word, PDF, Markdown e Google Docs.', src: ['C8', 'C3'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-apresentacoes', title: 'Criação de apresentações',\n    what: 'Montagem de slides a partir de notas, documentos ou da própria conversa.',\n    chatgpt: { has: 'sim', text: 'O modo Work cria apresentações como entregável de tarefas com várias etapas.', how: 'Abra o Work e descreva a apresentação, o público e os materiais de referência.', limits: 'Disponibilidade e limites do Work variam por plano. Detalhes de exportação por plano: pendente de confirmação.', src: ['O8'] },\n    claude: { has: 'sim', text: 'O artefato Slides monta apresentações editáveis, que podem ser apresentadas no próprio Claude e exportadas. Também cria arquivos .pptx.', how: 'Output, modelo Slides, ou peça \"monte uma apresentação\" na conversa.', limits: 'Slides está em todos os planos. Exporta para PowerPoint, PDF e Google Slides. Exige \"Criar e editar arquivos\" ativado.', src: ['C3', 'C8'] },\n    status: 'parcial'\n  },\n  {\n    id: 'cmp-artefatos', title: 'Artefatos interativos',\n    what: 'Páginas, ferramentas, painéis e protótipos que funcionam ao lado da conversa.',\n    chatgpt: { has: 'parcial', text: 'Blocos de código com pré-visualização de páginas HTML, componentes React, SVG, diagramas Mermaid e gráficos Vega. O Work também cria Sites.', how: 'Peça o código e use a opção de pré-visualização no bloco.', limits: 'As pré-visualizações suportadas variam por plano, dispositivo e rollout.', src: ['O7', 'O8'] },\n    claude: { has: 'sim', text: 'Artefatos são saídas independentes (documentos, slides, designs, painéis e pequenas ferramentas) que ficam salvos na aba Artefatos e podem ser compartilhados.', how: 'Peça na conversa, use Output na caixa de mensagem ou escolha um modelo na aba Artefatos.', limits: 'Docs, Slides e Design em todos os planos. Sheets, Whiteboards, conexão com apps e armazenamento de dados a partir do Pro. Exige \"Criar e editar arquivos\" ativado.', src: ['C3'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-personalizacao', title: 'Personalização',\n    what: 'Ajustes que fazem a ferramenta responder do jeito que você prefere em todas as conversas.',\n    chatgpt: { has: 'sim', text: 'Instruções personalizadas valem para todas as conversas. A personalidade define o estilo e o tom das respostas.', how: 'Web e desktop: Configurações, Personalização. Celular: Configurações, Personalizar ChatGPT.', limits: 'Instruções: até 1.500 caracteres no Free e no Go, e até 5.000 nos demais planos.', src: ['O13', 'O14'] },\n    claude: { has: 'sim', text: 'Preferências de perfil para todas as conversas, instruções de projeto e estilos de resposta (Normal, Conciso, Formal, Explicativo ou personalizados a partir de amostras suas).', how: 'Preferências: Configurações, Geral. Estilos: menu de ferramentas da conversa, \"Usar estilo\".', limits: 'O layout das configurações está mudando; os nomes dos menus podem variar entre versões.', src: ['C11', 'C12'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-assistentes', title: 'Assistentes',\n    what: 'Versões especializadas da IA, com instruções e materiais fixos para uma tarefa recorrente.',\n    chatgpt: { has: 'parcial', text: 'GPTs personalizados combinam instruções, conhecimento e ferramentas. A OpenAI planeja aposentar os GPTs e migrar esses fluxos para Plugins.', how: 'Em contas pessoais, use Projetos com instruções e arquivos como assistente. Em Business, Enterprise e Edu, GPTs podem ser criados conforme as permissões.', limits: 'Contas pessoais (Free, Go, Plus e Pro) não podem criar nem publicar novos GPTs. GPTs existentes continuam utilizáveis até a aposentadoria.', src: ['O9', 'O10'] },\n    claude: { has: 'sim', text: 'Projetos com instruções e conhecimento funcionam como assistentes especializados. Skills adicionam comportamentos e capacidades reutilizáveis.', how: 'Crie um projeto, escreva as instruções, envie os materiais de referência e teste com casos reais.', limits: 'Limite de 5 projetos no plano gratuito.', src: ['C2', 'C11'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-automacao', title: 'Recursos de automação',\n    what: 'Tarefas que rodam sozinhas em horários definidos ou que executam várias etapas com pouca intervenção.',\n    chatgpt: { has: 'sim', text: 'Tarefas agendadas únicas ou recorrentes, que também podem monitorar mudanças. Plugins reúnem skills, apps conectados e modelos de tarefa.', how: 'Página Scheduled, ou Configurações, Notificações, Gerenciar tarefas.', limits: 'A central de ajuda cita Plus, Pro, Business e Enterprise; a página de preços também lista o Go. Ações que exigem aprovação podem pausar a tarefa.', src: ['O11', 'O10', 'O1'] },\n    claude: { has: 'sim', text: 'O Cowork executa tarefas com várias etapas em arquivos e ferramentas conectadas. Tarefas agendadas rodam de forma recorrente ou sob demanda.', how: 'Barra lateral, Scheduled, New task. Você pode criar com ajuda do Claude ou configurar manualmente.', limits: 'Cowork e tarefas agendadas exigem plano pago. Tarefas que usam arquivos locais só rodam no computador.', src: ['C9', 'C13'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-apps', title: 'Aplicativos desktop e mobile',\n    what: 'Onde cada ferramenta pode ser usada: navegador, computador e celular.',\n    chatgpt: { has: 'sim', text: 'Web, iOS, Android e um app desktop novo para macOS e Windows que reúne Chat, Work e Codex. O app anterior virou ChatGPT Classic.', how: 'Baixe pelo site oficial e entre com a mesma conta. No macOS, um atalho de teclado abre a barra de pergunta rápida.', limits: 'O app para macOS exige macOS 14 ou superior.', src: ['O12'] },\n    claude: { has: 'sim', text: 'Web, desktop e celular em todos os planos.', how: 'Baixe em claude.com/download ou pelas lojas de apps.', limits: 'Cowork no desktop (macOS e Windows) exige plano pago. Alguns recursos de compartilhamento de artefatos só mudam na web ou no desktop.', src: ['C1', 'C9', 'C3'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-planos', title: 'Planos gratuitos e pagos',\n    what: 'Os níveis de assinatura e o que muda entre eles.',\n    chatgpt: { has: 'sim', text: 'Free, Go, Plus e Pro para pessoas; Business e Enterprise para empresas. O Free inclui projetos, busca e uso limitado de envios, imagens, voz, memória e deep research.', how: 'Compare em chatgpt.com/pricing antes de assinar.', limits: 'Preços variam por país e moeda e não foram exibidos na leitura da página oficial. Confira no checkout.', src: ['O1'] },\n    claude: { has: 'sim', text: 'Free, Pro, Max e Ultra para pessoas; Team e Enterprise para empresas. O Free inclui memória, pesquisa na web, criação de arquivos, artefatos, conectores, voz, apps e até 5 projetos.', how: 'Compare em claude.com/pricing antes de assinar.', limits: 'Exclusivos de planos pagos: Claude Code, Claude in Chrome, Research, Cowork e projetos ilimitados. Preços podem mudar e variam por moeda.', src: ['C1'] },\n    status: 'verificado'\n  }\n];\n\nPLAYBOOK.compareCriteria = [\n  'Use a ferramenta que você já domina e assina quando as duas resolvem a tarefa.',\n  'Para imagens fotográficas ou ilustrações, o ChatGPT tem geração nativa; o Claude ajuda no briefing e no prompt.',\n  'Para documentos, slides e páginas editáveis que você vai guardar e compartilhar, os artefatos do Claude estão disponíveis em todos os planos.',\n  'Para assistentes recorrentes em conta pessoal, use Projetos nas duas ferramentas.',\n  'Qualidade de texto é subjetiva: teste o mesmo prompt nas duas, compare com os critérios do checklist de qualidade e escolha pelo resultado.'\n];\n\n/* =========================================================\n   COMECE POR AQUI · guias fundamentais\n   ========================================================= */\nPLAYBOOK.guides = [\n  {\n    id: 'g-ia-generativa', title: 'O que é inteligência artificial generativa',\n    summary: 'Entenda o que a IA generativa faz, como ela produz respostas e por que sempre precisa de revisão humana.',\n    cats: ['educacao', 'pesquisa'], level: 'iniciante', time: '5 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['pesquisar'],\n    kw: ['ia', 'conceito', 'llm', 'como funciona', 'fundamentos'],\n    blocks: [\n      { p: 'IA generativa é o tipo de inteligência artificial que cria conteúdo novo: textos, imagens, tabelas, códigos e apresentações. Ela aprende padrões a partir de uma quantidade enorme de exemplos e usa esses padrões para produzir uma resposta a partir do seu pedido.' },\n      { p: 'Ferramentas como ChatGPT e Claude são construídas sobre modelos de linguagem (LLMs). Eles preveem, palavra por palavra, a continuação mais provável para o contexto que você forneceu. Por isso o contexto que você dá muda tanto o resultado.' },\n      { h: 'O que ela faz bem', list: ['Rascunhos, resumos e reescritas em poucos segundos.', 'Organizar ideias soltas em estruturas claras.', 'Adaptar um mesmo conteúdo para públicos diferentes.', 'Analisar documentos e dados que você envia.'] },\n      { h: 'Onde exige cuidado', list: ['Pode afirmar algo falso com segurança (alucinação).', 'Não conhece fatos recentes sem pesquisa na web ativada.', 'Reproduz vieses presentes nos dados de treinamento.', 'Não substitui sua decisão profissional: você responde pelo resultado.'] }\n    ],\n    src: []\n  },\n  {\n    id: 'g-chatgpt-claude', title: 'O que são ChatGPT e Claude',\n    summary: 'Duas assistentes de IA de empresas diferentes, com recursos parecidos e diferenças práticas que importam no dia a dia.',\n    cats: ['assistentes'], level: 'iniciante', time: '5 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['pesquisar'],\n    kw: ['openai', 'anthropic', 'diferença', 'ferramentas'],\n    blocks: [\n      { p: 'O ChatGPT é desenvolvido pela OpenAI. O Claude é desenvolvido pela Anthropic. Os dois conversam em português, leem arquivos, pesquisam na web, guardam memória e organizam o trabalho em projetos.' },\n      { h: 'Diferenças práticas confirmadas', list: ['O ChatGPT gera e edita imagens; o Claude não gera fotos nem ilustrações, mas cria diagramas, gráficos e layouts em HTML e SVG.', 'O Claude entrega documentos, slides e designs como artefatos editáveis em todos os planos.', 'O ChatGPT separa o trabalho em Chat, Work (tarefas longas com entregáveis) e Codex.', 'Em contas pessoais do ChatGPT, não é mais possível criar novos GPTs; projetos cumprem esse papel.'] },\n      { p: 'Nenhuma das duas é superior em tudo. Veja o comparativo completo para decidir por tarefa.', link: { view: 'comparativo', label: 'Abrir o comparativo' } }\n    ],\n    src: ['O8', 'O6', 'C10', 'C3', 'O9']\n  },\n  {\n    id: 'g-quando-usar', title: 'Para quais tarefas cada uma é mais indicada',\n    summary: 'Uma recomendação contextual por tipo de tarefa, com o critério usado em cada escolha.',\n    cats: ['assistentes'], level: 'iniciante', time: '6 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['planejar'],\n    kw: ['qual usar', 'escolha', 'recomendação', 'tarefa'],\n    blocks: [\n      { p: 'O critério aqui é recurso disponível e formato do entregável, não qualidade absoluta. Quando as duas resolvem, use a que você já domina.' },\n      { h: 'Recomendações por tarefa', list: ['Imagens e ilustrações: ChatGPT, por ter geração nativa de imagens.', 'Documentos, slides e páginas para guardar e compartilhar: Claude, pelos artefatos Docs, Slides e Design em todos os planos.', 'Pesquisa profunda com relatório: as duas (deep research no ChatGPT, Research no Claude pago).', 'Assistente recorrente em conta pessoal: projeto em qualquer uma das duas.', 'Tarefas agendadas: as duas nos planos pagos.', 'Textos, planos de aula e revisão: as duas. Teste o mesmo prompt e compare.'] }\n    ],\n    src: ['O6', 'C3', 'O5', 'C7', 'O11', 'C13']\n  },\n  {\n    id: 'g-planos', title: 'Planos gratuitos e pagos',\n    summary: 'O que os planos gratuitos já permitem e quais recursos exigem assinatura em cada ferramenta.',\n    cats: ['assistentes'], level: 'iniciante', time: '5 min', avail: 'depende', tools: ['chatgpt', 'claude'], obj: ['planejar'],\n    kw: ['preço', 'assinatura', 'free', 'plus', 'pro', 'max'],\n    blocks: [\n      { h: 'ChatGPT', list: ['Planos: Free, Go, Plus e Pro para pessoas; Business e Enterprise para empresas.', 'O Free inclui projetos, busca na web e uso limitado de envios, imagens, voz, memória e deep research.', 'GPTs personalizados aparecem a partir do Plus, mas contas pessoais não criam novos GPTs.'] },\n      { h: 'Claude', list: ['Planos: Free, Pro, Max e Ultra para pessoas; Team e Enterprise para empresas.', 'O Free inclui memória, pesquisa na web, criação de arquivos, artefatos, conectores, voz, apps e até 5 projetos.', 'Pagos: Research, Cowork, Claude Code, Claude in Chrome e projetos ilimitados.'] },\n      { p: 'Preços mudam e variam por país e moeda. Consulte sempre a página oficial antes de assinar.' }\n    ],\n    src: ['O1', 'C1', 'O9']\n  },\n  {\n    id: 'g-apps', title: 'Aplicativos desktop, mobile e navegador',\n    summary: 'Onde usar cada ferramenta e o que muda entre navegador, computador e celular.',\n    cats: ['produtividade'], level: 'iniciante', time: '4 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['organizar'],\n    kw: ['app', 'download', 'celular', 'mac', 'windows', 'ios', 'android'],\n    blocks: [\n      { list: ['ChatGPT: web, iOS, Android e app desktop para macOS e Windows, que reúne Chat, Work e Codex. No macOS exige versão 14 ou superior.', 'Claude: web, desktop e celular em todos os planos. Download em claude.com/download.', 'No celular, algumas funções têm limites. Exemplo: o Research do Claude no app móvel pesquisa só na web, sem conectores.'] },\n      { p: 'Dica de mentoria: comece pelo navegador, que tem todos os recursos, e instale o app no celular para consultas rápidas e voz.' }\n    ],\n    src: ['O12', 'C1', 'C7']\n  },\n  {\n    id: 'g-configuracoes', title: 'Configurações iniciais',\n    summary: 'Cinco ajustes para fazer no primeiro dia e ganhar respostas mais úteis desde o começo.',\n    cats: ['produtividade', 'assistentes'], level: 'iniciante', time: '10 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['organizar'],\n    kw: ['configurar', 'privacidade', 'personalização', 'primeiro acesso'],\n    blocks: [\n      { h: 'No ChatGPT', list: ['Configurações, Personalização: escreva instruções personalizadas sobre você e o formato de resposta que prefere.', 'Configurações, Personalização, Memória: decida se quer a memória ligada.', 'Configurações, Controles de dados: decida sobre \"Melhorar o modelo para todos\".'] },\n      { h: 'No Claude', list: ['Configurações, Geral: preencha as preferências de perfil.', 'Configurações, Capacidades: ative \"Criar e editar arquivos\" para usar artefatos e arquivos.', 'Configurações, Privacidade: decida sobre \"Ajudar a melhorar o Claude\".', 'Configurações, Memória: revise a memória e a busca em conversas.'] }\n    ],\n    src: ['O13', 'O3', 'O15', 'C11', 'C3', 'C14', 'C4']\n  },\n  {\n    id: 'g-memoria', title: 'Memória e contexto',\n    summary: 'A diferença entre o que a IA vê na conversa atual e o que ela lembra entre conversas.',\n    cats: ['assistentes'], level: 'iniciante', time: '5 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['organizar'],\n    kw: ['memória', 'contexto', 'janela de contexto', 'chat temporário'],\n    blocks: [\n      { p: 'Contexto é tudo o que a ferramenta tem diante dela agora: suas mensagens, os arquivos enviados e as instruções. Memória é o que ela guarda de conversas anteriores para usar nas próximas.' },\n      { list: ['ChatGPT: memória com resumo revisável em Configurações, Personalização, Memória. O Chat temporário não usa nem cria memórias.', 'Claude: memória em todos os planos, com memória separada por projeto. Para uma conversa sem memória, desligue a opção no menu \"+\" antes de enviar a primeira mensagem.'] },\n      { p: 'Boa prática: em vez de confiar na memória para dados importantes, coloque o contexto essencial nas instruções do projeto.' }\n    ],\n    src: ['O3', 'C4']\n  },\n  {\n    id: 'g-projetos', title: 'Projetos e instruções',\n    summary: 'Como usar projetos para não repetir contexto e manter cada trabalho organizado.',\n    cats: ['assistentes', 'gestao'], level: 'iniciante', time: '6 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['organizar'],\n    kw: ['projeto', 'instruções', 'conhecimento', 'pasta'],\n    blocks: [\n      { p: 'Projeto é um espaço com conversas, arquivos de referência e instruções que valem para tudo o que acontece ali dentro. Funciona como uma pasta inteligente.' },\n      { list: ['ChatGPT: disponível inclusive no Free, com 5 arquivos por projeto no Free e 25 no Go e no Plus.', 'Claude: disponível em todos os planos, com até 5 projetos no Free e arquivos de até 30 MB cada.'] },\n      { p: 'Veja os tutoriais passo a passo.', link: { view: 'app', id: 'projeto-chatgpt', label: 'Criar um projeto no ChatGPT' } },\n      { p: '', link: { view: 'app', id: 'projeto-claude', label: 'Criar um projeto no Claude' } }\n    ],\n    src: ['O2', 'O4', 'C2', 'C5']\n  },\n  {\n    id: 'g-arquivos', title: 'Envio e análise de arquivos',\n    summary: 'Formatos aceitos, limites e cuidados antes de enviar documentos para a IA.',\n    cats: ['documentos', 'pesquisa'], level: 'iniciante', time: '5 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['analisar'],\n    kw: ['pdf', 'upload', 'planilha', 'documento', 'limite'],\n    blocks: [\n      { list: ['ChatGPT: até 512 MB por arquivo, imagens até 20 MB, planilhas em torno de 50 MB. No Free, 3 envios por dia.', 'Claude: no chat, até 500 MB por arquivo e 20 arquivos por conversa; em projetos, 30 MB por arquivo; PDFs até 1.000 páginas.'] },\n      { h: 'Antes de enviar', list: ['Retire dados pessoais e informações confidenciais que não são necessários.', 'Prefira arquivos com texto selecionável. PDFs escaneados podem perder informação.', 'Diga o que você quer extrair do arquivo e em qual formato.'] }\n    ],\n    src: ['O4', 'C5']\n  },\n  {\n    id: 'g-pesquisa', title: 'Pesquisa com fontes',\n    summary: 'Quando usar busca rápida, quando usar pesquisa aprofundada e como conferir as fontes.',\n    cats: ['pesquisa'], level: 'iniciante', time: '5 min', avail: 'depende', tools: ['chatgpt', 'claude'], obj: ['pesquisar'],\n    kw: ['web', 'fontes', 'citação', 'deep research', 'research'],\n    blocks: [\n      { list: ['Busca rápida: para fatos atuais e perguntas objetivas. Disponível no Free das duas ferramentas.', '
