Pesquisa aprofundada: para relatórios com várias fontes. Deep research no ChatGPT (limitado no Free) e Research no Claude (planos pagos).'] },\n      { p: 'Abra os links citados e confira se a fonte diz mesmo o que a resposta afirma. Citação na resposta não garante que a interpretação está certa.' },\n      { p: '', link: { view: 'app', id: 'pesquisa-fontes', label: 'Tutorial: pesquisar um assunto com fontes verificáveis' } }\n    ],\n    src: ['O5', 'C6', 'C7']\n  },\n  {\n    id: 'g-privacidade', title: 'Privacidade e segurança',\n    summary: 'O que não enviar, como controlar o uso dos seus dados e quando usar conversas temporárias.',\n    cats: ['gestao'], level: 'iniciante', time: '6 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['revisar'],\n    kw: ['lgpd', 'dados pessoais', 'confidencial', 'treinamento', 'segurança'],\n    blocks: [\n      { h: 'Regras de ouro', list: ['Não envie dados pessoais de alunos, clientes ou colegas sem autorização e sem necessidade real.', 'Não envie documentos confidenciais em contas pessoais sem avaliar as configurações de privacidade.', 'Substitua nomes por códigos (Aluno A, Cliente 1) quando o nome não for necessário.', 'Grave ou transcreva reuniões somente com autorização dos participantes.'] },\n      { h: 'Controles disponíveis', list: ['ChatGPT: Configurações, Controles de dados, \"Melhorar o modelo para todos\". O Chat temporário não aparece no histórico, não cria memórias e não é usado para treinamento.', 'Claude: Configurações, Privacidade, \"Ajudar a melhorar o Claude\". Com a opção desligada, novas conversas não são usadas para treinar modelos.'] },\n      { p: 'Planos empresariais costumam ter regras próprias de dados. Confirme com o administrador do seu workspace.' }\n    ],\n    src: ['O15', 'C14']\n  },\n  {\n    id: 'g-prompting', title: 'Boas práticas de prompting',\n    summary: 'O resumo dos princípios que mais melhoram as respostas. O guia completo tem exemplos e modelos copiáveis.',\n    cats: ['assistentes', 'produtividade'], level: 'iniciante', time: '4 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['criar', 'revisar'],\n    kw: ['prompt', 'comando', 'como pedir', 'engenharia de prompt'],\n    blocks: [\n      { list: ['Diga o objetivo e o resultado esperado.', 'Dê contexto: quem você é, para quem é, por que importa.', 'Envie referências e exemplos.', 'Defina o formato da resposta.', 'Peça para a IA perguntar o que estiver faltando.', 'Refine em rodadas curtas.'] },\n      { p: '', link: { view: 'prompting', label: 'Abrir o guia completo de prompting' } }\n    ],\n    src: ['C15']\n  }\n];\n\n/* =========================================================\n   CHECKLISTS AVULSOS\n   ========================================================= */\nPLAYBOOK.checklists = [\n  {\n    id: 'ck-antes-enviar', title: 'Checklist antes de enviar um arquivo para a IA',\n    summary: 'Seis verificações rápidas de privacidade e qualidade antes de anexar documentos.',\n    cats: ['gestao', 'documentos'], level: 'iniciante', time: '2 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['revisar'],\n    kw: ['privacidade', 'lgpd', 'upload', 'dados pessoais'],\n    items: ['O arquivo contém só o necessário para a tarefa.', 'Dados pessoais foram removidos ou substituídos por códigos.', 'Tenho autorização para usar este material.', 'Revisei a configuração de uso de dados da minha conta.', 'O texto do arquivo é selecionável (não é imagem escaneada).', 'Escrevi no prompt o que quero extrair e em qual formato.']\n  },\n  {\n    id: 'ck-revisao-ia', title: 'Checklist de revisão de conteúdo gerado por IA',\n    summary: 'Critérios para revisar qualquer texto antes de usar, publicar ou entregar.',\n    cats: ['marketing', 'documentos', 'educacao'], level: 'iniciante', time: '5 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['revisar'],\n    kw: ['revisão', 'qualidade', 'conferir', 'alucinação'],\n    items: ['Datas, números, nomes e citações foram conferidos em fonte confiável.', 'O texto responde ao objetivo pedido.', 'A linguagem combina com o público.', 'Não há afirmações genéricas sem exemplo ou dado.', 'O formato segue o que foi pedido.', 'Nada confidencial aparece no resultado.', 'Eu concordo com o conteúdo e assino embaixo.']\n  },\n  {\n    id: 'ck-prompt', title: 'Checklist de um bom prompt',\n    summary: 'Confira se o seu comando tem os elementos que mais influenciam a qualidade da resposta.',\n    cats: ['assistentes', 'produtividade'], level: 'iniciante', time: '2 min', avail: 'gratuito', tools: ['chatgpt', 'claude'], obj: ['revisar', 'criar'],\n    kw: ['prompt', 'comando', 'estrutura'],\n    items: ['Objetivo claro em uma frase.', 'Contexto suficiente para alguém de fora entender.', 'Público definido.', 'Referências ou exemplos anexados quando existem.', 'Formato de saída descrito.', 'Restrições do que evitar.', 'Pedido para perguntar o que estiver faltando.']\n  }\n];\n\n/* =========================================================\n   APLICAÇÕES · tutoriais completos (1 a 5 · Educação)\n   ========================================================= */\nPLAYBOOK.apps = [];\n\nPLAYBOOK.apps.push({\n  id: 'aula-completa', n: 1, full: true,\n  title: 'Planejar uma aula completa',\n  summary: 'Transforme um tema em um plano de aula com objetivos, sequência didática, tempos, atividades e avaliação.',\n  cats: ['educacao'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'As duas ferramentas resolvem bem. Use a que você já tem aberta; no Claude, o plano pode virar um documento no artefato Docs.',\n  level: 'iniciante', time: '30 a 45 min', avail: 'gratuito', obj: ['planejar', 'criar'],\n  reqs: ['Conta gratuita em qualquer uma das ferramentas', 'Tema, turma e duração da aula'],\n  kw: ['plano de aula', 'sequência didática', 'bncc', 'objetivos de aprendizagem', 'professor', 'aula'],\n  problem: 'Planejar uma aula do zero toma horas: definir objetivos, escolher atividades, distribuir o tempo e pensar na avaliação. Quando o tempo aperta, a aula fica centrada na exposição e sem momentos de prática.',\n  result: 'Um plano de aula pronto para revisar, com objetivos mensuráveis, roteiro minuto a minuto, atividades, recursos, avaliação e uma alternativa para turmas com ritmos diferentes.',\n  when: ['Começo de uma unidade nova.', 'Aula de reposição com pouco tempo de preparo.', 'Revisão de uma aula antiga que não funcionou.', 'Preparação de oficina ou treinamento para adultos.'],\n  before: ['Tema e recorte da aula.', 'Perfil da turma: idade, nível, tamanho e conhecimentos prévios.', 'Duração e formato (presencial, remoto, híbrido).', 'Referências obrigatórias, como BNCC, ementa ou material didático adotado.', 'Recursos disponíveis na sala.'],\n  steps: [\n    'Abra uma conversa nova. Se você planeja várias aulas da mesma disciplina, crie antes um projeto para reunir ementa e materiais.',\n    'Cole o prompt principal e substitua tudo o que está entre colchetes.',\n    'Se tiver ementa ou capítulo do livro, anexe pelo botão \"+\" da caixa de mensagem.',\n    'Responda às perguntas que a IA fizer antes de gerar o plano.',\n    'Leia o plano com olhar de professor: tempos realistas, atividades viáveis, linguagem adequada.',\n    'Use os refinamentos para ajustar o que não serviu.',\n    'Peça a versão final no formato que você usa (documento, tabela ou texto para colar no sistema da escola).'\n  ],\n  prompt: `Atue como coordenador pedagógico experiente em planejamento de aulas ativas.\n\nContexto\nSou professor(a) de [disciplina] e vou dar uma aula sobre [tema] para [turma: série/idade, quantidade de alunos, nível de conhecimento prévio]. A aula dura [duração] e acontece em formato [presencial/remoto/híbrido]. Recursos disponíveis: [projetor, laboratório, celulares, papel etc.].\n\nObjetivo\nCriar um plano de aula completo e aplicável, em que os alunos pratiquem durante a aula e não apenas escutem.\n\nReferências\n[Cole aqui trechos da ementa, competência da BNCC ou capítulo do livro, se houver.]\n\nO plano deve conter\n1. Objetivos de aprendizagem (2 a 4), escritos com verbos observáveis.\n2. Conhecimentos prévios necessários.\n3. Roteiro com tempo de cada etapa: abertura, desenvolvimento, prática e fechamento.\n4. Pelo menos uma atividade em que os alunos produzem algo.\n5. Materiais e preparação prévia do professor.\n6. Forma de avaliação com critérios simples.\n7. Adaptação para alunos com mais dificuldade e para quem termina antes.\n\nRestrições\nLinguagem direta, sem jargão desnecessário. Tempos que somem exatamente a duração da aula. Nada que dependa de recurso que eu não listei.\n\nFormato\nUse títulos curtos e uma tabela para o roteiro (etapa, tempo, o que o professor faz, o que os alunos fazem).\n\nAntes de responder, faça até 3 perguntas se alguma informação essencial estiver faltando.`,\n  refinements: [\n    { t: 'Ajustar ao público', p: 'Reescreva o roteiro considerando que a turma tem pouca concentração após o intervalo. Inclua uma atividade de movimento nos primeiros 10 minutos.' },\n    { t: 'Aprofundar exemplos', p: 'Para cada etapa do desenvolvimento, dê um exemplo concreto do cotidiano dos alunos que eu possa usar para explicar o conceito.' },\n    { t: 'Reduzir complexidade', p: 'Simplifique o plano para caber em uma página. Mantenha objetivos, roteiro com tempos e avaliação.' },\n    { t: 'Revisar consistência', p: 'Revise se cada objetivo de aprendizagem é trabalhado em pelo menos uma etapa e avaliado no final. Aponte o que estiver desalinhado e corrija.' }\n  ],\n  example: {\n    title: 'Ciências, 7º ano, 50 minutos',\n    context: 'Professora Marina (dados fictícios) prepara uma aula sobre cadeias alimentares para 32 alunos, com projetor e papel.',\n    lines: ['Objetivo 1: identificar produtores, consumidores e decompositores em uma cadeia alimentar.', 'Abertura (8 min): foto de uma lagoa; os alunos listam em duplas tudo o que está vivo na imagem.', 'Prática (20 min): em grupos, montam uma cadeia alimentar com cartões e explicam o que acontece se um elo desaparecer.', 'Avaliação: bilhete de saída com uma cadeia de 4 elos para classificar.']\n  },\n  checklist: ['Os objetivos usam verbos observáveis (identificar, comparar, produzir).', 'A soma dos tempos é igual à duração da aula.', 'Existe pelo menos um momento de prática dos alunos.', 'A avaliação mede os objetivos definidos.', 'Os recursos citados existem na minha escola.', 'Conferi conceitos e dados com o material de referência.'],\n  mistakes: [\n    { e: 'Pedir \"faça um plano de aula sobre fotossíntese\" sem turma nem duração.', c: 'Informe série, duração e recursos. Sem isso, a IA cria um plano genérico.' },\n    { e: 'Aceitar tempos irreais, como 5 minutos para um debate.', c: 'Peça para recalcular os tempos com base na sua experiência com a turma.' },\n    { e: 'Copiar conteúdo conceitual sem conferir.', c: 'Revise definições e dados com o livro adotado antes de usar em sala.' }\n  ],\n  next: ['apresentacao-didatica', 'exercicios-avaliacoes', 'assistente-aulas'],\n  src: []\n});\n\nPLAYBOOK.apps.push({\n  id: 'apresentacao-didatica', n: 2, full: true,\n  title: 'Criar uma apresentação didática',\n  summary: 'Converta um plano de aula ou um texto em slides claros, com pouco texto por tela e notas para o professor.',\n  cats: ['educacao', 'documentos'], tools: ['claude', 'chatgpt'], rec: 'claude', alt: 'chatgpt',\n  recNote: 'Recomendação contextual: o Claude cria slides editáveis no artefato Slides em todos os planos, com exportação para PowerPoint, PDF e Google Slides. No ChatGPT, apresentações prontas saem pelo modo Work, cuja disponibilidade varia por plano.',\n  level: 'iniciante', time: '30 a 60 min', avail: 'gratuito', obj: ['criar'],\n  reqs: ['Claude com \"Criar e editar arquivos\" ativado (Configurações, Capacidades)', 'Plano de aula ou conteúdo base'],\n  kw: ['slides', 'powerpoint', 'apresentação', 'aula', 'pptx', 'google slides'],\n  problem: 'Slides de aula costumam virar páginas de texto projetadas. Os alunos leem em vez de prestar atenção, e o professor perde tempo formatando.',\n  result: 'Uma apresentação de 8 a 15 slides com uma ideia por tela, perguntas para a turma, notas do professor e arquivo exportável.',\n  when: ['Depois de ter o plano de aula pronto.', 'Para transformar um capítulo do livro em aula expositiva dialogada.', 'Para padronizar slides de uma disciplina inteira.'],\n  before: ['Plano de aula ou texto base.', 'Número aproximado de slides.', 'Identidade visual da escola, se houver (cores e logo).', 'No Claude: ative \"Criar e editar arquivos\" em Configurações, Capacidades.'],\n  steps: [\n    'No Claude, abra uma conversa e escolha Output, modelo Slides, ou simplesmente peça \"monte uma apresentação\".',\n    'Cole o prompt principal com o seu plano de aula.',\n    'Revise a estrutura proposta (títulos dos slides) antes de pedir o conteúdo completo.',\n    'Edite textos diretamente no artefato ou peça ajustes na conversa.',\n    'Exporte para PowerPoint, PDF ou Google Slides pela opção de exportação do artefato.',\n    'No ChatGPT, use o modo Work com o mesmo prompt quando estiver disponível no seu plano, ou peça o roteiro dos slides para montar no seu editor.'\n  ],\n  prompt: `Atue como designer instrucional especializado em apresentações para sala de aula.\n\nContexto\nVou dar uma aula de [disciplina] sobre [tema] para [turma]. Tenho [duração] e vou projetar os slides enquanto converso com a turma.\n\nMaterial base\n[Cole aqui o plano de aula ou o texto de referência.]\n\nObjetivo\nCriar uma apresentação de [8 a 12] slides que apoie a fala do professor, sem substituir a explicação.\n\nRegras\n1. Uma ideia principal por slide.\n2. No máximo 25 palavras visíveis por slide, sem contar o título.\n3. Inclua pelo menos 3 slides com pergunta para a turma.\n4. Sugira um visual por slide (diagrama, ícone, imagem ou gráfico) e descreva o que ele mostra.\n5. Escreva notas do professor com o que falar e quanto tempo usar.\n6. O último slide retoma os objetivos e traz uma atividade de fechamento.\n\nFormato\nPrimeiro mostre só a lista de títulos dos slides para eu aprovar. Depois de aprovada, monte a apresentação completa.\n\nSe faltar alguma informação importante, pergunte antes.`,\n  refinements: [\n    { t: 'Melhorar hierarquia visual', p: 'Revise os slides para que o título diga a conclusão do slide, e não apenas o assunto. Exemplo: em vez de \"Fotossíntese\", use \"As plantas produzem o próprio alimento com luz\".' },\n    { t: 'Reduzir texto', p: 'Corte o texto visível pela metade e mova o restante para as notas do professor.' },\n    { t: 'Aplicar identidade visual', p: 'Aplique estas cores e esta fonte em todos os slides: [cores em hexadecimal, fonte]. Mantenha contraste suficiente para projeção em sala clara.' },\n    { t: 'Ajustar ao público', p: 'Adapte linguagem e exemplos para alunos de [idade], usando situações do dia a dia deles.' }\n  ],\n  example: {\n    title: 'História, 9º ano, Revolução Industrial',\n    context: 'Professor Caio (fictício) tem 50 minutos e quer uma aula dialogada.',\n    lines: ['Slide 2: \"O trabalho saiu de casa e foi para a fábrica\" com foto de tear manual e de fábrica lado a lado.', 'Slide 5 (pergunta): \"Que tecnologia mudou o seu jeito de estudar nos últimos 5 anos?\"', 'Notas do slide 5: 4 minutos; anotar 3 respostas no quadro e ligar com a máquina a vapor.']\n  },\n  checklist: ['Cada slide tem uma ideia só.', 'O texto visível cabe em uma leitura de 5 segundos.', 'Há perguntas para a turma ao longo da apresentação.', 'As notas do professor indicam tempo.', 'As imagens sugeridas têm uso permitido.', 'A apresentação exportada abriu corretamente no computador da sala.'],\n  mistakes: [\n    { e: 'Pedir a apresentação inteira de uma vez, sem aprovar a estrutura.', c: 'Aprove primeiro os títulos. Ajustar a estrutura no fim dá mais trabalho.' },\n    { e: 'Slides com parágrafos inteiros.', c: 'Use o refinamento \"Reduzir texto\" e leve o detalhe para as notas.' },\n    { e: 'Imagens sem verificação de direitos de uso.', c: 'Use bancos de imagem com licença livre ou imagens geradas por IA quando o uso for permitido.' }\n  ],\n  next: ['aula-completa', 'apresentacoes-identidade', 'materiais-visuais-aula'],\n  src: ['C3', 'C8', 'O8']\n});\n\nPLAYBOOK.apps.push({\n  id: 'exercicios-avaliacoes', n: 3, full: true,\n  title: 'Elaborar exercícios e avaliações',\n  summary: 'Crie listas de exercícios, provas e rubricas alinhadas aos objetivos, com gabarito comentado.',\n  cats: ['educacao'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'As duas resolvem. Para gerar o arquivo pronto (Word ou PDF), o Claude cria .docx e .pdf com a criação de arquivos ativada.',\n  level: 'iniciante', time: '20 a 40 min', avail: 'gratuito', obj: ['criar', 'revisar'],\n  reqs: ['Objetivos de aprendizagem ou conteúdo trabalhado', 'Nível da turma'],\n  kw: ['prova', 'exercício', 'avaliação', 'rubrica', 'gabarito', 'questões', 'quiz'],\n  problem: 'Montar avaliações variadas e no nível certo leva tempo. É comum repetir o mesmo tipo de questão e medir só memorização.',\n  result: 'Uma avaliação com questões de níveis de dificuldade diferentes, gabarito comentado, critérios de correção e versão alternativa.',\n  when: ['Fim de unidade.', 'Listas de fixação para casa.', 'Avaliação diagnóstica no início do semestre.', 'Recuperação com questões novas.'],\n  before: ['Objetivos ou conteúdos avaliados.', 'Tipo de questão desejado (objetiva, discursiva, estudo de caso).', 'Tempo de prova e número de questões.', 'Exemplos de questões que você já usa, se houver.'],\n  steps: [\n    'Abra uma conversa nova ou use o projeto da disciplina.',\n    'Cole o prompt e informe objetivos, nível e formato.',\n    'Peça primeiro o mapa da avaliação (objetivo, tipo de questão e nível) e aprove.',\n    'Gere as questões e o gabarito comentado.',\n    'Resolva você mesmo a prova antes de aplicar.',\n    'Peça a versão final em documento para imprimir ou para a plataforma da escola.'\n  ],\n  prompt: `Atue como especialista em avaliação educacional.\n\nContexto\nTurma: [série/idade e nível]. Disciplina: [disciplina]. Conteúdo trabalhado: [tópicos].\nObjetivos de aprendizagem avaliados:\n[liste os objetivos]\n\nTarefa\nCrie uma avaliação com [número] questões para [tempo] minutos.\n\nDistribuição\n40% fáceis (lembrar e compreender), 40% médias (aplicar), 20% difíceis (analisar ou criar).\nTipos: [ex.: 6 objetivas com 4 alternativas, 3 discursivas curtas, 1 estudo de caso].\n\nRegras\n1. Cada questão indica o objetivo que avalia.\n2. Alternativas incorretas devem ser plausíveis e baseadas em erros comuns dos alunos.\n3. Nada de \"todas as anteriores\" ou \"nenhuma das anteriores\".\n4. Enunciados curtos e sem ambiguidade.\n5. Situações contextualizadas na realidade dos alunos.\n\nEntregue\n1. Mapa da avaliação em tabela (questão, objetivo, nível, tipo).\n2. As questões.\n3. Gabarito comentado explicando o erro de cada alternativa incorreta.\n4. Critérios de correção para as discursivas, com pontuação.\n\nSe faltar alguma informação essencial, pergunte antes de começar.`,\n  refinements: [\n    { t: 'Versão alternativa', p: 'Crie uma versão B da mesma avaliação, com o mesmo nível de dificuldade e contextos diferentes, para evitar cola.' },\n    { t: 'Rubrica', p: 'Transforme os critérios das questões discursivas em uma rubrica com 4 níveis (insuficiente, básico, adequado, avançado) e descrições observáveis.' },\n    { t: 'Revisar clareza', p: 'Revise os enunciados como se fosse um aluno com dificuldade de leitura. Aponte trechos ambíguos e reescreva.' },\n    { t: 'Acessibilidade', p: 'Adapte a avaliação para um aluno com dislexia: frases curtas, fonte grande sugerida, uma instrução por vez e sem pegadinhas.' }\n  ],\n  example: {\n    title: 'Matemática, 8º ano, porcentagem',\n    context: 'Avaliação fictícia de 10 questões em 50 minutos.',\n    lines: ['Questão 4 (aplicar): uma camiseta de R$ 80 tem 15% de desconto à vista. Quanto se paga?', 'Alternativa C (R$ 65): erro comum de subtrair 15 reais em vez de 15%.', 'Discursiva 9: comparar dois planos de celular e justificar a escolha com cálculo.']\n  },\n  checklist: ['Cada questão está ligada a um objetivo.', 'A distribuição de dificuldade está equilibrada.', 'Eu resolvi todas as questões e o gabarito confere.', 'Não há questões que dependam de interpretação dupla.', 'O tempo de prova é suficiente.', 'Os dados numéricos das questões estão corretos.'],\n  mistakes: [\n    { e: 'Usar o gabarito da IA sem resolver a prova.', c: 'A IA pode errar contas e marcar a alternativa errada. Resolva tudo antes.' },\n    { e: 'Pedir só questões de múltipla escolha.', c: 'Combine tipos para medir compreensão e aplicação.' },\n    { e: 'Questões descontextualizadas.', c: 'Peça situações do cotidiano dos alunos.' }\n  ],\n  next: ['adaptar-niveis', 'aula-completa', 'revisor-especializado'],\n  src: ['C8']\n});\n\nPLAYBOOK.apps.push({\n  id: 'adaptar-niveis', n: 4, full: true,\n  title: 'Adaptar conteúdos para diferentes níveis de conhecimento',\n  summary: 'Gere versões do mesmo conteúdo para iniciantes, intermediários e avançados sem perder o rigor.',\n  cats: ['educacao', 'marketing'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'As duas resolvem. No Claude, o estilo \"Explicativo\" ajuda em respostas didáticas; no ChatGPT, a personalidade pode ser ajustada em Personalização.',\n  level: 'iniciante', time: '15 a 30 min', avail: 'gratuito', obj: ['criar', 'revisar'],\n  reqs: ['Texto original', 'Descrição dos públicos'],\n  kw: ['adaptação', 'níveis', 'inclusão', 'simplificar', 'linguagem simples', 'diferenciação'],\n  problem: 'A mesma turma tem alunos em níveis muito diferentes, e o mesmo material corporativo precisa servir a quem começou ontem e a quem já é especialista. Reescrever tudo à mão é inviável.',\n  result: 'Três versões do mesmo conteúdo, com vocabulário, exemplos e profundidade ajustados, mantendo as mesmas ideias centrais.',\n  when: ['Turmas heterogêneas.', 'Materiais de onboarding para pessoas de áreas diferentes.', 'Inclusão de alunos com dificuldades de leitura.', 'Versões resumidas para pais ou gestores.'],\n  before: ['Texto original.', 'Quem são os públicos e o que cada um já sabe.', 'O que não pode ser perdido em nenhuma versão.'],\n  steps: [\n    'Cole o texto original na conversa ou anexe o arquivo.',\n    'Use o prompt principal descrevendo cada nível.',\n    'Compare as versões lado a lado e confira se as ideias centrais estão em todas.',\n    'Peça ajustes pontuais em uma versão por vez.',\n    'Salve as versões no projeto da disciplina para reutilizar.'\n  ],\n  prompt: `Atue como especialista em linguagem clara e educação diferenciada.\n\nTexto original\n[Cole aqui o texto]\n\nIdeias que precisam estar em todas as versões\n[liste 3 a 5 ideias centrais]\n\nCrie três versões\n1. Iniciante: [descreva o público, ex.: alunos de 12 anos que nunca estudaram o tema]. Frases curtas, vocabulário do dia a dia, uma analogia concreta.\n2. Intermediário: [descreva]. Termos técnicos introduzidos com definição, exemplos práticos.\n3. Avançado: [descreva]. Linguagem técnica, nuances, uma questão para aprofundamento.\n\nRegras\nNão invente dados novos. Não remova as ideias centrais. Cada versão deve ser autossuficiente.\n\nFormato\nPara cada versão: título, texto e um quadro \"o que mudou em relação ao original\".\n\nSe o texto original tiver ambiguidades, aponte antes de adaptar.`,\n  refinements: [\n    { t: 'Linguagem simples', p: 'Revise a versão iniciante seguindo princípios de linguagem simples: frases com até 15 palavras, voz ativa, uma ideia por frase.' },\n    { t: 'Aprofundar exemplos', p: 'Na versão intermediária, troque os exemplos por situações do contexto [área ou cidade dos alunos].' },\n    { t: 'Checar fidelidade', p: 'Compare as três versões com o original e liste qualquer informação que tenha sido alterada, exagerada ou perdida.' }\n  ],\n  example: {\n    title: 'Texto sobre juros compostos',\n    context: 'Material fictício de educação financeira para adolescentes, jovens adultos e gestores.',\n    lines: ['Iniciante: \"Juros compostos são juros que também rendem juros, como uma bola de neve que cresce enquanto rola.\"', 'Intermediário: apresenta a fórmula M = C(1+i)^t com um exemplo de poupança mensal.', 'Avançado: discute o efeito da taxa real versus nominal e propõe comparar dois investimentos.']\n  },\n  checklist: ['As ideias centrais aparecem nas três versões.', 'Nenhum dado foi inventado.', 'A versão iniciante tem frases curtas.', 'Os termos técnicos da versão intermediária vêm com definição.', 'Testei a versão iniciante com alguém do público, se possível.'],\n  mistakes: [\n    { e: 'Simplificar demais e distorcer o conceito.', c: 'Use o refinamento \"Checar fidelidade\".' },\n    { e: 'Descrever o público de forma vaga (\"leigos\").', c: 'Diga idade, contexto e o que a pessoa já sabe.' }\n  ],\n  next: ['exercicios-avaliacoes', 'plano-estudos', 'aula-completa'],\n  src: ['C12', 'O14']\n});\n\nPLAYBOOK.apps.push({\n  id: 'plano-estudos', n: 5, full: true,\n  title: 'Criar um plano de estudos',\n  summary: 'Monte um cronograma realista de estudos com metas semanais, revisões e formas de medir o progresso.',\n  cats: ['educacao', 'produtividade'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'As duas resolvem. Para acompanhar o plano em planilha, peça um arquivo .xlsx no Claude ou uma tabela para copiar.',\n  level: 'iniciante', time: '20 a 30 min', avail: 'gratuito', obj: ['planejar', 'organizar'],\n  reqs: ['Objetivo do estudo e prazo', 'Horas disponíveis por semana'],\n  kw: ['cronograma', 'estudos', 'concurso', 'vestibular', 'rotina', 'revisão espaçada', 'aprendizado'],\n  problem: 'Planos de estudo costumam ser otimistas demais e abandonados na segunda semana. Falta encaixar o plano na rotina real e prever revisões.',\n  result: 'Um cronograma semanal com metas claras, revisões programadas, marcos de verificação e plano B para semanas difíceis.',\n  when: ['Preparação para prova, certificação ou concurso.', 'Aprender uma ferramenta nova no trabalho.', 'Orientar alunos sobre organização de estudos.'],\n  before: ['Objetivo concreto e data limite.', 'Conteúdos ou edital.', 'Horas livres reais por dia da semana.', 'Pontos fortes e fracos.'],\n  steps: [\n    'Liste com honestidade suas horas disponíveis antes de abrir a conversa.',\n    'Cole o prompt e o edital ou a lista de conteúdos.',\n    'Revise a carga semanal proposta. Se parecer pesada, peça redução.',\n    'Peça a versão em tabela ou planilha.',\n    'A cada semana, volte à mesma conversa ou projeto e informe o que foi cumprido para ajustar o plano.'\n  ],\n  prompt: `Atue como orientador de estudos com experiência em aprendizagem e gestão de tempo.\n\nObjetivo\n[ex.: passar na prova X, dominar Excel intermediário, ler 6 livros do curso]\nData limite: [data]\n\nDisponibilidade real\n[ex.: segunda a sexta, 1h por dia à noite; sábado, 3h pela manhã]\n\nConteúdos\n[cole a lista ou o edital]\n\nMeu ponto de partida\nFortes: [ ]. Fracos: [ ].\n\nMonte um plano de estudos que\n1. Caiba exatamente na disponibilidade informada, com 10% de folga.\n2. Priorize conteúdos com maior peso e meus pontos fracos.\n3. Inclua revisões espaçadas (1 dia, 7 dias e 30 dias depois).\n4. Tenha um marco de verificação a cada 2 semanas com um teste simples.\n5. Traga um plano B para semanas com menos tempo.\n\nFormato\nTabela semanal (semana, dia, conteúdo, tipo de atividade, duração) e um resumo com as metas de cada mês.\n\nSe alguma informação estiver faltando, pergunte antes.`,\n  refinements: [\n    { t: 'Reduzir carga', p: 'O plano está pesado para mim. Reduza 20% da carga sem tirar os conteúdos de maior peso.' },\n    { t: 'Técnicas de estudo', p: 'Para cada tipo de conteúdo, sugira uma técnica de estudo ativa (questões, mapa mental, explicação em voz alta) e explique como aplicar em 10 minutos.' },\n    { t: 'Ajuste semanal', p: 'Nesta semana cumpri: [o que foi feito]. Não consegui: [o que ficou]. Reorganize as próximas duas semanas sem estourar o prazo final.' }\n  ],\n  example: {\n    title: 'Certificação em gestão de projetos em 10 semanas',\n    context: 'Profissional fictício com 6 horas por semana.',\n    lines: ['Semanas 1 e 2: fundamentos e escopo (4h estudo + 1h questões + 1h revisão).', 'Marco da semana 4: simulado de 30 questões; meta de 60% de acerto.', 'Plano B: semanas corridas mantêm só questões e revisão (2h).']\n  },\n  checklist: ['A carga cabe na minha rotina real.', 'Há revisões programadas.', 'Existem marcos com teste.', 'Conteúdos de maior peso vêm primeiro.', 'Existe plano B.'],\n  mistakes: [\n    { e: 'Informar disponibilidade ideal, e não real.', c: 'Anote uma semana comum antes de pedir o plano.' },\n    { e: 'Fazer o plano e nunca mais voltar à conversa.', c: 'Use o refinamento \"Ajuste semanal\" toda semana.' }\n  ],\n  next: ['organizar-semana', 'adaptar-niveis', 'checklists-procedimentos'],\n  src: ['C8']\n});\n\n/* =========================================================\n   APLICAÇÕES · tutoriais completos (6 a 10 · Design)\n   ========================================================= */\nPLAYBOOK.apps.push({\n  id: 'imagens-ia', n: 6, full: true,\n  title: 'Criar imagens com IA',\n  summary: 'Escreva um briefing visual completo e gere ilustrações, cartazes e imagens de apoio com edição por etapas.',\n  cats: ['design', 'marketing'], tools: ['chatgpt', 'claude'], rec: 'chatgpt', alt: 'claude',\n  recNote: 'O ChatGPT gera e edita imagens em todos os planos (com limite no Free). O Claude não gera fotos nem ilustrações; use-o para escrever o briefing e o prompt visual, ou para criar diagramas e layouts em SVG.',\n  level: 'iniciante', time: '15 a 30 min', avail: 'gratuito', obj: ['criar'],\n  reqs: ['ChatGPT (qualquer plano; volume limitado no Free)', 'Objetivo e uso da imagem'],\n  kw: ['imagem', 'ilustração', 'cartaz', 'gerar imagem', 'chatgpt images', 'arte'],\n  problem: 'Encontrar a imagem certa em bancos de imagem consome tempo e nem sempre existe uma que mostre exatamente o que você precisa. Pedidos vagos para a IA geram imagens genéricas.',\n  result: 'Uma imagem pronta para uso, na proporção certa, gerada a partir de um briefing claro e refinada em rodadas.',\n  when: ['Ilustrar um conceito em aula.', 'Capa de material ou apostila.', 'Cartaz de evento interno.', 'Imagem de apoio para post ou apresentação.'],\n  before: ['Para que a imagem será usada e em qual formato (quadrado, vertical, horizontal).', 'Estilo desejado e referências visuais.', 'Textos que devem aparecer na imagem, escritos exatamente.', 'Cores da marca, se houver.'],\n  steps: [\n    'No ChatGPT, peça a imagem na conversa ou abra Imagens na barra lateral. Lá também há modelos prontos.',\n    'Use o prompt principal com o briefing preenchido.',\n    'Escolha a proporção no seletor de proporção ou escreva no prompt.',\n    'Se tiver uma imagem de referência, anexe e diga o que aproveitar dela.',\n    'Para corrigir uma parte, selecione a imagem, use a ferramenta de seleção e descreva a mudança.',\n    'Baixe a versão final e confira textos e detalhes em tamanho real.',\n    'Opcional: peça ao Claude para transformar uma ideia vaga em briefing visual e cole o resultado no ChatGPT.'\n  ],\n  prompt: `Crie uma imagem com as seguintes especificações.\n\nUso: [ex.: capa de apostila de Ciências para o 6º ano]\nFormato: [quadrado 1:1 / vertical 4:5 / horizontal 16:9]\nAssunto principal: [descreva a cena ou o objeto central]\nElementos secundários: [o que mais deve aparecer]\nEstilo: [ex.: ilustração plana com cores suaves / fotografia natural / aquarela]\nPaleta: [cores principais, se houver]\nIluminação e clima: [ex.: luz do dia, clima alegre e curioso]\nTexto na imagem: \"[texto exato]\" ou \"sem texto\"\nEvitar: [ex.: pessoas reais identificáveis, logos de terceiros, excesso de elementos]\n\nAntes de gerar, se algo estiver ambíguo, me pergunte.`,\n  refinements: [\n    { t: 'Ajustar composição', p: 'Mantenha tudo, mas deixe mais espaço livre na parte superior para eu colocar o título depois.' },\n    { t: 'Corrigir detalhe', p: 'Corrija apenas [elemento]. Não altere cores, estilo nem posição dos demais elementos.' },\n    { t: 'Variação de estilo', p: 'Gere a mesma cena em estilo [outro estilo], mantendo enquadramento e paleta.' },\n    { t: 'Briefing com o Claude', p: 'No Claude: transforme esta ideia em um briefing visual detalhado para uma ferramenta de geração de imagens, com assunto, composição, estilo, paleta, luz e o que evitar: [ideia].' }\n  ],\n  example: {\n    title: 'Cartaz de feira de ciências',\n    context: 'Escola fictícia Horizonte, formato vertical.',\n    lines: ['Assunto: estudantes montando um vulcão de bicarbonato em uma bancada colorida.', 'Texto exato: \"Feira de Ciências 2027\".', 'Rodada 2: \"deixe o texto maior e centralizado, sem mudar a cena\".']\n  },\n  checklist: ['O texto da imagem está escrito corretamente.', 'A proporção serve para o uso planejado.', 'Não há pessoas reais identificáveis nem marcas de terceiros.', 'Mãos, rostos e objetos não têm deformações.', 'As cores combinam com o material onde a imagem será usada.', 'O uso respeita as políticas da ferramenta.'],\n  mistakes: [\n    { e: 'Prompt de uma linha, como \"imagem de escola\".', c: 'Descreva assunto, estilo, formato e o que evitar.' },\n    { e: 'Pedir para mudar tudo de uma vez.', c: 'Corrija um aspecto por rodada.' },\n    { e: 'Esperar que o Claude gere a imagem.', c: 'O Claude não gera fotos nem ilustrações. Use-o para o briefing ou para diagramas.' }\n  ],\n  next: ['infograficos', 'materiais-visuais-aula', 'roteiros-storyboards'],\n  src: ['O6', 'C10']\n});\n\nPLAYBOOK.apps.push({\n  id: 'infograficos', n: 7, full: true,\n  title: 'Criar infográficos',\n  summary: 'Transforme dados e processos em infográficos claros, com hierarquia visual e textos curtos.',\n  cats: ['design', 'marketing', 'educacao'], tools: ['claude', 'chatgpt'], rec: 'claude', alt: 'chatgpt',\n  recNote: 'O Claude cria infográficos editáveis como artefato Design ou como visual em HTML e SVG, com texto preciso. O ChatGPT pode gerar o infográfico como imagem; confira os textos com atenção, porque erros de grafia em imagem são difíceis de corrigir.',\n  level: 'intermediario', time: '30 a 60 min', avail: 'gratuito', obj: ['criar', 'organizar'],\n  reqs: ['Dados ou conteúdo organizado', 'No Claude: \"Criar e editar arquivos\" ativado'],\n  kw: ['infográfico', 'visual', 'dados', 'processo', 'linha do tempo', 'diagrama'],\n  problem: 'Informações importantes se perdem em textos longos. Fazer um infográfico em ferramenta de design exige tempo e prática.',\n  result: 'Um infográfico com título, blocos de informação hierarquizados, ícones ou gráficos e fonte dos dados, pronto para exportar.',\n  when: ['Resumir um processo em etapas.', 'Apresentar dados de uma pesquisa.', 'Comparar opções.', 'Linha do tempo de um conteúdo histórico.'],\n  before: ['Conteúdo base revisado (os dados precisam estar certos antes).', 'Formato final (A4, post, slide).', 'Cores e fonte da identidade visual.', 'Fonte dos dados.'],\n  steps: [\n    'Comece pelo conteúdo: peça à IA para organizar o texto em blocos curtos e aprove.',\n    'No Claude, escolha Output, modelo Design, ou peça \"crie um infográfico\".',\n    'Cole o prompt principal com os blocos aprovados.',\n    'Revise número por número no resultado.',\n    'Peça ajustes de hierarquia e espaçamento.',\n    'Exporte em PDF, imagem ou HTML pelo menu do artefato.',\n    'No ChatGPT, use o mesmo conteúdo para gerar uma imagem e confira cada palavra antes de usar.'\n  ],\n  prompt: `Atue como designer de informação.\n\nObjetivo\nCriar um infográfico sobre [tema] para [público], que será usado em [onde: impresso A4, post vertical, slide].\n\nConteúdo aprovado\n[Cole os blocos de texto e dados. Indique a fonte de cada dado.]\n\nEstrutura desejada\n[ex.: processo em 5 etapas / comparação entre 3 opções / linha do tempo]\n\nDiretrizes visuais\nCores: [cores em hexadecimal]. Fonte: [fonte]. Fundo claro.\nHierarquia: título curto que diga a conclusão, subtítulo de uma linha, blocos com no máximo 20 palavras cada.\nUse ícones simples ou gráficos quando ajudarem a entender. Inclua a fonte dos dados no rodapé.\n\nRegras\nNão altere nenhum número. Não acrescente informações que não estejam no conteúdo aprovado.\n\nAntes de montar, confirme comigo a estrutura em tópicos.`,\n  refinements: [\n    { t: 'Melhorar hierarquia visual', p: 'Aumente o contraste entre título, números de destaque e texto de apoio. O olho deve ler primeiro o número mais importante.' },\n    { t: 'Reduzir texto', p: 'Corte 30% do texto mantendo todos os números. Troque frases por rótulos quando possível.' },\n    { t: 'Revisar consistência', p: 'Confira se cada número do infográfico é idêntico ao do conteúdo aprovado. Liste as diferenças, se houver.' },\n    { t: 'Acessibilidade', p: 'Garanta contraste de leitura adequado e que nenhuma informação dependa só da cor.' }\n  ],\n  example: {\n    title: 'Como funciona a coleta seletiva no bairro',\n    context: 'Material fictício de uma associação de moradores.',\n    lines: ['Título: \"Separar em 3 grupos já resolve 80% do lixo\" (dado fictício para exemplo).', 'Blocos: recicláveis secos, orgânicos, rejeitos, com ícone e exemplos.', 'Rodapé: fonte dos dados e dias de coleta.']\n  },\n  checklist: ['Todos os números foram conferidos com a fonte.', 'O título comunica a conclusão.', 'Cada bloco tem no máximo 20 palavras.', 'A fonte dos dados aparece.', 'O contraste é suficiente para impressão.', 'Não há erros de grafia.'],\n  mistakes: [\n    { e: 'Começar pelo visual com conteúdo ainda bagunçado.', c: 'Aprove o texto antes do layout.' },\n    { e: 'Usar infográfico gerado como imagem sem revisar textos.', c: 'Leia cada palavra; prefira layouts editáveis quando o texto é crítico.' }\n  ],\n  next: ['materiais-visuais-aula', 'imagens-ia', 'apresentacoes-identidade'],\n  src: ['C3', 'C16', 'O6']\n});\n\nPLAYBOOK.apps.push({\n  id: 'materiais-visuais-aula', n: 8, full: true,\n  title: 'Desenvolver materiais visuais para aulas',\n  summary: 'Crie fichas, mapas mentais, cartões de atividade e quadros de apoio para imprimir ou projetar.',\n  cats: ['design', 'educacao'], tools: ['claude', 'chatgpt'], rec: 'claude', alt: 'chatgpt',\n  recNote: 'O Claude monta fichas e cartões editáveis (Design, Docs ou PDF) com texto preciso. O ChatGPT complementa com ilustrações geradas.',\n  level: 'iniciante', time: '20 a 45 min', avail: 'gratuito', obj: ['criar'],\n  reqs: ['Conteúdo da aula', 'Formato de impressão ou projeção'],\n  kw: ['ficha', 'mapa mental', 'cartões', 'material didático', 'impressão', 'atividade'],\n  problem: 'Materiais de apoio feitos às pressas ficam poluídos e difíceis de ler. Montar fichas e cartões em editor de texto consome horas.',\n  result: 'Um conjunto de materiais de apoio padronizados (ficha de atividade, cartões ou mapa mental), prontos para imprimir.',\n  when: ['Atividades em grupo com cartões.', 'Fichas de exercício.', 'Mapa mental de revisão.', 'Quadro de rotina para a sala.'],\n  before: ['Conteúdo e objetivo do material.', 'Tamanho de impressão e quantidade.', 'Se será impresso em preto e branco.', 'Faixa etária.'],\n  steps: [\n    'Defina o tipo de material e cole o prompt.',\n    'No Claude, peça o material como Design ou PDF para impressão.',\n    'Revise o conteúdo antes do visual.',\n    'Peça versão em preto e branco se a impressora da escola não for colorida.',\n    'Imprima uma página de teste antes de imprimir para a turma toda.'\n  ],\n  prompt: `Atue como designer instrucional que cria materiais impressos para sala de aula.\n\nMaterial\n[ficha de atividade / 12 cartões de perguntas / mapa mental / quadro de rotina]\n\nConteúdo\n[Cole o conteúdo ou descreva o tema e o objetivo.]\n\nPúblico\n[idade, série, necessidades específicas]\n\nEspecificações\nTamanho: [A4 retrato, cartões de 9 x 6 cm, etc.]. Impressão: [colorida / preto e branco].\nFonte legível e grande para a idade. Margens seguras para impressão. Espaço para o aluno escrever, quando for ficha.\n\nRegras\nLinguagem adequada à idade. Instruções numeradas e curtas. Nenhum dado inventado.\n\nEntregue um arquivo pronto para imprimir. Antes, mostre a estrutura do material em tópicos para eu aprovar.`,\n  refinements: [\n    { t: 'Versão econômica', p: 'Adapte para impressão em preto e branco, sem fundos coloridos, economizando tinta.' },\n    { t: 'Diferenciar níveis', p: 'Crie duas versões da ficha: uma com apoio (exemplos resolvidos) e outra sem apoio.' },\n    { t: 'Ilustrações', p: 'Liste as ilustrações que ajudariam neste material e escreva um prompt de imagem para cada uma, para eu gerar no ChatGPT.' }\n  ],\n  example: {\n    title: 'Cartões de perguntas para revisão',\n    context: 'Turma fictícia do 5º ano, tema sistema solar.',\n    lines: ['12 cartões, 4 por folha A4, com pergunta na frente e resposta no verso.', 'Cores por nível de dificuldade, com o nível escrito também (não só a cor).']\n  },\n  checklist: ['O material está legível impresso.', 'Linguagem adequada à idade.', 'Instruções curtas e numeradas.', 'Testei a impressão de uma página.', 'Conteúdo conferido.'],\n  mistakes: [\n    { e: 'Fonte pequena demais para o tamanho do cartão.', c: 'Peça tamanho mínimo de fonte e teste a impressão.' },\n    { e: 'Usar só cor para indicar dificuldade.', c: 'Escreva o nível também, para impressões em preto e branco.' }\n  ],\n  next: ['infograficos', 'imagens-ia', 'apresentacao-didatica'],\n  src: ['C3', 'C8', 'O6']\n});\n\nPLAYBOOK.apps.push({\n  id: 'roteiros-storyboards', n: 9, full: true,\n  title: 'Criar roteiros e storyboards para vídeos',\n  summary: 'Planeje vídeos curtos ou aulas gravadas com roteiro cena a cena, falas, enquadramentos e lista de captação.',\n  cats: ['design', 'marketing', 'educacao'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'As duas escrevem roteiros. O ChatGPT pode gerar quadros ilustrados do storyboard como imagem; o Claude pode montar o storyboard como documento ou tabela editável.',\n  level: 'intermediario', time: '30 a 60 min', avail: 'gratuito', obj: ['criar', 'planejar'],\n  reqs: ['Objetivo do vídeo', 'Duração e canal de publicação'],\n  kw: ['roteiro', 'vídeo', 'storyboard', 'reels', 'videoaula', 'gravação', 'youtube'],\n  problem: 'Gravar sem roteiro gera vídeos longos, repetitivos e com cortes difíceis. Sem storyboard, a captação esquece cenas importantes.',\n  result: 'Um roteiro com gancho, desenvolvimento e fechamento, falas cronometradas, tabela de storyboard e lista do que gravar.',\n  when: ['Videoaulas e tutoriais.', 'Vídeos curtos para redes sociais.', 'Vídeo institucional.', 'Explicação de um processo interno.'],\n  before: ['Objetivo e público do vídeo.', 'Duração máxima e formato (vertical, horizontal).', 'Quem aparece e onde será gravado.', 'Mensagem principal em uma frase.'],\n  steps: [\n    'Escreva a mensagem principal em uma frase antes de abrir a conversa.',\n    'Cole o prompt principal.',\n    'Leia o roteiro em voz alta cronometrando. Ajuste o que passar do tempo.',\n    'Peça o storyboard em tabela.',\n    'Opcional: gere no ChatGPT um quadro ilustrado para as cenas mais difíceis de explicar.',\n    'Gere a lista de captação e leve impressa para a gravação.'\n  ],\n  prompt: `Atue como roteirista de vídeos educativos e de comunicação.\n\nVídeo\nObjetivo: [o que a pessoa deve saber ou fazer ao final]\nPúblico: [quem assiste]\nCanal e formato: [ex.: Instagram, vertical 9:16 / YouTube, horizontal]\nDuração máxima: [segundos ou minutos]\nMensagem principal: [uma frase]\nQuem aparece e onde: [ex.: professora, sala de aula]\n\nEntregue\n1. Três opções de gancho para os primeiros 3 segundos.\n2. Roteiro completo com falas, dividido em cenas, com tempo de cada cena.\n3. Storyboard em tabela: cena, tempo, enquadramento, o que aparece, fala, texto na tela.\n4. Lista de captação: tomadas, objetos, locais e áudio.\n5. Sugestão de legenda e chamada final.\n\nRegras\nLinguagem falada, frases curtas. Nada de promessas exageradas. O tempo total não pode passar do limite.\n\nSe faltar informação, pergunte antes.`,\n  refinements: [\n    { t: 'Encurtar', p: 'Corte o roteiro para [X] segundos mantendo o gancho e a chamada final.' },\n    { t: 'Ajustar ao público', p: 'Reescreva as falas para soar natural para [público], como se fosse uma conversa.' },\n    { t: 'Quadros ilustrados', p: 'Para as cenas 1, 3 e 5, escreva um prompt de imagem para eu gerar um quadro de storyboard no ChatGPT.' }\n  ],\n  example: {\n    title: 'Vídeo de 45 segundos sobre como usar a biblioteca da escola',\n    context: 'Escola fictícia, vertical, apresentado por um aluno.',\n    lines: ['Gancho: \"Você sabia que dá para reservar livro pelo celular?\"', 'Cena 2 (10s): close no QR code da estante; texto na tela \"aponte a câmera\".', 'Lista de captação: 6 tomadas, celular com tripé, microfone de lapela.']\n  },\n  checklist: ['O gancho funciona nos 3 primeiros segundos.', 'O roteiro lido em voz alta cabe no tempo.', 'Cada cena tem enquadramento definido.', 'Há chamada final clara.', 'Autorizações de imagem dos participantes estão garantidas.'],\n  mistakes: [\n    { e: 'Roteiro escrito como texto de leitura.', c: 'Peça linguagem falada e leia em voz alta.' },\n    { e: 'Esquecer autorização de uso de imagem, principalmente de menores.', c: 'Providencie autorização antes de gravar.' }\n  ],\n  next: ['imagens-ia', 'apresentacao-didatica', 'materiais-visuais-aula'],\n  src: ['O6', 'C3']\n});\n\nPLAYBOOK.apps.push({\n  id: 'apresentacoes-identidade', n: 10, full: true,\n  title: 'Criar apresentações com identidade visual consistente',\n  summary: 'Defina regras visuais uma vez e gere apresentações que seguem sempre as mesmas cores, fontes e padrões.',\n  cats: ['design', 'documentos', 'comercial'], tools: ['claude', 'chatgpt'], rec: 'claude', alt: 'chatgpt',\n  recNote: 'O artefato Design do Claude usa o seu design system, e o artefato Slides exporta para PowerPoint e Google Slides. Um projeto com as regras visuais nas instruções garante consistência em todas as apresentações.',\n  level: 'intermediario', time: '45 a 90 min (primeira vez)', avail: 'gratuito', obj: ['criar', 'organizar'],\n  reqs: ['Manual de marca ou cores, fontes e logo', 'Projeto no Claude ou no ChatGPT'],\n  kw: ['identidade visual', 'marca', 'template', 'apresentação', 'design system', 'padrão'],\n  problem: 'Cada apresentação sai com um visual diferente, e a marca perde força. Ajustar cores e fontes slide a slide é trabalho repetitivo.',\n  result: 'Um guia visual reutilizável dentro de um projeto e apresentações que seguem esse guia desde a primeira versão.',\n  when: ['Empresas e escolas com marca definida.', 'Séries de aulas ou treinamentos.', 'Propostas comerciais recorrentes.'],\n  before: ['Cores em hexadecimal, fontes e logo.', 'Dois ou três exemplos de slides que representam bem a marca.', 'Regras do que não fazer com a marca.'],\n  steps: [\n    'Crie um projeto chamado \"Apresentações [marca]\".',\n    'Use o prompt principal para gerar o guia visual em texto.',\n    'Cole o guia nas instruções do projeto e anexe o manual de marca ao conhecimento.',\n    'Em cada nova conversa do projeto, peça a apresentação; as regras já valem.',\n    'No Claude, use o modelo Slides e exporte para PowerPoint ou Google Slides.',\n    'Revise o primeiro resultado e atualize as instruções com o que precisar mudar.'\n  ],\n  prompt: `Atue como designer de apresentações corporativas.\n\nQuero criar um guia visual curto para que todas as apresentações da [marca] sigam o mesmo padrão.\n\nInformações da marca\nCores: [primária #, secundária #, fundo #, texto #]\nFontes: [títulos, corpo]\nLogo: [onde aparece e tamanho]\nTom: [ex.: profissional, claro, próximo]\nNão fazer: [ex.: fundos com degradê, mais de 2 cores por slide]\n\nEntregue um guia com\n1. Regras de layout para 6 tipos de slide: capa, seção, conteúdo com texto, conteúdo com imagem, dados, encerramento.\n2. Regras de tipografia: tamanhos, pesos e limite de palavras por slide.\n3. Regras de cor: uso de cada cor e contraste mínimo.\n4. Regras para gráficos e ícones.\n5. Uma checklist final de conferência.\n\nEscreva o guia em formato de instruções diretas, porque vou colar nas instruções de um projeto.`,\n  refinements: [\n    { t: 'Testar o guia', p: 'Usando o guia das instruções do projeto, crie uma apresentação de 6 slides sobre [tema] com um slide de cada tipo.' },\n    { t: 'Revisar consistência', p: 'Revise esta apresentação contra o guia visual e liste cada slide que quebra alguma regra.' },\n    { t: 'Melhorar hierarquia visual', p: 'Ajuste os slides de dados para que o número principal seja o primeiro elemento lido.' }\n  ],\n  example: {\n    title: 'Padrão visual para treinamentos internos',\n    context: 'Empresa fictícia Atlas Educação, cor primária azul e fundo claro.',\n    lines: ['Capa: logo no canto superior esquerdo, título em até 6 palavras.', 'Slide de dados: um número grande por slide, fonte em 14 pt no rodapé.', 'Regra: no máximo 2 cores além do fundo por slide.']\n  },\n  checklist: ['As instruções do projeto contêm o guia visual.', 'Cores e fontes batem com o manual de marca.', 'O logo aparece nos slides previstos.', 'Contraste adequado para projeção.', 'Exportação testada no formato que a equipe usa.'],\n  mistakes: [\n    { e: 'Repetir as regras de marca em cada conversa.', c: 'Coloque o guia nas instruções do projeto.' },\n    { e: 'Descrever cores por nome (\"azul bonito\").', c: 'Use códigos hexadecimais.' }\n  ],\n  next: ['apresentacao-didatica', 'apresentacoes-servicos', 'instrucoes-personalizadas'],\n  src: ['C3', 'C2', 'O2']\n});\n\n/* =========================================================\n   APLICAÇÕES · tutoriais completos (11, 20, 21, 23, 25, 29)\n   ========================================================= */\nPLAYBOOK.apps.push({\n  id: 'propostas-comerciais', n: 11, full: true,\n  title: 'Elaborar propostas comerciais',\n  summary: 'Monte propostas que partem do problema do cliente, com escopo claro, entregáveis, prazos e próximos passos.',\n  cats: ['comercial', 'documentos'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'As duas resolvem. Para entregar a proposta em Word ou PDF já formatado, o Claude cria o arquivo com a criação de arquivos ativada.',\n  level: 'intermediario', time: '30 a 60 min', avail: 'gratuito', obj: ['criar', 'revisar'],\n  reqs: ['Anotações da conversa com o cliente', 'Tabela de serviços e condições da empresa'],\n  kw: ['proposta', 'orçamento', 'cliente', 'escopo', 'vendas', 'comercial', 'serviços'],\n  problem: 'Propostas genéricas listam serviços e preço, mas não mostram que a empresa entendeu o problema do cliente. O cliente compara só preço.',\n  result: 'Uma proposta personalizada com diagnóstico, solução, escopo, cronograma, investimento, condições e próximo passo, pronta para revisão final.',\n  when: ['Depois de uma reunião de diagnóstico.', 'Renovação de contrato com escopo novo.', 'Padronizar propostas da equipe comercial.'],\n  before: ['Anotações da reunião (sem dados sensíveis desnecessários).', 'Serviços, entregáveis e condições comerciais reais da empresa.', 'Cases ou resultados que podem ser citados.', 'Prazo de validade da proposta.'],\n  steps: [\n    'Crie um projeto \"Propostas\" com a tabela de serviços e um modelo de proposta aprovado no conhecimento.',\n    'Abra uma conversa no projeto e cole o prompt com as anotações do cliente.',\n    'Revise primeiro o diagnóstico: se a IA não entendeu o problema, corrija antes de seguir.',\n    'Peça a proposta completa e ajuste escopo e valores com os dados reais.',\n    'Gere o arquivo final em Word ou PDF.',\n    'Revise preços, prazos e nomes manualmente antes de enviar.'\n  ],\n  prompt: `Atue como consultor comercial sênior que escreve propostas consultivas.\n\nEmpresa que envia a proposta\n[nome, o que faz, diferenciais reais]\n\nCliente\n[empresa, segmento, porte, quem decide]\n\nO que ouvi na reunião\n[cole as anotações: dores, objetivos, prazos, tentativas anteriores, objeções]\n\nServiços e condições que posso oferecer\n[cole a tabela de serviços, entregáveis, prazos e condições reais]\n\nMonte uma proposta com\n1. Resumo do entendimento (o problema com as palavras do cliente).\n2. Objetivos e indicadores de sucesso.\n3. Solução proposta e por que ela resolve o problema.\n4. Escopo: o que está incluído e o que não está.\n5. Cronograma por fases.\n6. Investimento e condições (use somente os valores que informei).\n7. Próximo passo com data sugerida.\n\nRegras\nNão invente resultados, números ou cases. Tom profissional e direto. Frases curtas. Sem jargão de marketing.\n\nSe faltar algo essencial para a proposta, pergunte antes de escrever.`,\n  refinements: [\n    { t: 'Ajustar ao decisor', p: 'O decisor é [cargo] e se preocupa principalmente com [ex.: risco e prazo]. Reescreva o resumo e a solução falando dessa preocupação.' },\n    { t: 'Melhorar clareza', p: 'Revise a proposta para que alguém que não participou da reunião entenda tudo em 3 minutos de leitura.' },\n    { t: 'Antecipar objeções', p: 'Liste as 5 objeções mais prováveis deste cliente e sugira onde a proposta pode responder a cada uma.' },\n    { t: 'Versão resumida', p: 'Crie uma versão de uma página para enviar por e-mail junto com a proposta completa.' }\n  ],\n  example: {\n    title: 'Proposta de treinamento em IA para uma escola',\n    context: 'Consultoria fictícia para o Colégio Vale Verde, 40 professores.',\n    lines: ['Entendimento: \"Os professores usam IA de forma isolada e a coordenação quer padronizar o uso com segurança.\"', 'Escopo inclui 3 encontros de 3 horas; não inclui configuração de contas institucionais.', 'Próximo passo: reunião de alinhamento com a coordenação até [data].']\n  },\n  checklist: ['O diagnóstico usa as palavras do cliente.', 'Escopo diz o que está e o que não está incluído.', 'Valores e prazos são os reais da empresa.', 'Nenhum resultado foi inventado.', 'Há próximo passo com data.', 'Revisei nomes, cargos e dados do cliente.'],\n  mistakes: [\n    { e: 'Deixar a IA inventar números de resultado.', c: 'Proíba no prompt e revise cada número.' },\n    { e: 'Colar dados pessoais ou confidenciais do cliente sem necessidade.', c: 'Envie apenas o necessário e use códigos quando possível.' },\n    { e: 'Proposta igual para clientes diferentes.', c: 'Comece sempre pelas anotações da reunião.' }\n  ],\n  next: ['apresentacoes-servicos', 'respostas-objecoes', 'assistente-comercial'],\n  src: ['C8', 'C2', 'O2']\n});\n\nPLAYBOOK.apps.push({\n  id: 'projeto-chatgpt', n: 20, full: true,\n  title: 'Criar um projeto no ChatGPT',\n  summary: 'Organize conversas, arquivos e instruções de um mesmo trabalho em um projeto, com memória própria.',\n  cats: ['assistentes', 'gestao'], tools: ['chatgpt'], rec: 'chatgpt', alt: 'claude',\n  recNote: 'Tutorial específico do ChatGPT. Projetos estão disponíveis para usuários conectados, inclusive no plano gratuito, com limites de arquivos por plano.',\n  level: 'iniciante', time: '10 a 15 min', avail: 'gratuito', obj: ['organizar'],\n  reqs: ['Conta do ChatGPT conectada', 'Arquivos de referência do trabalho'],\n  kw: ['projeto', 'chatgpt', 'organizar', 'pasta', 'instruções do projeto', 'arquivos'],\n  problem: 'Conversas sobre o mesmo assunto ficam espalhadas no histórico, e você precisa reenviar arquivos e explicar o contexto toda vez.',\n  result: 'Um projeto configurado com nome, instruções e arquivos, onde cada nova conversa já começa com o contexto certo.',\n  when: ['Uma disciplina ou turma.', 'Um cliente ou conta.', 'Um projeto com várias etapas.', 'Um assistente pessoal para uma tarefa recorrente.'],\n  before: ['Nome do projeto.', 'Instruções: quem você é, objetivo, tom e formato preferidos.', 'Arquivos de referência (Free: até 5; Go e Plus: até 25).', 'Decidir se o projeto será compartilhado.'],\n  steps: [\n    'Na barra lateral do ChatGPT, crie um novo projeto e dê um nome claro.',\n    'Abra o projeto e adicione as instruções do projeto, com o texto gerado pelo prompt abaixo.',\n    'Adicione os arquivos de referência. Prefira documentos com texto selecionável.',\n    'Para levar conversas antigas para o projeto, mova cada conversa para dentro dele.',\n    'Comece uma conversa dentro do projeto e teste com uma tarefa real.',\n    'Se precisar, compartilhe o projeto convidando pessoas, conforme o seu plano permite.'\n  ],\n  prompt: `Me ajude a escrever as instruções de um projeto no ChatGPT.\n\nO projeto é sobre: [ex.: minhas aulas de Biologia do 1º ano]\nEu sou: [profissão, contexto]\nO que vou fazer neste projeto: [ex.: planos de aula, exercícios, adaptações]\nPúblico final: [quem recebe o que eu produzo]\nArquivos que vou anexar: [ex.: ementa, livro, calendário]\nTom e formato preferidos: [ex.: direto, com tabelas, em português do Brasil]\nO que evitar: [ex.: conteúdo fora da ementa, linguagem infantilizada]\n\nEscreva instruções com até 1.500 caracteres, em tópicos, que digam:\n1. Quem eu sou e o objetivo do projeto.\n2. Como usar os arquivos anexados (prioridade sobre conhecimento geral).\n3. Formato padrão das respostas.\n4. Quando perguntar antes de responder.\n5. O que nunca fazer.`,\n  refinements: [\n    { t: 'Testar as instruções', p: 'Com base nas instruções e nos arquivos deste projeto, crie [tarefa real]. Depois, diga quais instruções você seguiu e quais ficaram ambíguas.' },\n    { t: 'Enxugar instruções', p: 'Reescreva as instruções do projeto com metade do tamanho, sem perder regras importantes.' },\n    { t: 'Checar uso dos arquivos', p: 'Responda usando apenas os arquivos do projeto e indique de qual arquivo veio cada informação.' }\n  ],\n  example: {\n    title: 'Projeto \"Biologia 1º ano\"',\n    context: 'Professora fictícia com ementa, calendário e livro adotado.',\n    lines: ['Instrução: \"Use a ementa anexada como referência principal. Se o pedido estiver fora dela, avise.\"', 'Arquivos: ementa.pdf, calendario-2027.pdf, capitulo-celulas.pdf.', 'Primeira conversa: plano de aula sobre membrana plasmática.']\n  },\n  checklist: ['O nome do projeto é fácil de achar.', 'As instruções cabem no limite e estão em tópicos.', 'Os arquivos estão atualizados.', 'Testei com uma tarefa real.', 'Revisei se há dados sensíveis nos arquivos.', 'Decidi conscientemente sobre compartilhamento.'],\n  mistakes: [\n    { e: 'Projeto sem instruções.', c: 'As instruções são o que transforma o projeto em assistente. Escreva pelo menos 5 tópicos.' },\n    { e: 'Arquivos desatualizados no projeto.', c: 'Substitua versões antigas para a IA não misturar informações.' },\n    { e: 'Um projeto para tudo.', c: 'Crie projetos por assunto, cliente ou turma.' }\n  ],\n  next: ['instrucoes-personalizadas', 'assistente-aulas', 'projeto-claude'],\n  src: ['O2', 'O4', 'O3']\n});\n\nPLAYBOOK.apps.push({\n  id: 'projeto-claude', n: 21, full: true,\n  title: 'Criar um projeto no Claude',\n  summary: 'Monte um espaço com conhecimento, instruções e memória própria para trabalhar sempre com o contexto certo.',\n  cats: ['assistentes', 'gestao'], tools: ['claude'], rec: 'claude', alt: 'chatgpt',\n  recNote: 'Tutorial específico do Claude. Projetos estão em todos os planos; no gratuito, o limite é de 5 projetos.',\n  level: 'iniciante', time: '10 a 15 min', avail: 'gratuito', obj: ['organizar'],\n  reqs: ['Conta do Claude', 'Documentos de referência (até 30 MB cada)'],\n  kw: ['projeto', 'claude', 'conhecimento', 'instruções', 'memória do projeto'],\n  problem: 'Sem um projeto, cada conversa começa do zero e o contexto importante se perde entre dezenas de chats.',\n  result: 'Um projeto com conhecimento, instruções e memória separada, pronto para produzir com consistência.',\n  when: ['Trabalho recorrente com os mesmos materiais.', 'Mentorias, disciplinas, clientes.', 'Assistentes especializados.'],\n  before: ['Nome e objetivo do projeto.', 'Documentos de referência.', 'Instruções sobre tom, formato e limites.', 'No plano gratuito: verificar se você já tem 5 projetos.'],\n  steps: [\n    'Na barra lateral do Claude, abra Projetos e crie um projeto novo.',\n    'Escreva a descrição e as instruções do projeto (use o prompt abaixo para rascunhar).',\n    'Adicione documentos, textos ou arquivos ao conhecimento do projeto.',\n    'Abra uma conversa dentro do projeto e teste com uma tarefa real.',\n    'Se quiser a memória do projeto totalmente separada, desligue \"Use account memory\" na seção Memória da página do projeto.',\n    'Nos planos pagos, quando o conhecimento cresce, o Claude ativa o modo RAG automaticamente para ampliar a capacidade.'\n  ],\n  prompt: `Me ajude a escrever as instruções de um projeto no Claude.\n\nProjeto: [nome e objetivo]\nQuem sou: [profissão e contexto]\nTarefas que vou pedir aqui: [liste]\nMateriais no conhecimento do projeto: [liste os arquivos]\nPúblico final das entregas: [quem]\nTom, formato e idioma: [preferências]\nLimites: [o que nunca fazer]\n\nEscreva instruções em tópicos curtos que definam:\n1. Papel do Claude neste projeto.\n2. Como priorizar os materiais do conhecimento.\n3. Formato padrão das entregas.\n4. Quando fazer perguntas antes de responder.\n5. Critérios de qualidade que toda resposta precisa cumprir.`,\n  refinements: [\n    { t: 'Testar com caso real', p: 'Usando as instruções e o conhecimento deste projeto, faça [tarefa]. Depois, aponte qualquer instrução que tenha ficado ambígua.' },\n    { t: 'Citar a origem', p: 'Responda com base no conhecimento do projeto e diga de qual documento veio cada informação.' },\n    { t: 'Revisar instruções', p: 'Revise as instruções do projeto e sugira cortes e melhorias para respostas mais consistentes.' }\n  ],\n  example: {\n    title: 'Projeto \"Mentoria IA para professores\"',\n    context: 'Mentora fictícia com roteiro de encontros e materiais de apoio.',\n    lines: ['Conhecimento: roteiro-mentoria.pdf, checklist-privacidade.docx.', 'Instrução: \"Explique como para alguém que usa IA há menos de 3 meses. Sempre termine com um exercício prático.\"', 'Teste: \"prepare o encontro 2 sobre projetos e instruções\".']\n  },\n  checklist: ['Instruções definem papel, formato e limites.', 'Os documentos do conhecimento são as versões atuais.', 'Testei com uma tarefa real.', 'Configurei a memória do projeto como desejado.', 'Removi dados sensíveis desnecessários.'],\n  mistakes: [\n    { e: 'Enviar arquivos enormes e esperar respostas precisas sobre tudo.', c: 'Envie os documentos mais relevantes e peça citações da origem.' },\n    { e: 'Misturar assuntos diferentes no mesmo projeto.', c: 'Um projeto por tema ou cliente.' }\n  ],\n  next: ['instrucoes-personalizadas', 'assistente-aulas', 'base-conhecimento'],\n  src: ['C2', 'C1', 'C5', 'C4']\n});\n\nPLAYBOOK.apps.push({\n  id: 'instrucoes-personalizadas', n: 23, full: true,\n  title: 'Criar instruções personalizadas',\n  summary: 'Ensine a ferramenta a responder do seu jeito em todas as conversas, com instruções curtas e testáveis.',\n  cats: ['assistentes', 'produtividade'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'No ChatGPT: Configurações, Personalização (até 1.500 caracteres no Free e no Go, 5.000 nos demais). No Claude: preferências de perfil em Configurações, Geral, e estilos de resposta.',\n  level: 'iniciante', time: '15 a 20 min', avail: 'gratuito', obj: ['organizar'],\n  reqs: ['Conta em qualquer uma das ferramentas'],\n  kw: ['instruções personalizadas', 'preferências', 'personalização', 'perfil', 'estilo', 'tom'],\n  problem: 'Toda conversa começa com as mesmas explicações: quem você é, que formato prefere, que tom usar. As respostas saem genéricas.',\n  result: 'Um texto de instruções testado, aplicado nas configurações da ferramenta, que melhora todas as conversas seguintes.',\n  when: ['Primeiro dia de uso.', 'Quando as respostas estão longas, genéricas ou no tom errado.', 'Mudança de função ou de rotina de trabalho.'],\n  before: ['Sua função e contexto de trabalho.', 'Formato de resposta preferido.', 'Coisas que você não quer nas respostas.'],\n  steps: [\n    'Use o prompt abaixo para rascunhar as instruções.',\n    'ChatGPT, web e desktop: Configurações, Personalização, ative a personalização e cole no campo de instruções personalizadas.',\n    'ChatGPT, celular: Configurações, Personalizar ChatGPT.',\n    'Claude: Configurações, Geral, campo de preferências que o Claude deve considerar.',\n    'Claude: escolha também um estilo no menu de ferramentas da conversa (Normal, Conciso, Formal, Explicativo) ou crie um estilo personalizado.',\n    'Abra uma conversa nova e teste com três pedidos comuns do seu dia.',\n    'Ajuste o texto e teste de novo.'\n  ],\n  prompt: `Me ajude a escrever instruções personalizadas para uma assistente de IA.\n\nSobre mim\nProfissão e contexto: [ ]\nTarefas mais comuns: [ ]\nNível de experiência com o assunto: [ ]\n\nComo quero as respostas\nTom: [ex.: direto e cordial]\nTamanho: [ex.: curto por padrão, detalhado quando eu pedir]\nFormato: [ex.: tópicos e tabelas quando houver comparação]\nIdioma: português do Brasil\n\nO que evitar\n[ex.: introduções longas, jargão, emojis, inventar dados]\n\nEscreva instruções com no máximo [1.500] caracteres, em frases imperativas e testáveis. Inclua uma regra para a assistente perguntar quando faltar informação e outra para indicar incerteza.`,\n  refinements: [\n    { t: 'Testar', p: 'Considerando estas instruções, responda a estes três pedidos e depois diga quais regras você aplicou: [pedido 1], [pedido 2], [pedido 3].' },\n    { t: 'Encurtar', p: 'Reduza as instruções para 800 caracteres mantendo as regras que mais mudam as respostas.' },\n    { t: 'Versão por contexto', p: 'Crie uma variação destas instruções para usar dentro de um projeto específico sobre [tema].' }\n  ],\n  example: {\n    title: 'Instruções de uma professora de Língua Portuguesa',\n    context: 'Exemplo fictício.',\n    lines: ['\"Sou professora do ensino médio. Responda em português do Brasil, com exemplos de sala de aula.\"', '\"Prefira tópicos curtos. Use tabela quando comparar opções.\"', '\"Se faltar informação sobre a turma, pergunte antes. Se não tiver certeza de um dado, diga.\"']\n  },\n  checklist: ['As instruções cabem no limite do plano.', 'Cada regra pode ser verificada na resposta.', 'Há regra sobre perguntar quando falta informação.', 'Há regra sobre indicar incerteza.', 'Testei com pedidos reais.'],\n  mistakes: [\n    { e: 'Instruções vagas como \"seja útil\".', c: 'Escreva regras observáveis: tamanho, formato, tom.' },\n    { e: 'Colocar dados sensíveis nas instruções.', c: 'Instruções valem para todas as conversas; deixe de fora o que não precisa.' }\n  ],\n  next: ['projeto-chatgpt', 'projeto-claude', 'revisor-especializado'],\n  src: ['O13', 'O14', 'C11', 'C12']\n});\n\nPLAYBOOK.apps.push({\n  id: 'assistente-aulas', n: 25, full: true,\n  title: 'Criar um assistente para planejamento de aulas',\n  summary: 'Configure um projeto que planeja aulas no seu padrão, com a sua ementa, o seu calendário e os seus critérios.',\n  cats: ['assistentes', 'educacao'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'Em contas pessoais, o caminho mais estável nas duas ferramentas é um projeto com instruções e arquivos. No ChatGPT, contas pessoais não criam novos GPTs; no Claude, o plano gratuito permite até 5 projetos.',\n  level: 'intermediario', time: '40 a 60 min', avail: 'gratuito', obj: ['planejar', 'organizar', 'automatizar'],\n  reqs: ['Projeto no ChatGPT ou no Claude', 'Ementa, calendário e um plano de aula modelo'],\n  kw: ['assistente', 'professor', 'planejamento', 'projeto', 'gpt', 'aulas', 'modelo'],\n  problem: 'Mesmo com bons prompts, cada plano de aula exige reexplicar turma, ementa e formato. O resultado varia de uma conversa para outra.',\n  result: 'Um assistente (projeto) que gera planos de aula no seu formato, consulta a sua ementa e faz as perguntas certas antes de planejar.',\n  when: ['Professores com várias turmas.', 'Coordenações que querem padronizar planos.', 'Preparação de semestre inteiro.'],\n  before: ['Ementa ou planejamento anual.', 'Calendário letivo.', 'Um plano de aula que você considera modelo.', 'Critérios da escola (BNCC, formato exigido).'],\n  steps: [\n    'Crie um projeto chamado \"Assistente de aulas [disciplina]\".',\n    'Use o prompt principal para gerar as instruções do assistente e cole nas instruções do projeto.',\n    'Anexe ao projeto: ementa, calendário e plano modelo.',\n    'Faça três testes com aulas diferentes e anote o que ficou fora do padrão.',\n    'Ajuste as instruções com base nos testes.',\n    'Use sempre conversas dentro do projeto para planejar.',\n    'A cada bimestre, atualize os arquivos e revise as instruções.'\n  ],\n  prompt: `Escreva as instruções de um assistente de planejamento de aulas que vai funcionar dentro de um projeto.\n\nSobre o professor\nDisciplina: [ ]. Turmas: [séries, número de alunos, perfil]. Escola: [pública/privada, recursos].\n\nArquivos que estarão no projeto\n- Ementa: [nome do arquivo]\n- Calendário: [nome do arquivo]\n- Plano modelo: [nome do arquivo]\n\nO assistente deve\n1. Antes de planejar, perguntar turma, data e duração, se não forem informadas.\n2. Conferir na ementa se o tema faz parte do conteúdo previsto e avisar se não fizer.\n3. Seguir exatamente a estrutura do plano modelo.\n4. Incluir objetivos com verbos observáveis, roteiro com tempos, atividade prática e avaliação.\n5. Sugerir adaptação para alunos com dificuldade.\n6. Indicar quando um conteúdo precisa de conferência em fonte oficial.\n\nO assistente nunca deve\nInventar competências da BNCC ou datas do calendário. Usar recursos que a escola não tem.\n\nFormato\nInstruções em tópicos curtos, prontas para colar no projeto.`,\n  refinements: [\n    { t: 'Rodada de teste', p: 'Planeje a aula de [data] para a turma [X] sobre [tema]. Ao final, liste quais instruções do projeto você seguiu.' },\n    { t: 'Corrigir desvio', p: 'O último plano não seguiu a estrutura do plano modelo em [ponto]. Proponha uma alteração nas instruções para isso não se repetir.' },\n    { t: 'Planejar sequência', p: 'Com base no calendário, proponha a sequência das próximas 8 aulas, uma linha por aula, sem detalhar ainda.' }\n  ],\n  example: {\n    title: 'Assistente de Geografia, 6º ano',\n    context: 'Professora fictícia com 3 turmas e aulas de 45 minutos.',\n    lines: ['Pergunta automática: \"Qual turma e qual data? A aula é de 45 ou de 90 minutos?\"', 'Aviso: \"Este tema não aparece na ementa do 6º ano. Deseja continuar?\"', 'Resultado: plano no formato do modelo, com adaptação para dois alunos com dificuldade de leitura.']\n  },\n  checklist: ['As instruções estão no projeto.', 'Ementa, calendário e plano modelo foram anexados.', 'Fiz pelo menos três testes.', 'O assistente pergunta o que falta.', 'Os planos seguem o modelo.', 'Revisei se os arquivos têm dados de alunos e removi o que não precisa.'],\n  mistakes: [\n    { e: 'Esperar perfeição no primeiro teste.', c: 'Ajuste as instruções após cada rodada.' },\n    { e: 'Anexar listas com nomes de alunos.', c: 'Use perfis anônimos da turma.' },\n    { e: 'Procurar criar um GPT em conta pessoal.', c: 'Contas pessoais não criam novos GPTs; use projetos.' }\n  ],\n  next: ['aula-completa', 'projeto-claude', 'projeto-chatgpt'],\n  src: ['O2', 'O9', 'C2']\n});\n\nPLAYBOOK.apps.push({\n  id: 'pesquisa-fontes', n: 29, full: true,\n  title: 'Pesquisar um assunto com fontes verificáveis',\n  summary: 'Pesquise com busca na web ou pesquisa aprofundada e confira cada afirmação na fonte original.',\n  cats: ['pesquisa'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'Busca na web nas duas, inclusive nos planos gratuitos. Para relatórios longos: deep research no ChatGPT (limitado no Free e no Go) e Research no Claude (planos pagos, com a pesquisa na web ligada).',\n  level: 'intermediario', time: '20 a 60 min', avail: 'depende', obj: ['pesquisar', 'analisar'],\n  reqs: ['Pergunta de pesquisa clara', 'Pesquisa na web ativada'],\n  kw: ['pesquisa', 'fontes', 'citação', 'deep research', 'research', 'verificar', 'referências'],\n  problem: 'Respostas sem fonte podem estar desatualizadas ou erradas. Mesmo com links, a IA pode interpretar mal o que a fonte diz.',\n  result: 'Um resumo de pesquisa com afirmações ligadas às fontes, nível de confiança, divergências entre fontes e lacunas identificadas.',\n  when: ['Atualizar um material com dados recentes.', 'Preparar uma aula ou palestra.', 'Levantar informações antes de uma decisão.', 'Checar se uma informação ainda é válida.'],\n  before: ['Pergunta de pesquisa específica.', 'Tipos de fonte aceitas (governo, estudos, sites oficiais).', 'Período de interesse.', 'Como o resultado será usado.'],\n  steps: [\n    'Escolha o modo: busca rápida para fatos pontuais; pesquisa aprofundada para relatórios.',\n    'ChatGPT, deep research: digite /Deepresearch, use o menu \"+\" ou a barra lateral. Revise o plano de pesquisa antes de começar.',\n    'Claude, web search: ative no menu de ferramentas. Research: botão \"+\", opção Research (planos pagos).',\n    'Cole o prompt principal.',\n    'Abra pelo menos as fontes das afirmações mais importantes e confira o trecho.',\n    'Peça para separar o que é consenso, o que é divergente e o que não foi encontrado.',\n    'Registre fontes e data da consulta no seu material.'\n  ],\n  prompt: `Atue como pesquisador rigoroso.\n\nPergunta de pesquisa\n[pergunta específica]\n\nContexto de uso\n[ex.: aula para o ensino médio / decisão de compra / artigo interno]\n\nCritérios de fontes\nPriorize: [ex.: órgãos oficiais, universidades, documentação oficial, estudos revisados por pares].\nEvite: [ex.: blogs sem autoria, conteúdo patrocinado].\nPeríodo: [ex.: últimos 2 anos].\n\nEntregue\n1. Resposta direta em até 5 linhas.\n2. Principais achados em tópicos, cada um com a fonte (título e link) e a data da fonte.\n3. Nível de confiança de cada achado (alto, médio, baixo) e o motivo.\n4. Divergências entre fontes.\n5. O que não foi possível confirmar.\n\nRegras\nNão afirme nada sem fonte. Se não encontrar, diga que não encontrou. Diferencie fato, estimativa e opinião.`,\n  refinements: [\n    { t: 'Conferir citação', p: 'Para o achado [número], copie o trecho exato da fonte que sustenta a afirmação e explique se a interpretação está correta.' },\n    { t: 'Buscar contraponto', p: 'Procure fontes confiáveis que discordem dos achados principais e resuma os argumentos.' },\n    { t: 'Adaptar para o público', p: 'Transforme os achados confirmados em um resumo de uma página para [público], mantendo as fontes no final.' }\n  ],\n  example: {\n    title: 'Uso de celulares em sala de aula',\n    context: 'Coordenação fictícia quer revisar a política da escola.',\n    lines: ['Achado com fonte oficial e data, confiança alta.', 'Divergência: estudos diferentes medem efeitos em faixas etárias distintas.', 'Não confirmado: dados locais da rede municipal.']\n  },\n  checklist: ['Cada afirmação importante tem fonte.', 'Abri e conferi as fontes principais.', 'As fontes são confiáveis e recentes.', 'Divergências estão registradas.', 'Registrei a data da consulta.', 'Separei fatos de opiniões.'],\n  mistakes: [\n    { e: 'Confiar no link sem abrir.', c: 'Abra e confira o trecho; a interpretação pode estar errada.' },\n    { e: 'Pergunta ampla demais, como \"fale sobre educação\".', c: 'Delimite tema, público, período e uso.' },\n    { e: 'Usar pesquisa aprofundada para pergunta simples.', c: 'Busca rápida resolve fatos pontuais e gasta menos limite.' }\n  ],\n  next: ['docs-extensos', 'analisar-planilhas', 'aula-completa'],\n  src: ['O5', 'C6', 'C7', 'O1', 'C1']\n});\n\n/* =========================================================\n   APL ext: ['base-conhecimento', 'organizar-arquivos', 'fluxo-multietapas'],\n  src: ['C3']\n});\n\nPLAYBOOK.apps.push({\n  id: 'organizar-arquivos', n: 22, full: false,\n  title: 'Organizar arquivos e referências',\n  summary: 'Defina uma estrutura de pastas, nomes de arquivo e um índice de referências para você e para a IA.',\n  cats: ['gestao', 'assistentes'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'As duas ajudam a desenhar a estrutura. Arquivos bem nomeados facilitam o uso em projetos das duas ferramentas.',\n  level: 'iniciante', time: '20 a 30 min', avail: 'gratuito', obj: ['organizar'],\n  reqs: ['Lista dos tipos de arquivo que você usa'],\n  kw: ['pastas', 'arquivos', 'nomes', 'organização', 'drive', 'referências'],\n  problem: 'Arquivos com nomes como \"final_v3_agora_vai\" dificultam achar a versão certa e confundem a IA em projetos.',\n  result: 'Uma estrutura de pastas, regra de nomes, índice de referências e rotina de manutenção.',\n  when: ['Antes de montar projetos na IA.', 'Começo de semestre ou de contrato.'],\n  steps: ['Liste os tipos de arquivo e como você procura por eles.', 'Use o prompt.', 'Aplique a regra nos arquivos novos e reorganize os antigos aos poucos.'],\n  prompt: `Atue como especialista em gestão de informação. Eu trabalho com [descreva] e guardo estes tipos de arquivo: [liste].\nProponha: estrutura de pastas com até 3 níveis, regra de nome de arquivo com data no formato AAAA-MM-DD, onde guardar versões finais e rascunhos, um modelo de índice de referências e uma rotina mensal de 15 minutos para manter tudo organizado.`,\n  checklist: ['A estrutura tem no máximo 3 níveis.', 'A regra de nomes inclui data e versão.', 'Existe um lugar único para versões finais.'],\n  next: ['base-conhecimento', 'projeto-claude', 'projeto-chatgpt'],\n  src: []\n});\n\nPLAYBOOK.apps.push({\n  id: 'base-conhecimento', n: 24, full: false,\n  title: 'Estruturar uma base de conhecimento',\n  summary: 'Organize documentos e respostas frequentes para alimentar projetos e assistentes com informação confiável.',\n  cats: ['gestao', 'assistentes'], tools: ['claude', 'chatgpt'], rec: 'ambas', alt: null,\n  recNote: 'Projetos das duas ferramentas usam arquivos como conhecimento. No Claude pago, o modo RAG amplia a capacidade de projetos grandes.',\n  level: 'avancado', time: '1 a 2 h', avail: 'depende', obj: ['organizar', 'planejar'],\n  reqs: ['Documentos de referência atualizados', 'Lista de perguntas frequentes'],\n  kw: ['base de conhecimento', 'faq', 'rag', 'documentação', 'conhecimento'],\n  problem: 'Assistentes respondem mal quando recebem documentos desatualizados, repetidos ou contraditórios.',\n  result: 'Um conjunto curado de documentos com índice, perguntas frequentes e regras de atualização.',\n  when: ['Antes de criar assistentes especializados.', 'Atendimento interno ou a clientes.'],\n  steps: ['Reúna e elimine documentos duplicados ou vencidos.', 'Use o prompt para organizar perguntas frequentes.', 'Coloque os documentos curados no projeto e teste com perguntas reais.'],\n  prompt: `Atue como gestor de conhecimento. Vou usar estes documentos como base de um assistente: [liste com data de atualização].\nAjude a: identificar sobreposições e contradições, propor um índice por tema, escrever 20 perguntas frequentes com resposta curta e indicação do documento de origem, e definir quem atualiza o quê e com que frequência.`,\n  checklist: ['Não há documentos vencidos.', 'Cada resposta indica a fonte.', 'Existe responsável pela atualização.'],\n  next: ['assistente-comercial', 'projeto-claude', 'docs-extensos'],\n  src: ['C2', 'O2']\n});\n\nPLAYBOOK.apps.push({\n  id: 'assistente-comercial', n: 26, full: false,\n  title: 'Criar um assistente comercial',\n  summary: 'Configure um projeto que conhece sua oferta, seus clientes ideais e seu processo de vendas.',\n  cats: ['assistentes', 'comercial'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'Use projetos nas duas ferramen
