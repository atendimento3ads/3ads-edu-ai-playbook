is em uma skill e aplique no Canvas. Com plano pago, o Gemini no Google Slides gera slides no tema atual da apresentação.',\n    steps: ['Crie uma skill com o guia visual da marca (Personalizar, Skills).', 'No Canvas, chame a skill com \"/\" e peça a apresentação.', 'Exporte para o Google Slides.', 'No Slides, use Pergunte ao Gemini para gerar slides novos, que seguem o tema da apresentação.'],\n    tip: 'Comece de uma apresentação que já tem o tema da marca no Slides.',\n    src: ['G8', 'G3', 'G19']\n  },\n  'propostas-comerciais': {\n    avail: 'depende',\n    note: 'Se as anotações e a tabela de serviços estão no Drive, o Gemini as usa sem você baixar nada. No Google Docs, o Help me create (plano Google AI Pro ou Ultra) gera o rascunho formatado a partir de arquivos, e-mails e web.',\n    steps: ['Conecte o Google Workspace nos apps conectados.', 'Na conversa, peça a proposta citando os arquivos do Drive pelo nome.', 'Alternativa com plano pago: abra um documento no Docs e use o Help me create com o prompt principal.', 'Revise valores e prazos manualmente.'],\n    tip: 'O Docs mantém as edições sugeridas visíveis só para você até aprovar.',\n    src: ['G9', 'G17']\n  },\n  'pesquisa-fontes': {\n    avail: 'gratuito',\n    note: 'O Deep Research do Gemini está no plano gratuito, com limite diário de relatórios. Ele mostra o plano de pesquisa antes de começar e pode incluir Gmail e Drive como fonte.',\n    steps: ['Em gemini.google.com, clique em Ferramentas e depois em Deep Research.', 'Cole o prompt principal.', 'Revise e ajuste o plano de pesquisa proposto.', 'Abra as fontes do relatório e confira os trechos.', 'Transforme o relatório em infográfico, quiz ou página no Canvas, se quiser.'],\n    tip: 'Mantenha Manter atividade ligado se quiser reencontrar relatórios antigos.',\n    src: ['G4', 'G3']\n  },\n  'apresentacoes-servicos': {\n    avail: 'gratuito',\n    note: 'Gere a estrutura com o prompt e monte a apresentação no Canvas, com exportação para o Google Slides.',\n    steps: ['Use o prompt para aprovar a lista de slides.', 'Abra o Canvas e peça a apresentação completa.', 'Exporte para o Google Slides e revise os números.'],\n    tip: 'Anexe os cases do Drive para o Gemini não inventar provas.',\n    src: ['G3']\n  },\n  'roteiros-reunioes': {\n    avail: 'gratuito',\n    note: 'Com o Workspace conectado, o Gemini consulta e-mails anteriores com o cliente para preparar o roteiro.',\n    steps: ['Conecte o Google Workspace.', 'Peça \"resuma minhas últimas conversas por e-mail com [cliente]\" antes do prompt principal.', 'Gere o roteiro.'],\n    tip: 'Confira se o resumo dos e-mails não deixou fora algum pedido importante.',\n    src: ['G9']\n  },\n  'respostas-objecoes': {\n    avail: 'gratuito',\n    note: 'O prompt funciona igual. Para treinar em voz, use o Gemini Live no app móvel.',\n    steps: ['Cole o prompt principal.', 'Peça ao Gemini para simular o cliente.'],\n    tip: 'Guarde as respostas aprovadas em uma skill para a equipe usar.',\n    src: ['G8']\n  },\n  'organizar-semana': {\n    avail: 'depende',\n    note: 'Com o Workspace conectado, o Gemini lê sua Agenda e cria eventos e tarefas. Com plano pago, uma ação agendada pode montar o plano toda segunda.',\n    steps: ['Conecte o Google Workspace.', 'Peça \"organize minha semana considerando minha agenda e estas pendências: ...\".', 'Peça para criar os blocos de foco na Agenda.', 'Plano Google AI Pro ou Ultra: transforme o pedido em ação agendada.'],\n    tip: 'Revise antes de aceitar eventos criados automaticamente.',\n    src: ['G9', 'G12']\n  },\n  'resumir-reunioes': {\n    avail: 'gratuito',\n    note: 'Envie a transcrição autorizada ou cite o documento do Drive. Em planos Workspace elegíveis, o Google Meet tem \"Tomar notas por mim\".',\n    steps: ['Envie o arquivo ou cite o documento do Drive.', 'Cole o prompt principal.', 'Exporte a ata para o Google Docs.'],\n    tip: 'Use transcrições somente com autorização dos participantes.',\n    src: ['G7', 'G16']\n  },\n  'emails': {\n    avail: 'depende',\n    note: 'No Gmail, o Gemini aparece no painel lateral e no Help me write. Para contas pessoais, o Help me write e os resumos de conversa são gratuitos só nos EUA; nos demais países dependem de plano Google AI.',\n    steps: ['No Gmail, abra um e-mail e clique em Pergunte ao Gemini, ou use Help me write ao escrever.', 'Cole o prompt principal descrevendo destinatário, objetivo e tom.', 'Revise o rascunho antes de enviar.'],\n    tip: 'Português é um dos idiomas do Help me write no Gmail.',\n    src: ['G16', 'G20']\n  },\n  'docs-extensos': {\n    avail: 'gratuito',\n    note: 'Para vários documentos sobre o mesmo tema, crie um notebook: ele reúne as fontes e sincroniza com o Gemini Notebook.',\n    steps: ['Envie o documento ou adicione-o a um notebook.', 'Cole o prompt principal pedindo citação da página.', 'Confira os trechos no original.'],\n    tip: 'Arquivos até 100 MB, segundo a central de ajuda.',\n    src: ['G7', 'G14']\n  },\n  'checklists-procedimentos': {\n    avail: 'gratuito',\n    note: 'Gere o procedimento no Canvas e exporte para o Google Docs, onde a equipe consulta.',\n    steps: ['Abra o Canvas e cole o prompt principal com a descrição.', 'Exporte para o Google Docs e compartilhe com a equipe.'],\n    tip: 'Transforme o checklist final em quiz no Canvas para treinar pessoas novas.',\n    src: ['G3']\n  },\n  'organizar-arquivos': {\n    avail: 'gratuito',\n    note: 'Com o Workspace conectado, o Gemini procura arquivos no seu Drive e ajuda a montar o índice de referências.',\n    steps: ['Conecte o Google Workspace.', 'Peça \"liste meus arquivos do Drive sobre [tema] e sugira nomes no padrão AAAA-MM-DD\".', 'Aplique a estrutura no Drive.'],\n    tip: 'O Gemini consulta o Drive, mas mover e renomear arquivos continua sendo feito por você.',\n    src: ['G9']\n  },\n  'base-conhecimento': {\n    avail: 'gratuito',\n    note: 'No ecossistema Google, a base de conhecimento cabe em um notebook do Gemini, que sincroniza com o Gemini Notebook (antigo NotebookLM).',\n    steps: ['Crie um notebook e adicione os documentos curados.', 'Escreva instruções do notebook com as regras de resposta.', 'Teste com perguntas frequentes e peça a fonte de cada resposta.'],\n    tip: 'Notebooks no app Gemini ainda não estão disponíveis para contas de trabalho ou escola.',\n    src: ['G14', 'G15']\n  },\n  'assistente-comercial': {\n    avail: 'gratuito',\n    note: 'Crie uma skill com as regras comerciais e combine com o Workspace conectado para consultar e-mails e arquivos dos clientes.',\n    steps: ['Crie a skill em Personalizar, Skills, com as instruções geradas pelo prompt.', 'Envie a tabela de serviços como arquivo da skill.', 'Em qualquer conversa, digite \"/\" e o nome da skill.'],\n    tip: 'Skills aceitam até 100 MB de arquivos e não funcionam ainda com Canvas e Deep Research.',\n    src: ['G8']\n  },\n  'revisor-especializado': {\n    avail: 'gratuito',\n    note: 'O revisor vira uma skill reutilizável no Gemini, chamada com \"/\" sempre que precisar.',\n    steps: ['Gere as instruções com o prompt principal.', 'Crie a skill em Personalizar, Skills, Criar manualmente.', 'Teste com um material que você já sabe que tem problemas.'],\n    tip: 'Várias skills podem ser combinadas na mesma conversa.',\n    src: ['G8']\n  },\n  'analisar-planilhas': {\n    avail: 'depende',\n    note: 'Se a planilha está no Google Sheets e você tem Google AI Pro ou Ultra, o Gemini trabalha dentro da planilha: resume dados, cria gráficos e tabelas dinâmicas e preenche colunas com a função AI.',\n    steps: ['Abra a planilha no Google Sheets.', 'Clique em Pergunte ao Gemini, no canto superior direito.', 'Cole o prompt principal e aprove o plano que o Gemini propõe antes de alterar a planilha.', 'Confira os cálculos principais.'],\n    tip: 'Sem plano pago, envie o arquivo ao app Gemini para uma análise conversada.',\n    src: ['G18', 'G24', 'G7']\n  },\n  'fluxo-multietapas': {\n    avail: 'pago',\n    note: 'No Gemini, etapas recorrentes viram ações agendadas (até 10 ativas, planos Google AI Pro e Ultra).',\n    steps: ['Rode o fluxo manualmente algumas vezes.', 'Peça ao Gemini para agendar a etapa que se repete.', 'Gerencie em Configurações e ajuda, Ações agendadas.'],\n    tip: 'Se a ação usa Gmail ou Drive, o Workspace precisa estar conectado.',\n    src: ['G12']\n  },\n  'assistente-aulas': {\n    avail: 'gratuito',\n    note: 'Em conta pessoal, o assistente de aulas no Gemini é uma skill. Os Gems ficaram somente leitura em 17/11/2026 e serão convertidos automaticamente em skills.',\n    steps: ['Gere as instruções com o prompt principal.', 'Vá em Personalizar, Skills, Criar, Criar manualmente.', 'Preencha nome, descrição e instruções, e envie ementa e plano modelo como arquivos.', 'Em qualquer conversa, digite \"/\" e o nome da skill antes do pedido.'],\n    tip: 'Skills ainda não funcionam com Canvas. Gere o plano na conversa e depois peça para abrir no Canvas.',\n    src: ['G8']\n  },\n  'instrucoes-personalizadas': {\n    avail: 'gratuito',\n    note: 'No Gemini, as instruções gerais ficam em Instruções para o Gemini (Informações salvas em algumas versões).',\n    steps: ['Gere o texto com o prompt principal.', 'Vá em Configurações e ajuda, Contexto pessoal (ou Personal Intelligence).', 'Clique em Adicionar e cole cada instrução.', 'Teste em uma conversa nova.'],\n    tip: 'Você pode desligar a personalização em uma conversa específica quando não quiser que ela seja usada.',\n    src: ['G10']\n  }\n};\n\n/* =========================================================\n   EXPANSÃO GEMINI · novas aplicações (31 a 39)\n   ========================================================= */\nPLAYBOOK.apps.push({\n  id: 'skills-gemini', n: 31, full: true,\n  title: 'Criar um assistente com skills no Gemini',\n  summary: 'Transforme instruções que você repete em uma skill reutilizável, chamada com \"/\" em qualquer conversa do Gemini.',\n  cats: ['assistentes', 'educacao'], tools: ['gemini'], rec: 'gemini', alt: null,\n  recNote: 'Tutorial específico do Gemini. Em contas pessoais, as skills substituíram os Gems: os Gems ficaram somente leitura em 17/11/2026 e serão removidos em 17/12/2026, com conversão automática. Contas de trabalho migram em março de 2027 e de educação em junho de 2027.',\n  level: 'intermediario', time: '20 a 40 min', avail: 'gratuito', obj: ['organizar', 'automatizar'],\n  reqs: ['Conta Google pessoal, 18 anos ou mais', 'Gemini na web ou no app para Mac para enviar arquivos à skill'],\n  kw: ['skills', 'gems', 'assistente', 'gemini', 'instruções reutilizáveis', 'gpt', 'personalizado'],\n  problem: 'Você repete as mesmas instruções toda vez que pede um plano de aula, uma revisão ou um relatório. Os Gems, que resolviam isso, estão saindo das contas pessoais.',\n  result: 'Uma skill com nome, descrição, instruções e arquivos de referência, testada e pronta para ser chamada com \"/\" em qualquer conversa.',\n  when: ['Tarefas que você faz toda semana com o mesmo padrão.', 'Recriar um Gem antes da remoção definitiva.', 'Padronizar a forma de revisar, planejar ou responder.'],\n  before: ['Instruções que você já usa e funcionam.', 'Arquivos de referência (até 100 MB no total; sem áudio, vídeo, .doc, .xls, .ppt ou arquivos compactados).', 'Dois ou três pedidos reais para testar.'],\n  steps: [\n    'Em gemini.google.com, abra a barra lateral e clique em Personalizar e depois em Skills. Se não aparecer, clique antes em Mais.',\n    'Clique em Criar e depois em Criar manualmente.',\n    'Preencha nome, descrição e instruções. Use o prompt principal abaixo para escrever as instruções.',\n    'Envie os arquivos de referência, se houver.',\n    'Clique em Criar, no topo da skill.',\n    'Em uma conversa nova, digite \"/\" e o nome da skill, depois faça o pedido.',\n    'Teste com três pedidos reais e ajuste as instruções.',\n    'Se você tinha um Gem, abra-o, baixe os arquivos de conhecimento e copie as instruções para a skill.'\n  ],\n  prompt: `Me ajude a escrever as instruções de uma skill do Gemini.\n\nA skill vai se chamar: [nome curto]\nEla serve para: [tarefa recorrente]\nQuem eu sou: [profissão e contexto]\nArquivos que vou anexar: [lista]\nFormato esperado da resposta: [tabela, tópicos, documento]\nO que a skill nunca deve fazer: [limites]\n\nEscreva:\n1. Uma descrição de uma frase para eu reconhecer a skill na lista.\n2. Instruções em tópicos curtos e imperativos.\n3. Uma regra para perguntar o que faltar antes de responder.\n4. Uma regra para indicar quando uma informação precisa ser conferida em fonte oficial.\n5. Três pedidos de teste para eu validar a skill.`,\n  refinements: [\n    { t: 'Testar a skill', p: 'Usando a skill /[nome], faça [pedido real]. Depois, liste quais instruções você aplicou e qual ficou ambígua.' },\n    { t: 'Enxugar instruções', p: 'Reescreva as instruções desta skill com metade do tamanho, mantendo as regras que mais mudam o resultado.' },\n    { t: 'Combinar skills', p: 'Use /[skill de conteúdo] e /[skill de revisão] juntas para produzir e revisar [material].' }\n  ],\n  example: {\n    title: 'Skill \"plano-de-aula\"',\n    context: 'Professora fictícia de Geografia que recria seu antigo Gem.',\n    lines: ['Descrição: \"Gera planos de aula de 50 minutos no formato da escola.\"', 'Arquivos: ementa-6ano.pdf e plano-modelo.docx.', 'Uso: \"/plano-de-aula aula sobre relevo para o 6º B na quinta\".']\n  },\n  checklist: ['A skill tem nome curto e descrição clara.', 'As instruções têm regra para perguntar o que falta.', 'Os arquivos estão dentro do limite e em formatos aceitos.', 'Testei com três pedidos reais.', 'Recriei ou conferi a conversão dos meus Gems antigos.'],\n  mistakes: [\n    { e: 'Esperar que a skill funcione no Canvas ou no Deep Research.', c: 'Esses recursos ainda não funcionam com skills. Gere o conteúdo na conversa e depois abra no Canvas.' },\n    { e: 'Enviar arquivos .doc ou .xls antigos.', c: 'Converta para .docx, .xlsx ou PDF antes de enviar.' },\n    { e: 'Procurar o botão de criar Gem.', c: 'Em contas pessoais, Gems estão somente leitura. Use Personalizar, Skills.' }\n  ],\n  next: ['assistente-aulas', 'revisor-especializado', 'instrucoes-personalizadas'],\n  src: ['G8']\n});\n\nPLAYBOOK.apps.push({\n  id: 'gemini-docs', n: 32, full: true,\n  title: 'Usar o Gemini no Google Docs',\n  summary: 'Crie rascunhos formatados, reescreva trechos e adapte documentos sem sair do Google Docs.',\n  cats: ['documentos', 'produtividade'], tools: ['gemini'], rec: 'gemini', alt: null,\n  recNote: 'Tutorial específico do ecossistema Google. Para contas pessoais, os recursos mais novos do Gemini no Docs (como o Help me create atualizado) exigem Google AI Pro ou Ultra. Contas de trabalho dependem do plano Workspace e do administrador.',\n  level: 'iniciante', time: '15 a 30 min', avail: 'pago', obj: ['criar', 'revisar'],\n  reqs: ['Google AI Pro ou Ultra (conta pessoal) ou plano Workspace elegível', 'Computador com navegador'],\n  kw: ['google docs', 'docs', 'help me create', 'help me write', 'workspace', 'documento', 'gemini'],\n  problem: 'Você escreve no Google Docs, mas precisa copiar e colar entre o documento e a IA para criar ou revisar o texto.',\n  result: 'Um documento criado ou revisado dentro do Docs, usando arquivos do Drive, e-mails e a web como referência, com as sugestões aprovadas por você.',\n  when: ['Primeiro rascunho de planos, propostas e relatórios.', 'Reescrever um trecho com outro tom.', 'Criar um documento no formato de outro que você já tem.'],\n  before: ['Plano elegível ativo.', 'Arquivos de referência no Drive, com nomes claros.', 'Idioma: o Help me write e o Help me create estão disponíveis em português.'],\n  steps: [\n    'Abra um documento no Google Docs pelo computador.',\n    'Use a barra do Gemini na parte de baixo ou o painel lateral (Pergunte ao Gemini).',\n    'Para criar do zero, descreva o documento no Help me create e cite os arquivos do Drive pelo nome.',\n    'Para reescrever, selecione o trecho e peça a mudança no Help me write.',\n    'Revise as sugestões: elas ficam visíveis só para você até serem aprovadas.',\n    'Aprove, edite e compartilhe o documento como de costume.'\n  ],\n  prompt: `Crie um [tipo de documento] para [público].\n\nObjetivo: [o que o documento precisa resolver].\nUse como referência: [nome do arquivo no Drive] e [nome do e-mail ou documento].\nEstrutura: [seções desejadas].\nTom: [direto, formal, didático].\nTamanho: [número de páginas ou palavras].\nNão invente dados: quando faltar informação, deixe um marcador [A CONFIRMAR].`,\n  refinements: [\n    { t: 'Ajustar ao público', p: 'Reescreva a seção selecionada para [público], com frases mais curtas e um exemplo prático.' },\n    { t: 'Seguir um modelo', p: 'Ajuste este documento para seguir a estrutura e a formatação de [documento modelo no Drive].' },\n    { t: 'Revisar consistência', p: 'Revise o documento e aponte números, datas e nomes que aparecem de forma diferente em seções distintas.' }\n  ],\n  example: {\n    title: 'Plano de projeto de leitura',\n    context: 'Coordenação fictícia cria o plano a partir de uma ata no Drive.',\n    lines: ['Pedido: \"Crie um plano de projeto de leitura para o 5º ano usando a ata-reuniao-pedagogica do Drive\".', 'Resultado: documento com objetivos, cronograma em tabela e marcadores [A CONFIRMAR] onde faltavam datas.']\n  },\n  checklist: ['Os arquivos citados eram as versões corretas.', 'Revisei todas as sugestões antes de aprovar.', 'Os marcadores [A CONFIRMAR] foram resolvidos.', 'Não há dados sensíveis que não deveriam estar no documento.'],\n  mistakes: [\n    { e: 'Não encontrar o Gemini no Docs.', c: 'Confirme o plano, use o computador e verifique se recursos inteligentes e personalização estão ligados na conta.' },\n    { e: 'Citar arquivos com nomes genéricos.', c: 'Renomeie arquivos no Drive para o Gemini achar o certo.' }\n  ],\n  next: ['gemini-drive', 'canvas-gemini', 'propostas-com  ao Gemini um plano de aula usando a ementa que está no Drive.', rel: ['gemini-workspace', 'gems', 'gemini-canvas'] },\n  { id: 'gems', term: 'Gems', kind: 'produto', meaning: 'Assistentes personalizados do Gemini, com instruções e arquivos próprios. Em contas pessoais, ficaram somente leitura em 17/11/2026 e estão sendo convertidos em skills; em contas de trabalho e educação, a mudança acontece em 2027.', use: 'Hoje, recriar ou conferir a conversão para skills.', example: 'Um Gem \"corretor de redação\" vira a skill \"/corretor-de-redacao\".', rel: ['skills-gemini', 'assistente', 'gpt-personalizado'] },\n  { id: 'skills-gemini', term: 'Skills (Gemini)', kind: 'produto', meaning: 'Instruções reutilizáveis do Gemini, chamadas digitando \"/\" e o nome em qualquer conversa. Podem incluir arquivos de até 100 MB e ser combinadas.', use: 'Padronizar tarefas recorrentes sem repetir instruções.', example: '\"/plano-de-aula aula sobre frações para o 6º A\".', rel: ['gems', 'instrucoes-personalizadas', 'assistente'] },\n  { id: 'gemini-canvas', term: 'Gemini Canvas', kind: 'produto', meaning: 'Espaço do app Gemini para criar e editar documentos, apresentações, apps, quizzes e código ao lado da conversa. Exporta para Google Docs e Google Slides.', use: 'Produzir e revisar materiais longos ou interativos.', example: 'Transformar um relatório em quiz para revisar a matéria.', rel: ['artifact', 'gemini-deep-research', 'google-gemini'] },\n  { id: 'gemini-deep-research', term: 'Gemini Deep Research', kind: 'produto', meaning: 'Recurso do app Gemini que planeja e executa uma pesquisa com várias buscas e entrega um relatório com fontes. Usa a Pesquisa Google e, com o Workspace conectado, Gmail e Drive.', use: 'Pesquisas que exigem comparar várias fontes.', example: 'Levantar estudos recentes sobre avaliação formativa antes de uma formação.', rel: ['grounding', 'gemini-canvas', 'alucinacao'] },\n  { id: 'google-ai-studio', term: 'Google AI Studio', kind: 'produto', meaning: 'Ambiente do Google para desenvolvedores testarem modelos Gemini, ajustarem prompts e gerarem chaves de API. Fica em aistudio.google.com e é diferente do app Gemini.', use: 'Prototipar e integrar modelos Gemini em sistemas próprios.', example: 'Um desenvolvedor testa um prompt de correção e copia o código para o sistema da escola.', rel: ['api', 'modelo', 'google-gemini'] },\n  { id: 'notebooklm', term: 'NotebookLM (Gemini Notebook)', kind: 'produto', meaning: 'Ferramenta de pesquisa do Google baseada nas fontes que você envia. Foi renomeada para Gemini Notebook em julho de 2026, continua um produto separado e sincroniza com os notebooks do app Gemini.', use: 'Estudar e analisar um conjunto fixo de documentos com respostas citadas.', example: 'Carregar os PDFs de um curso e pedir um resumo com citação de cada fonte.', rel: ['base-conhecimento', 'rag', 'google-gemini'] },\n  { id: 'google-workspace', term: 'Google Workspace', kind: 'produto', meaning: 'Conjunto de apps do Google para trabalho e estudo: Gmail, Agenda, Drive, Docs, Sheets, Slides, Meet e outros. Também é o nome dos planos para empresas e escolas.', use: 'Base de documentos e comunicação que o Gemini pode consultar.', example: 'A escola usa o Workspace for Education para e-mail e documentos dos professores.', rel: ['gemini-workspace', 'integracao'] },\n  { id: 'gemini-workspace', term: 'Gemini no Workspace', kind: 'produto', meaning: 'Recursos do Gemini dentro do Gmail, Docs, Sheets, Slides, Drive e outros apps, pelo painel \"Pergunte ao Gemini\". Em contas pessoais, a maior parte depende de plano Google AI; em contas de trabalho, do plano e do administrador.', use: 'Usar IA sem sair do documento, da planilha ou do e-mail.', example: 'Gerar um slide novo no tema da apresentação pelo painel do Slides.', rel: ['google-workspace', 'google-gemini', 'apps-conectados'] },\n  { id: 'apps-conectados', term: 'Integrações e aplicativos conectados', kind: 'conceito', meaning: 'Permissões que deixam a assistente consultar ou agir em outros apps, como e-mail, agenda e arquivos. No Gemini se chamam Apps conectados; no Claude, conectores; no ChatGPT, apps e plugins.', use: 'Responder com base nos seus dados sem copiar e colar.', example: 'Perguntar ao Gemini o que foi combinado por e-mail com um fornecedor.', rel: ['integracao', 'mcp', 'privacidade'] }\n);\n\n/* ---------- Aplicação das camadas (não destrutiva) ---------- */\n(function applyGemini() {\n  const P = PLAYBOOK;\n  P.apps.forEach(a => {\n    const g = P.appGemini[a.id];\n    if (g) { a.gemini = g; if (a.tools.indexOf('gemini') < 0) a.tools = a.tools.concat('gemini'); }\n  });\n  P.compare.forEach(r => { if (!r.gemini && P.compareGemini[r.id]) r.gemini = P.compareGemini[r.id]; });\n  P.guides.forEach(g => {\n    const add = P.guideAdditions[g.id];\n    if (add) {\n      g.blocks = g.blocks.concat(add);\n      if (g.tools.indexOf('gemini') < 0) g.tools = g.tools.concat('gemini');\n      const extra = P.guideAdditionSources[g.id] || [];\n      g.src = (g.src || []).concat(extra.filter(x => (g.src || []).indexOf(x) < 0));\n    }\n  });\n  P.checklists.forEach(c => { if (c.tools.indexOf('gemini') < 0) c.tools = c.tools.concat('gemini'); });\n  P.flows.forEach(f => {\n    const fg = P.flowGemini[f.id];\n    if (fg) { f.gemini = fg; if (f.tools.indexOf('gemini') < 0) f.tools = f.tools.concat('gemini'); }\n  });\n})();\n\n/* =========================================================\n   MODELO POR FERRAMENTA (parte 1)\n   ChatGPT, Claude e Gemini tratados de forma independente em cada\n   aplicação: status, justificativa, disponibilidade, quando usar,\n   recursos, como fazer, limitações e fontes.\n   Status: recomendado, compativel, alternativa, equivalente (tutorial\n   de outra ferramenta, com o caminho equivalente), nao (não disponível).\n   Para o Gemini, \"how\", \"src\", \"tip\" e a disponibilidade vêm de\n   PLAYBOOK.appGemini quando não são informados aqui.\n   ========================================================= */\nObject.assign(PLAYBOOK.sources, {\n  O16: { tool: 'chatgpt', title: 'Sora: produto descontinuado em 26/04/2026', url: 'https://openai.com/index/sora-is-here/' },\n  O17: { tool: 'chatgpt', title: 'App Google Drive no ChatGPT (Docs, Sheets e Slides)', url: 'https://help.openai.com/articles/10929079' },\n  O18: { tool: 'chatgpt', title: 'Apps conectados no ChatGPT', url: 'https://help.openai.com/en/articles/11487775' },\n  O19: { tool: 'chatgpt', title: 'Apps do Google no ChatGPT: controles de dados', url: 'https://help.openai.com/en/articles/10408842' },\n  C17: { tool: 'claude', title: 'Usar o Claude no Google Docs, Sheets e Slides', url: 'https://support.claude.com/pt/articles/16951679-use-claude-no-google-docs-sheets-e-slides' },\n  C18: { tool: 'claude', title: 'Usar skills no Claude', url: 'https://support.claude.com/en/articles/12512180' }\n});\n\nPLAYBOOK.toolOrder = ['chatgpt', 'claude', 'gemini'];\nPLAYBOOK.toolStatus = {\n  recomendado: { label: 'Recomendado', cls: 'ts-rec' },\n  compativel: { label: 'Compatível', cls: 'ts-comp' },\n  alternativa: { label: 'Alternativa', cls: 'ts-alt' },\n  equivalente: { label: 'Caminho equivalente', cls: 'ts-eq' },\n  nao: { label: 'Não disponível', cls: 'ts-nao' }\n};\n\nPLAYBOOK.appTools = {};\nPLAYBOOK.appPatch = {};\n\n/* ---------- 1. Planejar uma aula completa ---------- */\nPLAYBOOK.appTools['aula-completa'] = {\n  chatgpt: { st: 'recomendado', why: 'Gera o plano com o prompt principal e mostra o rascunho em um bloco de escrita, onde você edita ou revisa só o trecho selecionado.', avail: 'Todos os planos, inclusive o Free.',\n    when: 'Quando você quer ajustar o plano na própria conversa ou já organiza a disciplina em um projeto do ChatGPT.',\n    feat: ['Projetos com a ementa da disciplina', 'Blocos de escrita editáveis', 'Envio de arquivos pelo botão \"+\"'],\n    how: ['Para várias aulas da mesma disciplina, crie um projeto e adicione a ementa como arquivo.', 'Cole o prompt principal e responda às perguntas.', 'Edite o plano no bloco de escrita ou selecione um trecho e peça a revisão só dele.', 'Peça a versão final em tabela para copiar para o modelo da escola.'],\n    limits: ['Projetos no Free aceitam até 5 arquivos; no Go e no Plus, até 25.', 'No Free, há limite de envios de arquivo por dia.', 'As ações do bloco de escrita variam por plano, dispositivo e modelo.'], src: ['O2', 'O4', 'O7'] },\n  claude: { st: 'recomendado', why: 'Gera o plano e pode entregá-lo como documento no artefato Docs, que você edita, guarda e exporta para Word, PDF ou Google Docs.', avail: 'Todos os planos. O Docs exige \"Criar e editar arquivos\" ativado.',\n    when: 'Quando o plano precisa virar um documento para guardar, compartilhar ou exportar.',\n    feat: ['Projetos com a ementa no conhecimento', 'Artefato Docs', 'Estilo de resposta Explicativo'],\n    how: ['Para várias aulas, crie um projeto e coloque a ementa no conhecimento.', 'Cole o prompt principal e responda às perguntas.', 'Peça \"entregue o plano como documento\" ou escolha Output, modelo Docs.', 'Selecione um trecho e use Editar com o Claude para ajustar só aquela parte.', 'Exporte para Word, PDF ou Google Docs.'],\n    limits: ['O plano gratuito permite até 5 projetos.', 'Arquivos de projeto têm até 30 MB cada.'], src: ['C2', 'C3', 'C5'] },\n  gemini: { st: 'recomendado', when: 'Quando a ementa já está no Drive ou o plano vai morar no Google Docs.',\n    feat: ['Canvas', 'Arquivos do Google Drive', 'Skills para planos recorrentes'],\n    limits: ['O Canvas exige 18 anos ou mais.'] }\n};\n\n/* ---------- 2. Criar uma apresentação didática ---------- */\nPLAYBOOK.appPatch['apresentacao-didatica'] = {\n  steps: ['Tenha o plano de aula ou o texto-base pronto e revisado.', 'Cole o prompt principal com o seu plano de aula.', 'Revise a estrutura proposta (títulos dos slides) antes de pedir o conteúdo completo.', 'Gere a apresentação no recurso de cada ferramenta, descrito em \"Como fazer em cada ferramenta\".', 'Edite textos diretamente ou peça ajustes na conversa, um de cada vez.', 'Exporte no formato que você vai usar em sala e confira no projetor.'],\n  reqs: ['Plano de aula ou conteúdo base', 'Os requisitos de cada ferramenta estão em \"Como fazer em cada ferramenta\"']\n};\nPLAYBOOK.appTools['apresentacao-didatica'] = {\n  chatgpt: { st: 'compativel', why: 'O modo Work cria apresentações como entregável. Sem ele, o ChatGPT entrega o roteiro dos slides para você montar no seu editor.', avail: 'Work: disponibilidade e limites variam por plano.',\n    when: 'Quando o Work está disponível no seu plano ou você prefere montar os slides no seu editor.',\n    feat: ['Modo Work', 'Roteiro de slides em bloco de escrita'],\n    how: ['Abra o Work e cole o prompt principal com o plano de aula.', 'Aprove a lista de slides antes da apresentação completa.', 'Sem o Work: peça o roteiro slide a slide, com título, texto e notas, e monte no PowerPoint ou no Google Slides.'],\n    limits: ['Detalhes de exportação do Work por plano: pendente de confirmação.'], src: ['O8'] },\n  claude: { st: 'recomendado', why: 'O artefato Slides monta apresentações editáveis em todos os planos e exporta para PowerPoint, PDF e Google Slides.', avail: 'Todos os planos, com \"Criar e editar arquivos\" ativado.',\n    when: 'Quando você quer a apresentação pronta e editável sem sair da conversa.',\n    feat: ['Artefato Slides', 'Exportação para PowerPoint, PDF e Google Slides', 'Arquivos .pptx'],\n    how: ['Ative \"Criar e editar arquivos\" em Configurações, Capacidades.', 'Escolha Output, modelo Slides, ou peça \"monte uma apresentação\".', 'Cole o prompt principal com o plano de aula.', 'Edite textos direto no artefato ou peça ajustes na conversa.', 'Exporte para PowerPoint, PDF ou Google Slides.'],\n    limits: ['Sem \"Criar e editar arquivos\" ativado, o modelo Slides não aparece.'], src: ['C3', 'C8'] },\n  gemini: { st: 'recomendado', when: 'Quando a apresentação vai ser usada ou ajustada no Google Slides.',\n    feat: ['Canvas', 'Exportação para o Google Slides', 'Gemini no Google Slides (plano Google AI)'],\n    limits: ['O painel do Gemini dentro do Slides depende de plano Google AI ou Workspace elegível.'] }\n};\n\n/* ---------- 3. Elaborar exercícios e avaliações ---------- */\nPLAYBOOK.appTools['exercicios-avaliacoes'] = {\n  chatgpt: { st: 'recomendado', why: 'Gera questões e gabarito com o prompt principal e permite revisar cada questão no bloco de escrita.', avail: 'Todos os planos.',\n    when: 'Quando você vai copiar as questões para o seu modelo de prova.',\n    feat: ['Blocos de escrita', 'Projetos com o material da disciplina'],\n    how: ['Cole o prompt principal e anexe o conteúdo de referência.', 'Revise as questões no bloco de escrita e peça ajustes por questão.', 'Peça a versão final com gabarito separado.'],\n    limits: ['Formatação final da prova fica com você no editor de texto.'], src: ['O7', 'O2'] },\n  claude: { st: 'recomendado', why: 'Gera a avaliação e, com a criação de arquivos ativada, entrega o arquivo pronto em Word ou PDF.', avail: 'Todos os planos.',\n    when: 'Quando você precisa do arquivo da prova pronto para imprimir.',\n    feat: ['Criação de arquivos .docx e .pdf', 'Artefato Docs', 'Quizzes como artefato'],\n    how: ['Ative \"Criar e editar arquivos\" em Configurações, Capacidades.', 'Cole o prompt principal e anexe o conteúdo.', 'Peça \"entregue a prova em .docx e o gabarito em outro arquivo\".', 'Abra o arquivo e confira a formatação antes de imprimir.'],\n    limits: ['Arquivos gerados têm até 30 MB.'], src: ['C8', 'C3'] },\n  gemini: { st: 'recomendado', when: 'Quando você quer um quiz interativo para os alunos responderem por link.',\n    feat: ['Quiz no Canvas', 'Exportação para o Google Docs'],\n    limits: ['Links do Canvas abrem só na web, e qualquer pessoa com o link pode ver.'] }\n};\n\n/* ---------- 4. Adaptar conteúdos para diferentes níveis ---------- */\nPLAYBOOK.appTools['adaptar-niveis'] = {\n  chatgpt: { st: 'recomendado', why ostas.' }\n  ],\n  example: {\n    title: 'Notebook \"Formação de professores 2027\"',\n    context: 'Coordenação pedagógica fictícia organiza o material de uma formação anual.',\n    lines: ['Fontes: projeto pedagógico em PDF, planilha de cronograma e dois artigos de referência.', 'Instruções: responder em tópicos, citar a fonte e dizer quando a informação não estiver nas fontes.', 'Uso: \"monte a pauta do encontro de março com base no cronograma\".']\n  },\n  checklist: ['O notebook tem nome e objetivo claros.', 'As fontes são atuais e não se contradizem.', 'As instruções definem formato, tom e quando citar a fonte.', 'Testei com uma tarefa real e conferi as fontes citadas.', 'Não adicionei dados pessoais sem autorização.'],\n  mistakes: [\n    { e: 'Adicionar todas as versões de um mesmo documento.', c: 'Mantenha só a versão atual para evitar respostas contraditórias.' },\n    { e: 'Esperar fontes do Drive com Manter atividade desligado.', c: 'Fontes do Drive e conversas adicionadas exigem Manter atividade ligado.' },\n    { e: 'Apagar o notebook para \"limpar\" e perder as fontes.', c: 'Apagar o notebook apaga fontes e conversas. Prefira remover só o que não serve.' }\n  ],\n  next: ['base-conhecimento', 'docs-extensos', 'skills-gemini'],\n  src: ['G14', 'G15']\n});\nPLAYBOOK.appTools['notebook-gemini'] = {\n  chatgpt: { st: 'equivalente', why: 'No ChatGPT, o recurso equivalente é o projeto, com arquivos, instruções e memória própria.', eq: 'Criar um projeto no ChatGPT', eqApp: 'projeto-chatgpt', src: ['O2'] },\n  claude: { st: 'equivalente', why: 'No Claude, o recurso equivalente é o projeto, com conhecimento, instruções e memória própria.', eq: 'Criar um projeto no Claude', eqApp: 'projeto-claude', src: ['C2'] },\n  gemini: { st: 'recomendado', why: 'Este tutorial é específico do Gemini: o passo a passo acima mostra como criar e usar o notebook.', avail: 'Usuários conectados ao app Gemini, com liberação gradual na web, no celular e no app para Mac.',\n    feat , type: 'comparativo', title: (r.gemini ? 'ChatGPT x Claude x Gemini: ' : 'ChatGPT x Claude: ') + r.title, summary: r.what,\n      cats: ['assistentes', 'pesquisa'], tools: r.gemini ? ['chatgpt', 'claude', 'gemini'] : ['chatgpt', 'claude'], obj: ['analisar'], level: 'iniciante', avail: av, time: '3 min', partial: false, order: 500 + i,\n      f1: r.title, f2: 'comparativo diferença chatgpt claude gemini', f3: '', f4: [r.chatgpt.text, r.chatgpt.limits, r.claude.text, r.claude.limits, r.gemini ? r.gemini.text + ' ' + r.gemini.limits : ''].join(' ')\n    });\n  });\n  items.forEach(it => {\n    it.n1 = pbNorm(it.f1); it.n2 = pbNorm(it.f2); it.n3 = pbNorm(it.f3); it.n4 = pbNorm(it.f4);\n  });\n  return items;\n}\n\nfunction pbSearch(items, q) {\n  const terms = pbNorm(q).split(' ').filter(t => t.length > 1 || /\\d/.test(t));\n  if (!terms.length) return items.map(it => ({ it, score: 0 }));\n  const out = [];\n  items.forEach(it => {\n    let score = 0, ok = true;\n    for (const t of terms) {\n      let s = 0;\n      if (it.n1.indexOf(t) >= 0) s += 6;\n      if (it.n2.indexOf(t) >= 0) s += 4;\n      if (it.n3.indexOf(t) >= 0) s += 2;\n      if (it.n4.indexOf(t) >= 0) s += 1;\n      if (!s) { ok = false; break; }\n      score += s;\n    }\n    if (ok) out.push({ it, score });\n  });\n  out.sort((a, b) => b.score - a.score || a.it.order - b.it.order);\n  return out;\n}\n\nconst PB_FILTER_GROUPS = [\n  { id: 'tool', label: 'Ferramenta', options: [{ id: 'chatgpt', label: 'ChatGPT' }, { id: 'claude', label: 'Claude' }, { id: 'gemini', label: 'Gemini' }, { id: 'todas', label: 'Compatível com as três' }] },\n  { id: 'obj', label: 'Objetivo', options: PLAYBOOK.objectives },\n  { id: 'level', label: 'Nível', options: PLAYBOOK.levels },\n  { id: 'type', label: 'Tipo', options: PLAYBOOK.types },\n  { id: 'avail', label: 'Disponibilidade', options: PLAYBOOK.availability },\n  { id: 'cat', label: 'Categoria', options: PLAYBOOK.categories }\n];\n\nfunction pbMatchOption(it, gid, oid) {\n  if (gid === 'tool') {\n    const g = it.tools.indexOf('chatgpt') >= 0, c = it.tools.indexOf('claude') >= 0, m = it.tools.indexOf('gemini') >= 0;\n    if (oid === 'ambas') return g && c;\n    if (oid === 'todas') return g && c && m;\n    return oid === 'chatgpt' ? g : (oid === 'claude' ? c : m);\n  }\n  if (gid === 'obj') return it.obj.indexOf(oid) >= 0;\n  if (gid === 'level') return it.level === oid;\n  if (gid === 'type') return it.type === oid;\n  if (gid === 'avail') return it.avail === oid;\n  if (gid === 'cat') return it.cats.indexOf(oid) >= 0;\n  return true;\n}\nfunction pbMatchFilters(it, filters, skip) {\n  for (const g of PB_FILTER_GROUPS) {\n    if (g.id === skip) continue;\n    const sel = filters[g.id] || [];\n    if (sel.length && !sel.some(o => pbMatchOption(it, g.id, o))) return false;\n  }\n  return true;\n}\n\nconst PB_CATALOG = pbBuildCatalog();\nconst PB_TYPE_LABEL = { app: 'Tutorial', tpl: 'Prompt', flow: 'Fluxo', guide: 'Guia', ck: 'Checklist', cmp: 'Comparativo' };\nconst PB_EMPTY_FILTERS = { tool: [], obj: [], level: [], type: [], avail: [], cat: [] };\nconst PB_NAV = [\n  { id: 'inicio', label: 'Início' },\n  { id: 'comece', label: 'Comece por aqui' },\n  { id: 'biblioteca', label: 'Biblioteca' },\n  { id: 'fluxos', label: 'Fluxos' },\n  { id: 'prompting', label: 'Prompts' },\n  { id: 'comparativo', label: 'Comparativo' },\n  { id: 'glossario', label: 'Glossário' },\n  { id: 'minha', label: 'Minha biblioteca' }\n];\nconst PB_QUICK = ['plano de aula', 'apresentação', 'proposta comercial', 'imagens', 'pesquisa com fontes', 'projeto', 'reunião', 'planilha', 'chatgpt', 'claude', 'gemini'];\nconst PB_RECOMMENDED = ['app:aula-completa', 'app:pesquisa-fontes', 'app:imagens-ia', 'app:projeto-chatgpt', 'app:projeto-claude', 'app:notebook-gemini', 'flow:fluxo-aula', 'guide:g-quando-usar', 'guide:g-chatgpt-claude'];\n\n/* =========================================================\n   COMPONENTE\n   ========================================================= */\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      view: 'inicio', detail: null, prev: 'inicio', theme: 'light',\n      homeQ: '', libQ: '', filters: JSON.parse(JSON.stringify(PB_EMPTY_FILTERS)), showFilters: false,\n      glossQ: '', glossKind: 'todos', focusTerm: null, focusCmp: null,\n      openGuide: 'g-ia-generativa', openCk: null,\n      favs: {}, checks: {}, storage: 'checking', copied: null, toast: '',\n      orbeKey: 'inicio', orbeStatus: 'idle', orbeT: 0, orbeDur: 0, orbeMuted: false, orbeCaptions: true, orbeNotice: '', orbeExpanded: false, orbeSlotH: 0\n    };\n    this._orbeKey = 'inicio'; this._orbeMute = false;\n  }\n\n  componentDidMount() {\n    let storage = 'off', saved = null;\n    try {\n      const ls = window.localStorage;\n      ls.setItem(PB_STORE_KEY + ':t', '1');\n      ls.removeItem(PB_STORE_KEY + ':t');\n      storage = 'on';\n      const raw = ls.getItem(PB_STORE_KEY);\n      if (raw) saved = JSON.parse(raw);\n    } catch (e) { storage = 'off'; }\n    const next = { storage };\n    if (saved && typeof saved === 'object') {\n      if (saved.favs && typeof saved.favs === 'object') next.favs = saved.favs;\n      if (saved.checks && typeof saved.checks === 'object') next.checks = saved.checks;\n      if (saved.theme === 'dark' || saved.theme === 'light') next.theme = saved.theme;\n    }\n    this.setState(next);\n    this._orbeKey$ = e => { if ((e.key === 'Escape' || e.key === 'Esc') && this.state.orbeExpanded) this.orbeSetExpanded(false); };\n    try { document.addEventListener('keydown', this._orbeKey$); } catch (e) {}\n  }\n\n  componentWillUnmount() { clearTimeout(this._toastT); this.orbeClear(); try { document.removeEventListener('keydown', this._orbeKey$); } catch (e) {} }\n\n  /* ---------- Orbe: apresentação animada com linha do tempo única ---------- */\n  orbeScript(key) { const all = PLAYBOOK.orbe || {}; return all[key === undefined ? this._orbeKey : key] || null;
