tas. Em contas pessoais do ChatGPT, não é possível criar novos GPTs.',\n  level: 'intermediario', time: '45 min', avail: 'gratuito', obj: ['organizar', 'automatizar'],\n  reqs: ['Tabela de serviços, perfil de cliente ideal e cases reais'],\n  kw: ['assistente comercial', 'vendas', 'projeto', 'playbook', 'sdr'],\n  problem: 'A equipe comercial refaz pesquisas, propostas e respostas que poderiam seguir um padrão.',\n  result: 'Um projeto com instruções e materiais que prepara reuniões, rascunha propostas e sugere respostas a objeções.',\n  when: ['Equipes comerciais pequenas.', 'Profissionais autônomos que vendem serviços.'],\n  steps: ['Crie um projeto com tabela de serviços, cases e modelo de proposta.', 'Gere as instruções com o prompt.', 'Teste com um cliente real (sem dados sensíveis).'],\n  prompt: `Escreva instruções para um assistente comercial que vai funcionar dentro de um projeto. Oferta: [descreva]. Cliente ideal: [descreva]. Processo de vendas: [etapas].\nO assistente deve: preparar roteiros de reunião, rascunhar propostas com base no modelo anexado, sugerir respostas a objeções e nunca inventar preços, prazos ou resultados. Deve perguntar quando faltar informação.`,\n  checklist: ['O projeto tem os materiais reais.', 'Há regra contra inventar números.', 'Testei com um caso real.'],\n  next: ['propostas-comerciais', 'roteiros-reunioes', 'respostas-objecoes'],\n  src: ['O9', 'C2', 'O2']\n});\n\nPLAYBOOK.apps.push({\n  id: 'revisor-especializado', n: 27, full: false,\n  title: 'Criar um revisor especializado',\n  summary: 'Monte um revisor com critérios claros para textos, provas, propostas ou materiais da sua área.',\n  cats: ['assistentes', 'documentos', 'educacao'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'As duas resolvem. Guarde o revisor como projeto ou como estilo personalizado.',\n  level: 'intermediario', time: '30 min', avail: 'gratuito', obj: ['revisar'],\n  reqs: ['Critérios de qualidade da sua área', 'Exemplo de material bom'],\n  kw: ['revisão', 'revisor', 'qualidade', 'critérios', 'feedback'],\n  problem: 'Pedir \"revise este texto\" gera correções superficiais e mudanças de estilo que você não queria.',\n  result: 'Um revisor que avalia por critérios, aponta problemas com trecho e sugestão, e respeita o seu estilo.',\n  when: ['Revisão de provas e materiais didáticos.', 'Propostas e relatórios antes do envio.'],\n  steps: ['Escreva seus critérios de qualidade.', 'Use o prompt para criar as instruções do revisor.', 'Teste com um material que você já sabe que tem problemas.'],\n  prompt: `Escreva instruções para um revisor especializado em [tipo de material] da área de [área].\nCritérios: [liste 5 a 8 critérios]. O revisor deve: dar uma nota por critério, apontar trechos com problema e sugerir correção, separar erros graves de ajustes de estilo, e nunca reescrever o texto inteiro sem pedido.`,\n  checklist: ['Os critérios estão escritos.', 'O revisor aponta trechos específicos.', 'Testei com material conhecido.'],\n  next: ['exercicios-avaliacoes', 'instrucoes-personalizadas', 'emails'],\n  src: ['C12']\n});\n\nPLAYBOOK.apps.push({\n  id: 'analisar-planilhas', n: 28, full: false,\n  title: 'Analisar planilhas e indicadores',\n  summary: 'Envie uma planilha e obtenha leitura dos indicadores, tendências, gráficos e perguntas para investigar.',\n  cats: ['pesquisa', 'gestao'], tools: ['claude', 'chatgpt'], rec: 'ambas', alt: null,\n  recNote: 'No Claude, enviar XLSX exige \"Criar e editar arquivos\" ativado, e o resultado pode virar uma planilha ou gráfico. No ChatGPT, planilhas têm limite de cerca de 50 MB.',\n  level: 'intermediario', time: '20 a 40 min', avail: 'depende', obj: ['analisar'],\n  reqs: ['Planilha com cabeçalhos claros', 'Pergunta de negócio'],\n  kw: ['planilha', 'excel', 'dados', 'indicadores', 'gráfico', 'kpi', 'csv'],\n  problem: 'Planilhas cheias de números não respondem sozinhas à pergunta que importa.',\n  result: 'Uma análise com principais achados, gráficos, anomalias, limitações dos dados e próximas perguntas.',\n  when: ['Notas de turmas.', 'Resultados de vendas ou campanhas.', 'Indicadores mensais de gestão.'],\n  steps: ['Remova dados pessoais desnecessários e confira os cabeçalhos.', 'Anexe a planilha e use o prompt.', 'Confira os cálculos principais na própria planilha.'],\n  prompt: `Atue como analista de dados. Anexei uma planilha com [descrição das colunas]. Pergunta principal: [pergunta].\nAntes de analisar, descreva os dados e aponte problemas (vazios, duplicados, formatos). Depois: 5 achados com números, 2 gráficos úteis, anomalias, limitações e 3 perguntas para investigar. Mostre como calculou cada número.`,\n  checklist: ['Dados pessoais foram removidos.', 'Conferi os principais cálculos.', 'As limitações dos dados foram registradas.'],\n  next: ['pesquisa-fontes', 'docs-extensos', 'fluxo-multietapas'],\n  src: ['C5', 'C8', 'O4']\n});\n\nPLAYBOOK.apps.push({\n  id: 'fluxo-multietapas', n: 30, full: false,\n  title: 'Criar um fluxo de trabalho com múltiplas etapas',\n  summary: 'Divida uma tarefa grande em etapas encadeadas, com revisão humana, e veja o que pode ser agendado.',\n  cats: ['automacao', 'gestao'], tools: ['chatgpt', 'claude'], rec: 'ambas', alt: null,\n  recNote: 'Etapas guiadas funcionam em qualquer plano. Execução agendada exige plano pago: tarefas agendadas no ChatGPT e no Claude, e Cowork no Claude.',\n  level: 'avancado', time: '45 a 90 min', avail: 'depende', obj: ['automatizar', 'planejar'],\n  reqs: ['Processo que se repete', 'Clareza sobre onde a revisão humana é obrigatória'],\n  kw: ['fluxo', 'workflow', 'automação', 'etapas', 'prompt chaining', 'tarefas agendadas'],\n  problem: 'Pedir uma tarefa grande em um único prompt gera resultado raso e difícil de revisar.',\n  result: 'Um fluxo documentado com etapas, prompts de cada etapa, pontos de revisão humana e indicação do que é manual ou agendável.',\n  when: ['Relatórios recorrentes.', 'Produção de conteúdo em série.', 'Processos semanais.'],\n  steps: ['Descreva o processo atual do início ao fim.', 'Use o prompt para dividir em etapas.', 'Rode manualmente algumas vezes antes de agendar qualquer parte.'],\n  prompt: `Atue como especialista em processos com IA. Meu processo: [descreva do início ao fim, com entradas e saídas].\nDivida em 4 a 7 etapas. Para cada uma: objetivo, entrada, prompt sugerido, saída esperada, se exige revisão humana e se pode ser agendada (marque \"manual\" ou \"agendável em plano pago\").\nTermine com os riscos do fluxo e como monitorar.`,\n  checklist: ['Cada etapa tem entrada e saída.', 'Há revisão humana antes de qualquer envio externo.', 'Rodei o fluxo manualmente antes de agendar.'],\n  next: ['resumir-reunioes', 'checklists-procedimentos', 'analisar-planilhas'],\n  src: ['O11', 'C13', 'C9']\n});\n\n/* =========================================================\n   GUIA DE PROMPTING\n   ========================================================= */\nPLAYBOOK.prompting = {\n  intro: 'Prompt é a instrução que você escreve para a IA. Não existe palavra mágica universal: o que melhora a resposta é deixar claro o que você quer, para quem, com quais referências e em qual formato. Os princípios abaixo funcionam no ChatGPT e no Claude.',\n  principles: [\n    { id: 'p-objetivo', title: 'Clareza de objetivo', text: 'Diga o que você quer e qual resultado espera. Imagine que está pedindo a uma pessoa competente que não conhece o seu contexto.', bad: 'Fale sobre fotossíntese.', good: 'Explique fotossíntese para alunos de 12 anos em até 150 palavras, com uma analogia do dia a dia, para eu ler no início da aula.' },\n    { id: 'p-contexto', title: 'Contextualização', text: 'Explique a situação e o motivo do pedido. Quando a IA entende o porquê, ela toma decisões melhores nos detalhes que você não especificou.', bad: 'Escreva um e-mail para os pais.', good: 'Escreva um e-mail para os pais do 3º ano avisando que a saída pedagógica mudou de data por causa da chuva. Muitos pais já organizaram transporte, então o tom deve ser de desculpas e com a nova data em destaque.' },\n    { id: 'p-publico', title: 'Definição de público', text: 'Diga quem vai ler ou usar o resultado: idade, conhecimento prévio, cargo, expectativas.', bad: 'Resuma este relatório.', good: 'Resuma este relatório para a diretora, que tem 3 minutos e quer saber apenas riscos e decisões necessárias.' },\n    { id: 'p-referencias', title: 'Fornecimento de referências', text: 'Anexe ou cole materiais: ementa, modelo, texto base, manual de marca. Peça que a IA priorize essas referências.', bad: 'Crie uma prova de História.', good: 'Crie uma prova com base no capítulo anexado e siga o formato da prova modelo, também anexada.' },\n    { id: 'p-escopo', title: 'Delimitação de escopo', text: 'Diga o que entra e o que não entra. Limite tamanho, número de itens e assunto.', bad: 'Dê ideias de atividades.', good: 'Dê 5 ideias de atividades de 15 minutos, sem uso de celular, para revisar frações com o 6º ano.' },\n    { id: 'p-exemplos', title: 'Exemplos de entrada e saída', text: 'Mostrar um ou mais exemplos do que você quer é uma das formas mais confiáveis de controlar formato e tom. Varie os exemplos para a IA não copiar um padrão por engano.', bad: 'Escreva legendas para as fotos do evento.', good: 'Escreva legendas no mesmo estilo destes exemplos: \"Turma do 7º B apresentando o projeto de horta. Colheita marcada para outubro.\" e \"Feira do livro: 230 títulos trocados em uma manhã.\"' },\n    { id: 'p-formato', title: 'Definição de formato', text: 'Diga como quer a resposta: tabela, tópicos, texto corrido, número de linhas, colunas. Prefira dizer o que fazer em vez de só o que evitar.', bad: 'Compare as duas propostas.', good: 'Compare as duas propostas em uma tabela com as colunas: critério, proposta A, proposta B, observação. Depois, escreva uma recomendação em 3 linhas.' },\n    { id: 'p-iteracao', title: 'Refinamento iterativo', text: 'O primeiro resultado é um rascunho. Peça ajustes específicos, um aspecto por vez, em vez de recomeçar do zero.', bad: 'Não gostei, faça outro.', good: 'Mantenha a estrutura, mas troque os exemplos por situações de escola pública e reduza o texto do segundo bloco pela metade.' },\n    { id: 'p-criterios', title: 'Critérios de avaliação', text: 'Diga como você vai julgar a resposta. A IA pode revisar o próprio rascunho contra esses critérios antes de entregar.', bad: 'Faça um bom plano de aula.', good: 'O plano será avaliado por: objetivos observáveis, tempos que somam 50 minutos e pelo menos uma atividade prática. Revise contra esses critérios antes de responder.' },\n    { id: 'p-fontes', title: 'Solicitação de fontes', text: 'Com a pesquisa na web ativada, peça links e datas para cada afirmação importante. Em documentos longos, peça para citar o trecho antes de responder.', bad: 'Quais são os dados sobre evasão escolar?', good: 'Pesquise dados de evasão escolar no Brasil dos últimos 3 anos em fontes oficiais. Para cada número, informe fonte, link e data de publicação.' },\n    { id: 'p-incerteza', title: 'Tratamento de incertezas', text: 'Peça que a IA diga quando não tem certeza e que separe fato, estimativa e opinião. Isso reduz respostas confiantes e erradas.', bad: 'Qual é a regra atual sobre isso?', good: 'Diga qual é a regra atual e indique seu nível de certeza. Se a informação puder ter mudado, avise e sugira onde conferir.' },\n    { id: 'p-ausentes', title: 'Identificação de informações ausentes', text: 'Termine pedidos importantes com uma instrução para a IA perguntar o que estiver faltando antes de começar.', bad: 'Monte a proposta.', good: 'Antes de montar a proposta, faça até 3 perguntas sobre informações essenciais que estiverem faltando.' }\n  ],\n  templates: [\n    { id: 't-planejamento', title: 'Planejamento', cats: ['gestao', 'educacao'], obj: ['planejar'], prompt: `Atue como [especialista em planejamento de ...].\nObjetivo: planejar [o quê] até [prazo].\nContexto: [situação atual, recursos, restrições].\nEntregue: etapas em ordem, responsável, prazo, dependências e riscos, em tabela.\nCritérios: realista para [recursos disponíveis], com folga de 20%.\nAntes de responder, pergunte o que estiver faltando.` },\n    { id: 't-escrita', title: 'Escrita', cats: ['marketing', 'produtividade'], obj: ['criar'], prompt: `Escreva [tipo de texto] sobre [tema] para [público].\nObjetivo do texto: [o que o leitor deve saber ou fazer].\nTom: [ ]. Tamanho: [ ] palavras.\nUse como referência de estilo: [cole um exemplo].\nEvite: [clichês, jargões, termos específicos].\nEntregue duas versões com abordagens diferentes.` },\n    { id: 't-pesquisa', title: 'Pesquisa', cats: ['pesquisa'], obj: ['pesquisar'], prompt: `Pesquise [pergunta específica].\nFontes preferidas: [oficiais, acadêmicas, documentação]. Período: [ ].\nPara cada achado: afirmação, fonte com link, data e nível de confiança.\nListe divergências entre fontes e o que não foi possível confirmar.\nNão afirme nada sem fonte.` },\n    { id: 't-analise', title: 'Análise', cats: ['pesquisa', 'gestao'], obj: ['analisar'], prompt: `Analise [documento, planilha ou situação anexada] para responder: [pergunta].\nPrimeiro descreva o material e aponte limitações.\nDepois: principais achados com evidências, causas prováveis, riscos e recomendações.\nMostre o raciocínio e os cálculos usados. Separe fatos de interpretações.` },\n    { id: 't-visual', title: 'Criação visual', cats: ['design', 'marketing'], obj: ['criar'], prompt: `Crie [imagem, infográfico ou layout] para [uso].\nFormato: [proporção ou tamanho]. Estilo: [ ]. Paleta: [cores].\nElementos obrigatórios: [ ].\nTexto exato: \"[ ]\" ou sem texto.\nEvitar: [ ].\nSe algo estiver ambíguo, pergunte antes de gerar.` },\n    { id: 't-revisao', title: 'Revisão', cats: ['documentos', 'educacao'], obj: ['revisar'], prompt: `Revise o texto abaixo como [revisor especialista em ...].\nCritérios: [clareza, correção, adequação ao público, consistência].\nPara cada problema: trecho, problema, gravidade (alta, média, baixa) e sugestão.\nNão reescreva o texto inteiro. Preserve meu estilo.\nTexto: [cole aqui]` },\n    { id: 't-comparacao', title: 'Comparação', cats: ['pesquisa', 'gestao'], obj: ['analisar'], prompt: `Compare [opção A] e [opção B] para [objetivo].\nCritérios: [liste com peso de 1 a 3].\nEntregue uma tabela por critério, os pontos fortes e fracos de cada uma e uma recomendação contextual explicando em que situação cada opção é melhor.\nIndique o que precisa ser confirmado em fonte oficial.` },\n    { id: 't-organizacao', title: 'Organização', cats: ['produtividade', 'gestao'], obj: ['organizar'], prompt: `Organize as informações abaixo em [formato: tabela, lista por categoria, cronograma].\nAgrupe por [critério]. Elimine duplicações e aponte itens contraditórios.\nAo final, liste o que está faltando para a organização ficar completa.\nInformações: [cole aqui]` },\n    { id: 't-extracao', title: 'Extração de informações', cats: ['documentos', 'pesquisa'], obj: ['analisar', 'organizar'], prompt: `Extraia do documento anexado as seguintes informações: [liste campos, ex.: datas, valores, responsáveis, obrigações].\nFormato: tabela com uma coluna por campo e a página de origem.\nSe um campo não aparecer, escreva \"não encontrado\". Não deduza informações que não estão escritas.` }\n  ]\n};\n\n/* =========================================================\n   FLUXOS INTELIGENTES\n   mode: 'manual' (guiado por você) | 'agendavel' (pode rodar\n   sozinho em plano pago) | 'misto'\n   ========================================================= */\nPLAYBOOK.flows = [\n  {\n    id: 'fluxo-aula', title: 'Aula completa',\n    summary: 'Do tema à aula revisada: pesquisa, objetivos, plano, apresentação e atividades em sequência.',\n    cats: ['educacao'], tools: ['chatgpt', 'claude'], level: 'intermediario', time: '2 a 3 h', avail: 'gratuito', obj: ['planejar', 'criar'],\n    kw: ['aula', 'professor', 'plano', 'slides', 'atividades'],\n    mode: 'manual', modeNote: 'Processo guiado manualmente. Cada etapa depende da sua revisão antes da próxima.',\n    goal: 'Preparar uma aula completa e coerente, com todos os materiais alinhados aos mesmos objetivos.',\n    inputs: ['Tema e turma', 'Duração', 'Ementa ou referência curricular', 'Recursos da sala'],\n    steps: [\n      { name: 'Tema', tool: 'Ambas', text: 'Delimite o recorte do tema e o que os alunos já sabem.', prompt: 'Ajude a delimitar uma aula de [duração] sobre [tema] para [turma]. Sugira 3 recortes possíveis e o conhecimento prévio necessário para cada um.', review: false },\n      { name: 'Pesquisa', tool: 'Ambas, com busca na web', text: 'Levante conteúdo atualizado e confiável sobre o recorte.', prompt: 'Pesquise [recorte] em fontes confiáveis e recentes. Para cada informação, traga fonte e data.', review: true },\n      { name: 'Objetivos de aprendizagem', tool: 'Ambas', text: 'Defina de 2 a 4 objetivos com verbos observáveis.', prompt: 'Com base na pesquisa, proponha objetivos de aprendizagem com verbos observáveis e como verificar cada um.', review: true },\n      { name: 'Plano de aula', tool: 'Ambas', text: 'Monte o roteiro com tempos, atividades e avaliação.', prompt: 'Use o prompt do tutorial \"Planejar uma aula completa\" com os objetivos aprovados.', review: true, link: 'aula-completa' },\n      { name: 'Apresentação', tool: 'Claude (Slides) ou ChatGPT (Work)', text: 'Transforme o plano em slides com notas do professor.', prompt: 'Use o prompt do tutorial \"Criar uma apresentação didática\" com o plano aprovado.', review: true, link: 'apresentacao-didatica' },\n      { name: 'Atividades', tool: 'Ambas', text: 'Crie exercícios e a avaliação de saída.', prompt: 'Use o prompt do tutorial \"Elaborar exercícios e avaliações\" com os mesmos objetivos.', review: true, link: 'exercicios-avaliacoes' },\n      { name: 'Revisão', tool: 'Ambas', text: 'Confira o alinhamento entre objetivos, slides e atividades.', prompt: 'Revise o plano, os slides e as atividades. Aponte qualquer objetivo sem atividade ou sem avaliação e qualquer conteúdo que precise de conferência.', review: true }\n    ],\n    deliverable: 'Plano de aula, apresentação exportada e lista de atividades com gabarito, todos alinhados aos mesmos objetivos.'\n  },\n  {\n    id: 'fluxo-visual', title: 'Material visual',\n    summary: 'Do briefing à exportação de um material visual, com referências, direção e rodadas de refinamento.',\n    cats: ['design', 'marketing'], tools: ['chatgpt', 'claude'], level: 'intermediario', time: '1 a 2 h', avail: 'gratuito', obj: ['criar'],\n    kw: ['design', 'imagem', 'briefing', 'arte', 'peça'],\n    mode: 'manual', modeNote: 'Processo guiado manualmente. A aprovação visual é sempre humana.',\n    goal: 'Produzir um material visual consistente com a identidade, sem retrabalho por briefing vago.',\n    inputs: ['Objetivo e uso da peça', 'Identidade visual', 'Referências', 'Textos aprovados'],\n    steps: [\n      { name: 'Briefing', tool: 'Claude ou ChatGPT', text: 'Organize objetivo, público, formato e mensagem.', prompt: 'Transforme estas informações em um briefing visual com objetivo, público, formato, mensagem principal, textos obrigatórios e restrições: [informações].', review: true },\n      { name: 'Referências', tool: 'Você', text: 'Separe 3 a 5 referências e diga o que aproveitar de cada uma.', prompt: 'Analise estas referências e descreva composição, paleta, tipografia e clima de cada uma: [anexe as imagens].', review: false },\n      { name: 'Direção visual', tool: 'Claude ou ChatGPT', text: 'Defina estilo, paleta, tipografia e composição.', prompt: 'Com base no briefing e nas referências, proponha 2 direções visuais diferentes, cada uma com estilo, paleta em hexadecimal, tipografia e composição.', review: true },\n      { name: 'Geração', tool: 'ChatGPT (imagens) ou Claude (Design)', text: 'Gere a primeira versão com a direção aprovada.', prompt: 'Use o prompt do tutorial \"Criar imagens com IA\" ou \"Criar infográficos\" com a direção aprovada.', review: false, link: 'imagens-ia' },\n      { name: 'Refinamento', tool: 'A mesma da geração', text: 'Corrija um aspecto por rodada.', prompt: 'Mantenha tudo e altere apenas [elemento].', review: true },\n      { name: 'Revisão', tool: 'Você', text: 'Confira textos, marca, direitos de uso e legibilidade.', prompt: 'Revise a peça contra o briefing e aponte o que não está atendido.', review: true },\n      { name: 'Exportação', tool: 'Ferramenta usada', text: 'Exporte no formato e tamanho do uso final.', prompt: 'Liste os formatos e tamanhos necessários para [canais] e confira se a peça atende a cada um.', review: false }\n    ],\n    deliverable: 'Peça visual aprovada, exportada nos formatos necessários, com briefing e direção registrados para reutilizar.'\n  },\n  {\n    id: 'fluxo-proposta', title: 'Proposta comercial',\n    summary: 'Das informações do cliente à apresentação da proposta, com diagnóstico, escopo e revisão.',\n    cats: ['comercial', 'documentos'], tools: ['chatgpt', 'claude'], level: 'intermediario', time: '1 a 2 h', avail: 'gratuito', obj: ['criar', 'revisar'],\n    kw: ['proposta', 'vendas', 'cliente', 'diagnóstico', 'escopo'],\n    mode: 'manual', modeNote: 'Processo guiado manualmente. Valores, prazos e o envio ao cliente são decisões humanas.',\n    goal: 'Transformar uma reunião de diagnóstico em uma proposta personalizada e apresentável.',\n    inputs: ['Anotações da reunião', 'Tabela de serviços e condições', 'Cases reais'],\n    steps: [\n      { name: 'Informações do cliente', tool: 'Ambas', text: 'Organize anotações e informações públicas do cliente.', prompt: 'Organize estas anotações em: contexto do cliente, dores, objetivos, restrições, decisores e prazos. Marque o que falta: [anotações].', review: true },\n      { name: 'Diagnóstico', tool: 'Ambas', text: 'Descreva o problema central e suas consequências.', prompt: 'Com base nas informações organizadas, escreva o diagnóstico em 5 linhas usando as palavras do cliente.', review: true },\n      { name: 'Escopo', tool: 'Ambas', text: 'Defina o que entra e o que não entra.', prompt: 'Proponha um escopo com entregáveis, o que não está incluído e premissas, usando apenas os serviços desta tabela: [tabela].', review: true },\n      { name: 'Proposta', tool: 'Ambas; Claude para arquivo Word ou PDF', text: 'Monte a proposta completa.', prompt: 'Use o prompt do tutorial \"Elaborar propostas comerciais\".', review: true, link: 'propostas-comerciais' },\n      { name: 'Revisão', tool: 'Ambas', text: 'Revise clareza, números e objeções.', prompt: 'Revise a proposta como se fosse o decisor do cliente. Aponte dúvidas, riscos percebidos e números que precisam de conferência.', review: true },\n      { name: 'Apresentação', tool: 'Claude (Slides) ou ChatGPT (Work)', text: 'Prepare a apresentação da proposta.', prompt: 'Transforme a proposta em uma apresentação de 8 slides para uma reunião de 20 minutos.', review: true, link: 'apresentacoes-servicos' }\n    ],\n    deliverable: 'Proposta revisada em documento e apresentação para a reunião de fechamento.'\n  },\n  {\n    id: 'fluxo-reunioes', title: 'Gestão de reuniões',\n    summary: 'Das anotações ou transcrição autorizada ao acompanhamento das tarefas definidas.',\n    cats: ['gestao', 'produtividade', 'automacao'], tools: ['chatgpt', 'claude'], level: 'iniciante', time: '20 a 30 min por reunião', avail: 'depende', obj: ['organizar', 'automatizar'],\n    kw: ['reunião', 'ata', 'tarefas', 'acompanhamento', 'transcrição'],\n    mode: 'misto', modeNote: 'Resumo e ata são guiados manualmente. O lembrete de acompanhamento pode ser uma tarefa agendada nos planos pagos (ChatGPT e Claude).',\n    goal: 'Garantir que toda reunião termine com decisões registradas e tarefas acompanhadas.',\n    inputs: ['Anotações ou transcrição com autorização dos participantes', 'Lista de participantes'],\n    steps: [\n      { name: 'Anotações ou transcrição autorizada', tool: 'Você', text: 'Reúna o material e confirme a autorização para usar a transcrição.', prompt: '', review: true },\n      { name: 'Resumo', tool: 'Ambas', text: 'Gere o resumo objetivo.', prompt: 'Use o prompt do guia \"Resumir reuniões e extrair decisões\".', review: false, link: 'resumir-reunioes' },\n      { name: 'Decisões', tool: 'Ambas', text: 'Separe o que foi decidido do que foi apenas discutido.', prompt: 'Liste somente as decisões tomadas, com quem decidiu. Não inclua discussões sem conclusão.', review: true },\n      { name: 'Responsáveis', tool: 'Ambas', text: 'Associe cada tarefa a uma pessoa.', prompt: 'Monte a tabela de tarefas com responsável. Onde não estiver claro, escreva \"a definir\".', review: true },\n      { name: 'Prazos', tool: 'Ambas', text: 'Defina prazos realistas.', prompt: 'Sugira prazos para as tarefas sem data, considerando dependências entre elas.', review: true },\n      { name: 'Acompanhamento', tool: 'Tarefas agendadas (planos pagos)', text: 'Programe um lembrete ou revisão periódica.', prompt: 'Crie uma tarefa agendada para toda [sexta às 9h] que me lembre das tarefas abertas desta reunião e pergunte o status de cada uma.', review: false, auto: true }\n    ],\n    deliverable: 'Ata com decisões, tabela de tarefas com responsáveis e prazos, e rotina de acompanhamento.'\n  },\n  {\n    id: 'fluxo-assistente', title: 'Assistente especializado',\n    summary: 'Do objetivo ao uso recorrente: instruções, documentos, testes e ajustes de um assistente em projeto.',\n    cats: ['assistentes', 'automacao'], tools: ['chatgpt', 'claude'], level: 'avancado', time: '1 a 2 h', avail: 'gratuito', obj: ['organizar', 'automatizar'],\n    kw: ['assistente', 'projeto', 'instruções', 'gpt', 'agente'],\n    mode: 'misto', modeNote: 'Configuração e testes são manuais. O uso recorrente pode incluir tarefas agendadas nos planos pagos.',\n    goal: 'Criar um assistente confiável para uma tarefa recorrente, testado com casos reais.',\n    inputs: ['Tarefa recorrente bem definida', 'Documentos de referência', 'Exemplos de bons resultados'],\n    steps: [\n      { name: 'Objetivo', tool: 'Você', text: 'Descreva a tarefa, o público e o que é um bom resultado.', prompt: 'Me ajude a definir o escopo de um assistente para [tarefa]: o que ele faz, o que não faz e como medir se o resultado é bom.', review: true },\n      { name: 'Instruções', tool: 'Ambas', text: 'Escreva as instruções do projeto.', prompt: 'Use o prompt do tutorial \"Criar instruções personalizadas\" ou \"Criar um assistente para planejamento de aulas\".', review: true, link: 'assistente-aulas' },\n      { name: 'Documentos', tool: 'Projeto no ChatGPT ou no Claude', text: 'Anexe só documentos atuais e necessários.', prompt: 'Revise esta lista de documentos e diga quais são redundantes ou contraditórios: [lista].', review: true },\n      { name: 'Testes', tool: 'Projeto', text: 'Rode de 3 a 5 casos reais e compare com bons exemplos.', prompt: 'Execute [caso de teste]. Depois, diga quais instruções você seguiu e onde teve dúvida.', review: true },\n      { name: 'Ajustes', tool: 'Ambas', text: 'Corrija as instruções a partir dos testes.', prompt: 'Nos testes, o assistente errou em [pontos]. Proponha mudanças nas instruções para corrigir.', review: true },\n      { name: 'Utilização recorrente', tool: 'Projeto; tarefas agendadas em plano pago', text: 'Use sempre dentro do projeto e revise mensalmente.', prompt: 'Crie uma tarefa agendada mensal que me lembre de revisar os documentos e as instruções do assistente.', review: false, auto: true }\n    ],\n    deliverable: 'Projeto configurado como assistente, com instruções testadas, documentos curados e rotina de revisão.'\n  }\n];\n\n/* =========================================================\n   GLOSSÁRIO DE IA\n   kind: 'conceito' | 'formato' | 'produto'\n   ========================================================= */\nPLAYBOOK.glossary = [\n  { id: 'ia', term: 'IA', kind: 'conceito', meaning: 'Inteligência artificial é o campo que cria sistemas capazes de realizar tarefas que normalmente exigiriam inteligência humana, como reconhecer padrões, tomar decisões ou produzir linguagem.', use: 'Nomeia de forma ampla tecnologias que vão de filtros de spam a assistentes conversacionais.', example: 'O corretor do celular que sugere a próxima palavra usa IA.', rel: ['ia-generativa', 'llm', 'modelo'] },\n  { id: 'ia-generativa', term: 'IA generativa', kind: 'conceito', meaning: 'Tipo de IA que cria conteúdo novo, como textos, imagens, áudios e códigos, a partir de padrões aprendidos com muitos exemplos.', use: 'Produzir rascunhos, resumos, imagens e materiais a partir de um pedido em linguagem natural.', example: 'Pedir ao ChatGPT um plano de aula ou uma ilustração para a capa de uma apostila.', rel: ['ia', 'llm', 'multimodalidade', 'alucinacao'] },\n  { id: 'llm', term: 'LLM', kind: 'conceito', meaning: 'Large Language Model, ou modelo de linguagem de grande escala. É um modelo treinado com enorme volume de texto para prever e gerar linguagem.', use: 'É o motor por trás de assistentes como ChatGPT e Claude.', example: 'Quando você faz uma pergunta, o LLM gera a resposta palavra por palavra.', rel: ['modelo', 'token', 'janela-contexto'] },\n  { id: 'modelo', term: 'Modelo', kind: 'conceito', meaning: 'O sistema treinado que gera as respostas. Cada produto pode oferecer vários modelos, com diferenças de velocidade, custo e capacidade.', use: 'Escolher um modelo mais rápido para tarefas simples ou mais capaz para raciocínios longos.', example: 'Trocar o modelo no seletor da conversa para resolver um problema complexo.', rel: ['llm', 'fine-tuning', 'temperatura'] },\n  { id: 'prompt', term: 'Prompt', kind: 'conceito', meaning: 'A instrução ou pergunta que você escreve para a IA. Inclui o pedido, o contexto, as referências e o formato desejado.', use: 'Direcionar o que a IA vai produzir.', example: '\"Resuma este texto em 5 tópicos para alunos do 9º ano.\"', rel: ['prompt-engineering', 'contexto', 'few-shot', 'zero-shot'] },\n  { id: 'prompt-engineering', term: 'Prompt engineering', kind: 'conceito', meaning: 'Prática de escrever e testar prompts de forma estruturada para obter respostas mais úteis e consistentes.', use: 'Criar comandos reutilizáveis para tarefas recorrentes.', example: 'Testar três versões de um prompt de prova e guardar a que gerou questões melhores.', rel: ['prompt', 'prompt-chaining', 'output-estruturado'] },\n  { id: 'contexto', term: 'Contexto', kind: 'conceito', meaning: 'Todas as informações que a IA tem diante dela no momento: mensagens, arquivos, instruções e histórico da conversa.', use: 'Quanto mais relevante o contexto, mais precisa a resposta.', example: 'Anexar a ementa antes de pedir um plano de aula.', rel: ['janela-contexto', 'memoria', 'grounding'] },\n  { id: 'janela-contexto', term: 'Janela de contexto', kind: 'conceito', meaning: 'O limite de quanto conteúdo o modelo consegue considerar de uma vez, medido em tokens. Quando o limite é atingido, partes antigas podem deixar de ser consideradas.', use: 'Entender por que conversas muito longas ou arquivos enormes perdem precisão.', example: 'Abrir uma conversa nova no projeto em vez de continuar um chat com centenas de mensagens.', rel: ['token', 'contexto', 'rag'] },\n  { id: 'token', term: 'Token', kind: 'conceito', meaning: 'Pedaço de texto que o modelo processa: pode ser uma palavra, parte de uma palavra ou um sinal de pontuação.', use: 'Limites de uso e de tamanho de arquivo costumam ser medidos em tokens.', example: 'O ChatGPT aceita arquivos de texto com até 2 milhões de tokens.', rel: ['janela-contexto', 'llm'] },\n  { id: 'instrucoes-personalizadas', term: 'Instruções personalizadas', kind: 'conceito', meaning: 'Orientações fixas que a ferramenta considera em todas as conversas, como quem você é e como prefere as respostas.', use: 'Evitar repetir preferências a cada conversa.', example: '\"Sou professora do ensino médio. Responda em tópicos curtos.\"', rel: ['memoria', 'projeto', 'assistente'] },\n  { id: 'memoria', term: 'Memória', kind: 'conceito', meaning: 'Recurso que permite à ferramenta lembrar informações de conversas anteriores e usá-las nas próximas.', use: 'Personalizar respostas sem repetir contexto.', example: 'A IA lembra que você dá aula para o 6º ano e já adapta a linguagem.', rel: ['contexto', 'instrucoes-personalizadas', 'privacidade'] },\n  { id: 'projeto', term: 'Projeto', kind: 'conceito', meaning: 'Espaço que reúne conversas, arquivos e instruções sobre um mesmo trabalho. ChatGPT e Claude oferecem projetos.', use: 'Organizar trabalhos por tema, cliente ou turma e manter o contexto.', example: 'Um projeto \"Biologia 1º ano\" com ementa e calendário anexados.', rel: ['instrucoes-personalizadas', 'base-conhecimento', 'assistente'] },\n  { id: 'assistente', term: 'Assistente', kind: 'conceito', meaning: 'Configuração da IA voltada a uma tarefa específica, com instruções e materiais próprios.', use: 'Padronizar tarefas recorrentes, como planejar aulas ou revisar propostas.', example: 'Um projeto configurado para gerar planos de aula no formato da escola.', rel: ['agente', 'projeto', 'gpt-personalizado'] },\n  { id: 'agente', term: 'Agente', kind: 'conceito', meaning: 'Sistema de IA que executa várias etapas com alguma autonomia, usando ferramentas como navegador, arquivos e aplicativos para concluir um objetivo.', use: 'Delegar tarefas longas que envolvem pesquisa, ações e entregáveis.', example: 'O modo Work do ChatGPT ou o Cowork do Claude executando uma pesquisa e montando um relatório.', rel: ['assistente', 'automacao', 'workflow', 'mcp'] },\n  { id: 'automacao', term: 'Automação', kind: 'conceito', meaning: 'Execução de uma tarefa sem intervenção manual a cada vez, por gatilho ou agendamento.', use: 'Repetir tarefas recorrentes com menos esforço.', example: 'Uma tarefa agendada que toda segunda gera um resumo das pendências.', rel: ['workflow', 'agente', 'integracao'] },\n  { id: 'workflow', term: 'Workflow', kind: 'conceito', meaning: 'Fluxo de trabalho: sequência de etapas com entradas, saídas e responsáveis para chegar a um resultado.', use: 'Organizar processos que combinam IA e revisão humana.', example: 'Tema, pesquisa, objetivos, plano, slides, atividades e revisão.', rel: ['prompt-chaining', 'automacao', 'agente'] },\n  { id: 'rag', term: 'RAG', kind: 'conceito', meaning: 'Retrieval-Augmented Generation: técnica em que o sistema busca trechos relevantes em uma base de documentos e usa esses trechos para gerar a resposta.', use: 'Responder com base em documentos grandes sem carregar tudo de uma vez.', example: 'Em planos pagos do Claude, projetos grandes ativam o modo RAG automaticamente.', rel: ['base-conhecimento', 'embeddings', 'grounding'] },\n  { id: 'base-conhecimento', term: 'Base de conhecimento', kind: 'conceito', meaning: 'Conjunto organizado de documentos e informações de referência que alimenta um assistente ou projeto.', use: 'Dar à IA informações confiáveis e atualizadas da sua organização.', example: 'Manual do aluno, regimento e calendário anexados a um projeto da secretaria.', rel: ['rag', 'projeto', 'versionamento'] },\n  { id: 'embeddings', term: 'Embeddings', kind: 'conceito', meaning: 'Representações numéricas de textos que capturam significado. Textos com sentido parecido ficam com números parecidos.', use: 'Permitem buscar por significado, e não só por palavra exata, em sistemas de RAG.', example: 'Encontrar \"evasão escolar\" ao buscar \"abandono dos estudos\".', rel: ['rag', 'base-conhecimento'] },\n  { id: 'api', term: 'API', kind: 'conceito', meaning: 'Interface de programação que permite que um sistema converse com outro. Na IA, é a forma de usar modelos dentro de outros softwares.', use: 'Integrar IA a sistemas próprios, sites e automações.', example: 'Um sistema da escola que usa a API de um modelo para corrigir redações.', rel: ['integracao', 'mcp', 'json'] },\n  { id: 'integracao', term: 'Integração', kind: 'conceito', meaning: 'Conexão entre a IA e outros aplicativos, como e-mail, agenda e armazenamento de arquivos.', use: 'Permitir que a IA consulte ou atue em ferramentas que você já usa.', example: 'Conectar o Google Drive para a IA ler um documento sem baixá-lo.', rel: ['api', 'mcp', 'automacao'] },\n  { id: 'mcp', term: 'MCP', kind: 'conceito', meaning: 'Model Context Protocol: padrão aberto que define como assistentes de IA se conectam a ferramentas e fontes de dados externas.', use: 'Conectar a IA a sistemas variados de forma padronizada.', example: 'Um conector que permite ao assistente consultar tarefas de um gerenciador de projetos.', rel: ['integracao', 'api', 'agente'] },\n  { id: 'markdown', term: 'Markdown', kind: 'formato', meaning: 'Formato de texto com marcações simples para indicar títulos, listas, negrito e links. Um # vira título e um * vira item de lista.', use: 'Escrever textos estruturados que a IA entende bem e que podem ser convertidos em documentos.', example: '\"# Plano de aula\" vira um título; \"- objetivo\" vira um item de lista.', rel: ['arquivo-md', 'output-estruturado'] },\n  { id: 'arquivo-md', term: 'Arquivo .md', kind: 'formato', meaning: 'Extensão de arquivo frequentemente usada para guardar conteúdo escrito em Markdown. É um arquivo de texto simples que abre em qualquer editor.', use: 'Guardar prompts, instruções e documentação de forma leve e portátil.', example: 'Salvar as instruções do seu assistente em \"instrucoes-assistente.md\".', rel: ['markdown', 'versionamento'] },\n  { id: 'json', term: 'JSON', kind: 'formato', meaning: 'Formato de dados estruturado em pares de nome e valor, muito usado por sistemas e APIs.', use: 'Pedir respostas estruturadas para usar em planilhas, sistemas ou automações.', example: '{\"aluno\": \"A\", \"nota\": 8.5}', rel: ['output-estruturado', 'api', 'xml'] },\n  { id: 'xml', term: 'XML', kind: 'formato', meaning: 'Formato que organiza informações entre marcações de abertura e fechamento, como <tema> e <\u002Ftema>.', use: 'Em prompts, tags no estilo XML separam instruções, exemplos e documentos para a IA não confundir as partes.', example: '<documento>texto da ementa<\u002Fdocumento> <tarefa>crie 5 questões<\u002Ftarefa>', rel: ['json', 'prompt', 'output-estruturado'] },\n  { id: 'csv', term: 'CSV', kind: 'formato', meaning: 'Arquivo de texto com dados em tabela, separados por vírgula ou ponto e vírgula. Abre em qualquer planilha.', use: 'Trocar dados entre sistemas e pedir análises de planilhas.', example: 'Exportar notas do sistema da escola em CSV e pedir uma análise por turma.', rel: ['json', 'pdf'] },\n  { id: 'pdf', term: 'PDF', kind: 'formato', meaning: 'Formato de documento que preserva o layout em qualquer dispositivo. Pode conter texto selecionável ou apenas imagem escaneada.', use: 'Enviar documentos para análise; prefira PDFs com texto selecionável.', example: 'Anexar o regimento em PDF e pedir as regras de avaliação.', rel: ['csv', 'multimodalidade'] },\n  { id: 'artifact', term: 'Artifact', kind: 'produto', meaning: 'Nome do recurso do Claude para saídas independentes, como documentos, slides, designs e pequenas ferramentas, que abrem ao lado da conversa e ficam salvas. É um nome comercial, não um conceito técnico geral.', use: 'Criar materiais que você vai editar, guardar e compartilhar.', example: 'Uma apresentação criada no modelo Slides e exportada para PowerPoint.', rel: ['output-estruturado', 'versionamento'] },\n  { id: 'gpt-personalizado', term: 'GPT personalizado', kind: 'produto', meaning: 'Nome do recurso do ChatGPT para versões configuradas com instruções, conhecimento e ferramentas. Contas pessoais não criam mais novos GPTs, e a OpenAI planeja migrá-los para Plugins.', use: 'Em workspaces Business, Enterprise e Edu, criar assistentes compartilháveis.', example: 'Um GPT de atendimento usado por toda a secretaria de uma universidade.', rel: ['assistente', 'projeto'] },\n  { id: 'claude-code', term: 'Claude Code', kind: 'produto', meaning: 'Produto da Anthropic voltado a programação, que lê, escreve e executa código em projetos de software. Disponível em planos pagos.', use: 'Desenvolver e manter sistemas com ajuda de IA.', example: 'Um desenvolvedor pede ao Claude Code para corrigir um erro no site da escola.', rel: ['agente', 'api'] },\n  { id: 'multimodalidade', term: 'Multimodalidade', kind: 'conceito', meaning: 'Capacidade de trabalhar com diferentes tipos de entrada e saída: texto, imagem, áudio, documentos.', use: 'Analisar fotos, gráficos e PDFs, ou conversar por voz.', example: 'Fotografar um exercício no quadro e pedir a explicação passo a passo.', rel: ['ia-generativa', 'pdf'] },\n  { id: 'alucinacao', term: 'Alucinação', kind: 'conceito', meaning: 'Quando a IA apresenta como verdadeira uma informação falsa ou inventada, muitas vezes com tom confiante.', use: 'Lembrar que toda informação importante precisa ser conferida.', example: 'Citar um livro ou uma lei que não existe.', rel: ['grounding', 'temperatura'] },\n  { id: 'fine-tuning', term: 'Fine-tuning', kind: 'conceito', meaning: 'Ajuste fino: treinamento adicional de um modelo com exemplos específicos para mudar seu comportamento em um domínio.', use: 'Usado por empresas com grandes volumes de exemplos. No dia a dia, projetos e instruções resolvem a maioria dos casos.', example: 'Treinar um modelo com milhares de pareceres para adotar o padrão de uma instituição.', rel: ['modelo', 'few-shot', 'instrucoes-personalizadas'] },\n  { id: 'temperatura', term: 'Temperatura', kind: 'conceito', meaning: 'Parâmetro técnico que controla o grau de variação das respostas. Valores baixos geram respostas mais previsíveis; valores altos, mais variadas.', use: 'Ajustável em APIs. Nas interfaces de chat, você influencia a variação pedindo mais criatividade ou mais precisão no prompt.', example: 'Pedir \"10 ideias bem diferentes entre si\" para estimular variedade.', rel: ['modelo', 'alucinacao'] },\n  { id: 'few-shot', term: 'Few-shot prompting', kind: 'conceito', meaning: 'Técnica de incluir alguns exemplos de entrada e saída no prompt para mostrar o padrão desejado.', use: 'Controlar formato e tom com mais precisão.', example: 'Mostrar duas questões no formato da escola antes de pedir dez novas.', rel: ['zero-shot', 'prompt', 'prompt-engineering'] },\n  { id: 'zero-shot', term: 'Zero-shot prompting', kind: 'conceito', meaning: 'Pedir uma tarefa sem dar exemplos, contando só com a instrução.', use: 'Tarefas simples e formatos comuns.', example: '\"Traduza este parágrafo para o inglês.\"', rel: ['few-shot', 'prompt'] },\n  { id: 'prompt-chaining', term: 'Prompt chaining', kind: 'conceito', meaning: 'Dividir uma tarefa em uma sequência de prompts, em que a saída de um vira entrada do próximo.', use: 'Ter controle e revisão em cada etapa de tarefas complexas.', example: 'Primeiro os objetivos, depois o plano, depois os slides.', rel: ['workflow', 'prompt-engineering'] },\n  { id: 'output-estruturado', term: 'Output estruturado', kind: 'conceito', meaning: 'Resposta em formato definido e previsível, como tabela, JSON ou campos fixos.', use: 'Facilitar o uso da resposta em planilhas, sistemas e documentos.', example: 'Pedir uma tabela com as colunas tarefa, responsável e prazo.', rel: ['json', 'markdown', 'xml'] },\n  { id: 'grounding', term: 'Grounding', kind: 'conceito', meaning: 'Ancorar as respostas da IA em fontes concretas, como documentos enviados ou páginas da web, em vez de só no conhecimento do modelo.', use: 'Reduzir alucinações e permitir conferência.', example: 'Pedir para citar o trecho do regimento que sustenta cada resposta.', rel: ['rag', 'alucinacao', 'contexto'] },\n  { id: 'versionamento', term: 'Versionamento', kind: 'conceito', meaning: 'Registro organizado das versões de um arquivo, prompt ou instrução, com data e o que mudou.', use: 'Saber qual versão de um prompt ou documento funciona melhor e voltar atrás se preciso.', example: '\"instrucoes-assistente-v3-2026-11-19.md\" com nota do que mudou.', rel: ['arquivo-md', 'base-conhecimento'] },\n  { id: 'privacidade', term: 'Privacidade de dados', kind: 'conceito', meaning: 'Cuidado com as informações pessoais e confidenciais que você envia para a IA e com o uso que a empresa faz delas.', use: 'Decidir o que enviar, configurar o uso dos dados e cumprir a legislação, como a LGPD.', example: 'Trocar o nome dos alunos por códigos antes de pedir uma análise de notas.', rel: ['memoria', 'integracao'] }\n];\n\n/* =========================================================\n   EXPANSÃO GEMINI (camada incremental)\n   Este arquivo e os seguintes só ACRESCENTAM dados. Nenhum\n   conteúdo de ChatGPT ou Claude é removido ou reescrito.\n   ========================================================= */\nPLAYBOOK.tools.gemini = { id: 'gemini', label: 'Gemini', maker: 'Google' };\nPLAYBOOK.meta.geminiVerifiedAt = '19/11/2026';\n\nObject.assign(PLAYBOOK.sources, {\n  G1: { tool: 'gemini', title: 'Limites e upgrades do Gemini para assinantes Google AI', url: 'https://support.google.com/gemini/answer/16275805' },\n  G2: { tool: 'gemini', title: 'Planos do Gemini', url: 'https://gemini.google/plans/' },\n  G3: { tool: 'gemini', title: 'Criar documentos, apps e mais com o Canvas', url: 'https://support.google.com/gemini/answer/16047321' },\n  G4: { tool: 'gemini', title: 'Usar o Deep Research nos apps Gemini', url: 'https://support.google.com/gemini/answer/15719111' },\n  G5: { tool: 'gemini', title: 'Gerar e editar imagens nos apps Gemini', url: 'https://support.google.com/gemini/answer/14286560' },\n  G6: { tool: 'gemini', title: 'Geração de vídeo no Gemini (Gemini Omni)', url: 'https://gemini.google/overview/video-generation/' },\n  G7: { tool: 'gemini', title: 'Enviar e analisar arquivos nos apps Gemini', url: 'https://support.google.com/gemini/answer/14903178' },\n  G8: { tool: 'gemini', title: 'Transição de Gems para skills', url: 'https://support.google.com/gemini/answer/18560919' },\n  G9: { tool: 'gemini', title: 'Conectar o Google Workspace aos apps Gemini', url: 'https://support.google.com/gemini/answer/15229592' },\n  G10: { tool: 'gemini', title: 'Salvar informações e usar conversas anteriores', url: 'https://support.google.com/gemini/answer/16413516' },\n  G11: { tool: 'gemini', title: 'Central de privacidade dos apps Gemini', url: 'https://support.google.com/gemini/answer/13594961' },\n  G12: { tool: 'gemini', title: 'Agendar ações nos apps Gemini', url: 'https://support.google.com/gemini/answer/16316416' },\n  G13: { tool: 'gemini', title: 'Ferramentas de aprendizagem (Guided Learning)', url: 'https://support.google.com/gemini/answer/16448384' },\n  G14: { tool: 'gemini', title: 'Notebooks nos apps Gemini', url: 'https://support.google.com/gemini/answer/16972047' },\n  G15: { tool: 'gemini', title: 'NotebookLM agora é Gemini Notebook (blog oficial)', url: 'https://blog.google/innovation-and-ai/products/gemini-notebook/notebooklm-gemini-notebook/' },\n  G16: { tool: 'gemini', title: 'Primeiros passos com o Google Workspace com Gemini', url: 'https://support.google.com/mail/answer/13952129' },\n  G17: { tool: 'gemini', title: 'Criar documentos com o Gemini no Google Docs', url: 'https://support.google.com/docs/answer/15541879' },\n  G18: { tool: 'gemini', title: 'Construir ou editar planilhas com o Gemini no Sheets', url: 'https://support.google.com/docs/answer/16959434' },\n  G19: { tool: 'gemini', title: 'Colaborar com o Gemini no Google Slides', url: 'https://support.google.com/docs/answer/14355071' },\n  G20: { tool: 'gemini', title: 'Idiomas compatíveis com o Google Workspace com Gemini', url: 'https://support.google.com/docs/answer/14925782' },\n  G21: { tool: 'gemini', title: 'Onde usar o app Gemini na web', url: 'https://support.google.com/gemini/answer/13575153' },\n  G22: { tool: 'gemini', title: 'Google AI Studio e Gemini API (documentação)', url: 'https://ai.google.dev' },\n  G23: { tool: 'gemini', title: 'Usar o Deep Research nos apps do Workspace', url: 'https://support.google.com/docs/answer/17127708' },\n  G24: { tool: 'gemini', title: 'Usar a função AI no Google Sheets', url: 'https://support.google.com/docs/answer/15877199' }\n});\n\n/* ---------- Guia completo do Gemini (Comece por aqui) ---------- */\nPLAYBOOK.guides.push({\n  id: 'g-gemini', title: 'Google Gemini: guia completo',\n  summary: 'O que é o Gemini, como começar, planos Google AI, Canvas, Deep Research, skills, imagens, vídeo, integrações com o Google e cuidados de privacidade.',\n  cats: ['assistentes', 'educacao'], level: 'iniciante', time: '20 min', avail: 'gratuito', tools: ['gemini'], obj: ['pesquisar', 'planejar'],\n  kw: ['gemini', 'google', 'google ai', 'canvas', 'deep research', 'gems', 'skills', 'nano banana', 'omni', 'workspace', 'notebook'],\n  blocks: [\n    { h: '1. O que é o Google Gemini', p: 'Gemini é a assistente de IA do Google. O nome aparece em três lugares diferentes, e vale separar: o app Gemini (gemini.google.com e app móvel), o Gemini dentro dos apps do Google Workspace (Gmail, Docs, Sheets, Slides, Drive) e os modelos Gemini usados por desenvolvedores no Google AI Studio.' },\n    { h: '2. Principais possibilidades', list: ['Conversar, escrever, resumir e revisar textos.', 'Criar documentos, apresentações, quizzes e pequenos apps no Canvas.', 'Fazer pesquisas longas com o Deep Research.', 'Gerar e editar imagens; criar vídeos curtos nos planos pagos.', 'Consultar Gmail, Drive, Docs e Agenda quando o Google Workspace está conectado.', 'Estudar com o Guided Learning, que conduz o raciocínio passo a passo.'] },\n    { h: '3. Como começar', list: ['Acesse gemini.google.com e entre com sua conta Google. Muitos recursos, como Canvas, exigem estar conectado.', 'No celular, instale o app Gemini.', 'Na primeira semana, teste três coisas: uma conversa comum, um documento no Canvas e uma pesquisa com Deep Research.'] },\n    { h: '4. Plano gratuito e planos pagos', p: 'O plano gratuito inclui o app Gemini com geração e edição de imagens, Deep Research, Canvas e outros recursos com limites menores. Os planos pagos aumentam os limites e liberam recursos extras, como geração de vídeo e o Gemini dentro do Gmail, Docs e outros apps do Google.' },\n    { h: '5. Como funcionam os planos Google AI', list: ['Para contas pessoais, os upgrades do Gemini fazem parte de planos pagos do Google One: Google AI Plus, Google AI Pro e Google AI Ultra.', 'Os limites mudam conforme o plano e podem ser ajustados pelo Google; a central de ajuda avisa que eles podem variar.', 'Contas de trabalho ou escola recebem o Gemini pelo plano do Google Workspace da organização, com regras definidas pelo administrador.', 'Preços variam por país. Consulte gemini.google/plans antes de assinar.'] },\n    { h: '6. Gemini no navegador e no celular', list: ['Na web, gemini.google.com tem o conjunto mais completo de recursos. O Google informa disponibilidade em mais de 70 idiomas e mais de 230 países e territórios, incluindo o Brasil.', 'O app móvel existe para Android e iOS. Alguns recursos chegam primeiro à web, e links compartilhados do Canvas só abrem na web.'] },\n    { h: '7. Integrações com o ecossistema Google', list: ['Apps conectados: ao conectar o Google Workspace, o Gemini consulta Gmail, Agenda, Docs, Drive, Keep e Tasks dentro da conversa. Isso exige a configuração Manter atividade ligada.', 'Gemini nos apps do Workspace: o painel \"Pergunte ao Gemini\" no Gmail, Docs, Sheets, Slides e Drive. Em contas pessoais, a maior parte depende de um plano Google AI; alguns recursos do Gmail são gratuitos apenas nos EUA.', 'Contas de trabalho ou escola dependem de liberação do administrador.'] },\n    { h: '8. Personalização e instruções', list: ['Instruções para o Gemini (chamadas de \"Informações salvas\" em algumas versões) guardam preferências que valem em todas as conversas.', 'A memória das conversas anteriores permite que o Gemini use o que você já contou.', 'O caminho fica em Configurações e ajuda, Contexto pessoal (ou Personal Intelligence, conforme a versão).'] },\n    { h: '9. Gems e skills (assistentes personalizados)', p: 'Os Gems foram os assistentes personalizados do Gemini. Em contas pessoais, eles passaram para skills: desde 17/11/2026 os Gems ficaram somente leitura e serão removidos em 17/12/2026, com conversão automática. Skills são instruções reutilizáveis que você chama digitando \"/\" e o nome em qualquer conversa. Contas de trabalho mudam em março de 2027 e de educação em junho de 2027.', link: { view: 'app', id: 'skills-gemini', label: 'Tutorial: criar um assistente com skills no Gemini' } },\n    { h: '10. Arquivos e documentos', list: ['Use \"Adicionar arquivos\" na caixa de mensagem para enviar do computador ou do Drive.', 'O Gemini aceita a maioria dos tipos de arquivo. A central de ajuda indica até 10 arquivos por mensagem, vídeos de até 2 GB e demais arquivos de até 100 MB.', 'Para enviar e analisar arquivos é preciso ter 18 anos ou mais.'] },\n    { h: '11. Pesquisa e análise de informações', p: 'Na conversa comum, o Gemini usa a Pesquisa Google para responder perguntas atuais. Para comparar fontes e montar relatórios, use o Deep Research. Para estudar um conjunto fixo de documentos, use um notebook.' },\n    { h: '12. Deep Research', list: ['Caminho: caixa de texto, Ferramentas, Deep Research.', 'O Gemini monta um plano de pesquisa, você revisa e ele gera um relatório com fontes.', 'Por padrão usa a Pesquisa Google; Gmail e Drive entram como fonte quando o Google Workspace está conectado.', 'Há limites diários. Relatórios antigos só aparecem se Manter atividade estiver ligado.'] },\n    { h: '13. Canvas', list: ['Caminho: Adicionar arquivos, Canvas, e descreva o que quer criar.', 'Cria documentos, apresentações, apps, quizzes e código, com salvamento automático.', 'Exporta para Google Docs e Google Slides; também transforma o conteúdo em Audio Overview, quiz ou infográfico.', 'Disponível para todos os usuários conectados, com modelos mais capazes nos planos pagos. Não disponível para menores de 18 anos.'] },\n    { h: '14. Geração e edição de imagens', list: ['Clique em Criar imagem e descreva a cena. O modelo padrão é o Nano Banana 2; assinantes também usam o Nano Banana Pro.', 'É possível editar imagens geradas, enviar uma foto para alterar ou combinar várias imagens. Editar exige 18 anos ou mais.', 'Os limites diários variam por plano.'] },\n    { h: '15. Recursos de vídeo', p: 'A geração de vídeo no app Gemini usa o Gemini Omni, que substituiu o Veo. Ela cria vídeos curtos com áudio a partir de texto, fotos (até 5) ou vídeos, e permite editar por conversa. Exige 18 anos ou mais e um plano Google AI Plus, Pro ou Ultra; alguns recursos variam por país.' },\n    { h: '16. Organização de conversas e atividades', list: ['Conversas recentes ficam na barra lateral e podem ser fixadas, renomeadas e pesquisadas.', 'Notebooks reúnem conversas, arquivos e instruções de um mesmo projeto e sincronizam com o Gemini Notebook (antigo NotebookLM). Contas de trabalho e escola ainda não têm notebooks no app Gemini.', 'Ações agendadas repetem um pedido em horários definidos (até 10 ativas), nos planos Google AI Pro e Ultra e em planos Workspace elegíveis.'] },\n    { h: '17. Privacidade e segurança', list: ['A configuração Manter atividade (Atividade nos apps Gemini, em myactivity.google.com) define se as conversas ficam salvas e se ajudam a melhorar a IA do Google.', 'Uma amostra das conversas pode ser lida por revisores humanos. Conversas revisadas ficam guardadas por até 3 anos e não são apagadas quando você apaga sua atividade.', 'Para assuntos sensíveis, use conversa temporária e não envie dados pessoais de alunos ou clientes.', 'Com o Workspace conectado, o Google informa que não treina modelos de IA generativa diretamente no seu Gmail, Drive ou Agenda.'] },\n    { h: '18. Boas práticas', list: ['Os mesmos princípios do guia de prompts valem para o Gemini: objetivo, contexto, público, referências e formato.', 'Use a ferramenta certa: conversa para dúvidas, Canvas para produzir, Deep Research para pesquisar, notebook para estudar seus documentos.', 'Mencione o arquivo do Drive pelo nome quando quiser que ele seja usado.', 'Confira fontes e números antes de usar qualquer material em sala ou com clientes.'] }\n  ],\n  src: ['G1', 'G2', 'G21', 'G9', 'G16', 'G10', 'G8', 'G7', 'G4', 'G3', 'G5', 'G6', 'G14', 'G15', 'G12', 'G11', 'G13']\n});\n\n/* ---------- Complementos Gemini nos guias existentes (só acréscimos) ---------- */\nPLAYBOOK.guideAdditions = {\n  'g-chatgpt-claude': [{ h: 'E o Gemini?', p: 'O Google Gemini é a terceira ferramenta desta biblioteca. Ele se destaca pela integração com Gmail, Drive, Docs, Sheets e Slides, pelo Canvas, pelo Deep Research e pela geração de imagens e vídeos.', link: { view: 'guide', id: 'g-gemini', label: 'Abrir o guia completo do Gemini' } }],\n  'g-quando-usar': [{ h: 'Onde o Gemini entra', list: ['Trabalho que já vive no Google (Gmail, Drive, Docs, Sheets, Slides): Gemini, que lê esses arquivos com o Workspace conectado.', 'Imagens: ChatGPT ou Gemini, os dois com geração nativa.', 'Vídeos curtos: Gemini, nos planos Google AI Plus, Pro e Ultra.', 'Estudo guiado passo a passo: Guided Learning do Gemini.'] }],\n  'g-planos': [{ h: 'Gemini', list: ['Planos pessoais: gratuito, Google AI Plus, Google AI Pro e Google AI Ultra, vendidos pelo Google One.', 'O gratuito inclui imagens, Deep Research, Canvas e outros recursos com limites menores.', 'Vídeo e o Gemini dentro dos apps do Google dependem de plano pago.'] }],\n  'g-apps': [{ list: ['Gemini: web em gemini.google.com e app móvel para Android e iOS. Alguns recursos chegam primeiro à web.'] }],\n  'g-configuracoes': [{ h: 'No Gemini', list: ['Configurações e ajuda, Contexto pessoal: adicione instruções para o Gemini.', 'Atividade nos apps Gemini (myactivity.google.com): decida sobre Manter atividade e o prazo de exclusão automática.', 'Apps conectados: conecte o Google Workspace se quiser usar Gmail e Drive nas conversas.'] }],\n  'g-memoria': [{ list: ['Gemini: memória das conversas anteriores e instruções salvas, em Configurações e ajuda, Contexto pessoal. Conversas temporárias não usam sua atividade.'] }],\n  'g-projetos': [{ list: ['Gemini: notebooks reúnem conversas, arquivos e instruções e sincronizam com o Gemini Notebook (antigo NotebookLM). Ainda não disponíveis para contas de trabalho ou escola.'] }],\n  'g-arquivos': [{ list: ['Gemini: até 10 arquivos por mensagem; vídeos até 2 GB e demais arquivos até 100 MB, segundo a central de ajuda. Envio e análise de arquivos exige 18 anos ou mais.'] }],\n  'g-pesquisa': [{ list: ['Gemini: Pesquisa Google na conversa e Deep Research em Ferramentas, com limites diários. Gmail e Drive entram como fonte com o Workspace conectado.'] }],\n  'g-privacidade': [{ h: 'No Gemini', list: ['Atividade nos apps Gemini, em myactivity.google.com: desligue Manter atividade se não quiser que as conversas fiquem salvas e ajudem a melhorar a IA do Google.', 'Conversas lidas por revisores humanos ficam até 3 anos, mesmo se você apagar a atividade. Não envie dados pessoais sensíveis.'] }]\n};\nPLAYBOOK.guideAdditionSources = { 'g-planos': ['G1', 'G2'], 'g-apps': ['G21'], 'g-configuracoes': ['G10', 'G11', 'G9'], 'g-memoria': ['G10'], 'g-projetos': ['G14', 'G15'], 'g-arquivos': ['G7'], 'g-pesquisa': ['G4'], 'g-privacidade': ['G11'], 'g-quando-usar': ['G6', 'G13', 'G9'] };\n\n/* =========================================================\n   EXPANSÃO GEMINI · comparativo (coluna Gemini + novos itens)\n   ========================================================= */\nPLAYBOOK.compareGemini = {\n  'cmp-visao': { has: 'sim', text: 'App Gemini com conversa, Canvas, Deep Research, imagens, vídeo (pago), Guided Learning, skills e notebooks. O Gemini também aparece dentro do Gmail, Docs, Sheets, Slides e Drive.', how: 'Use gemini.google.com ou o app móvel. Dentro dos apps do Google, clique em \"Pergunte ao Gemini\".', limits: 'O Gemini nos apps do Workspace depende de plano Google AI (conta pessoal) ou de plano Workspace elegível (conta de trabalho).', src: ['G2', 'G16'] },\n  'cmp-projetos': { has: 'sim', text: 'Notebooks reúnem conversas, arquivos e instruções de um projeto e sincronizam com o Gemini Notebook (antigo NotebookLM).', how: 'Barra lateral, novo notebook. Adicione fontes e instruções.', limits: 'Notebooks no app Gemini ainda não estão disponíveis para contas de trabalho ou escola. Limites de notebooks e fontes variam por plano.', src: ['G14', 'G15'] },\n  'cmp-memoria': { has: 'sim', text: 'Memória das conversas anteriores e instruções salvas que valem em todas as conversas.', how: 'Configurações e ajuda, Contexto pessoal (ou Personal Intelligence, conforme a versão).', limits: 'Os nomes dos menus mudaram em 2026 e podem variar. Parte da personalização depende de país, idade e plano: pendente de confirmação para o Brasil.', src: ['G10'] },\n  'cmp-arquivos': { has: 'sim', text: 'Aceita a maioria dos tipos de arquivo, do computador ou do Google Drive.', how: 'Adicionar arquivos na caixa de mensagem.', limits: 'Até 10 arquivos por mensagem; vídeos até 2 GB e demais até 100 MB, segundo a central de ajuda. Envio exige 18 anos ou mais. Há limites de uso que se renovam com o tempo.', src: ['G7'] },\n  'cmp-pesquisa': { has: 'sim', text: 'Pesquisa Google na conversa e Deep Research para relatórios com fontes, que podem incluir Gmail e Drive.', how: 'Ferramentas, Deep Research. Revise o plano antes de começar.', limits: 'Limites diários de relatórios. Relatórios antigos só aparecem com Manter atividade ligado.', src: ['G4'] },\n  'cmp-imagens': { has: 'sim', text: 'Gera e edita imagens com o Nano Banana 2; assinantes também usam o Nano Banana Pro. Combina várias imagens em uma nova.', how: 'Clique em Criar imagem e descreva a cena, ou envie uma foto e peça a edição.', limits: 'Editar imagens exige 18 anos ou mais. Limites diários variam por plano.', src: ['G5', 'G1'] },\n  'cmp-documentos': { has: 'sim', text: 'Canvas cria e edita documentos com salvamento automático e exporta para Google Docs. No Docs, o \"Help me create\" gera rascunhos formatados.', how: 'Adicionar arquivos, Canvas. No Docs: barra ou painel do Gemini.', limits: 'O Gemini no Docs para contas pessoais exige Google AI Pro ou Ultra para os recursos mais novos. Canvas não está disponível para menores de 18 anos.', src: ['G3', 'G17'] },\n  'cmp-apresentacoes': { has: 'sim', text: 'Canvas cria apresentações a partir de um tema ou arquivo e exporta para o Google Slides. No Slides, o painel do Gemini gera slides e imagens.', how: 'Canvas: \"crie uma apresentação sobre...\". Slides: Pergunte ao Gemini.', limits: 'O Gemini dentro do Slides depende de plano Google AI ou Workspace elegível.', src: ['G3', 'G19'] },\n  'cmp-artefatos': { has: 'sim', text: 'Canvas cria apps, quizzes, infográficos e páginas interativas que podem ser compartilhados por link.', how: 'Adicionar arquivos, Canvas, e descreva o app ou quiz.', limits: 'Links compartilhados abrem só na web e qualquer pessoa com o link pode ver; em apps, também editar os dados do app.', src: ['G3'] },\n  'cmp-personalizacao': { has: 'sim', text: 'Instruções para o Gemini, memória de conversas e skills reutilizáveis.', how: 'Contexto pessoal para instruções; Personalizar, Skills para criar skills.', limits: 'Skills exigem 18 anos ou mais e conta pessoal; contas de trabalho recebem depois.', src: ['G10', 'G8'] },\n  'cmp-assistentes': { has: 'sim', text: 'Skills substituem os Gems em contas pessoais: instruções reutilizáveis chamadas com \"/\" em qualquer conversa, com arquivos de até 100 MB.', how: 'Barra lateral, Personalizar, Skills, Criar, Criar manualmente.', limits: 'Gems de contas pessoais ficaram somente leitura em 17/11/2026 e saem em 17/12/2026. Skills ainda não funcionam com Canvas, Deep Research, vídeo e Guided Learning.', src: ['G8'] },\n  'cmp-automacao': { has: 'sim', text: 'Ações agendadas repetem pedidos em horários definidos e podem usar apps conectados.', how: 'Peça na conversa (\"todo dia às 8h...\") ou vá em Configurações e ajuda, Ações agendadas.', limits: 'Até 10 ações ativas. Disponível para Google AI Pro e Ultra e planos Workspace elegíveis.', src: ['G12'] },\n  'cmp-apps': { has: 'sim', text: 'Web em gemini.google.com e app móvel para Android e iOS.', how: 'Entre com sua conta Google. No Android, o Gemini pode ser o assistente do celular.', limits: 'Alguns recursos chegam antes na web; links do Canvas não abrem no app móvel.', src: ['G21', 'G3'] },\n  'cmp-planos': { has: 'sim', text: 'Gratuito, Google AI Plus, Google AI Pro e Google AI Ultra para contas pessoais (via Google One). Empresas e escolas usam planos do Google Workspace.', how: 'Compare em gemini.google/plans.', limits: 'Preços e limites variam por país e podem mudar. Recursos como vídeo e Gemini nos apps do Google dependem de plano pago.', src: ['G1', 'G2'] }\n};\n\n/* Novos aspectos pedidos para o comparativo de 3 ferramentas */\nPLAYBOOK.compare.push(\n  {\n    id: 'cmp-escrita', title: 'Escrita e revisão',\n    what: 'Rascunhar, editar e revisar textos com controle sobre trechos específicos.',\n    chatgpt: { has: 'sim', text: 'Blocos de escrita editáveis na resposta, com revisão de trecho selecionado e tela cheia.', how: 'Peça o rascunho e edite o bloco ou selecione um trecho e peça a revisão.', limits: 'O canvas saiu dos modelos atuais; as ações variam por plano e dispositivo.', src: ['O7'] },\n    claude: { has: 'sim', text: 'Artefato Docs colaborativo, com \"Editar com o Claude\" em trechos selecionados, e estilos de resposta.', how: 'Output, modelo Docs, ou peça um documento na conversa.', limits: 'Exige \"Criar e editar arquivos\" ativado.', src: ['C3', 'C12'] },\n    gemini: { has: 'sim', text: 'Canvas com ferramentas para expandir trechos, ajustar o tom e receber comentários; Help me write e Help me create no Google Docs.', how: 'Adicionar arquivos, Canvas. No Docs: barra ou painel do Gemini.', limits: 'Gemini no Docs para conta pessoal depende de plano Google AI. Português é um dos idiomas do Help me write no Docs.', src: ['G3', 'G17', 'G20'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-video', title: 'Recursos de vídeo',\n    what: 'Criação de vídeos a partir de texto, fotos ou outros vídeos.',\n    chatgpt: { has: 'pendente', text: 'Não encontramos geração de vídeo listada na página de planos do ChatGPT consultada. A central de ajuda cita conversa por voz com vídeo da câmera nos planos pagos.', how: 'Pendente de confirmação.', limits: 'Verificar a página oficial de planos antes de considerar este recurso.', src: ['O1'] },\n    claude: { has: 'parcial', text: 'O Claude não gera vídeos realistas. O artefato Motion cria explicações animadas exportáveis em MP4.', how: 'Output, modelo Motion.', limits: 'Motion está em beta e só para Team e Enterprise.', src: ['C3', 'C10'] },\n    gemini: { has: 'sim', text: 'Gemini Omni (substituto do Veo) cria vídeos curtos com áudio a partir de texto, até 5 fotos ou vídeos, e permite editar conversando.', how: 'Na caixa de mensagem, escolha Vídeo e descreva a cena.', limits: 'Exige 18 anos ou mais e plano Google AI Plus, Pro ou Ultra. Alguns recursos, como avatares, variam por país. Vídeos levam marca d\\'água e SynthID.', src: ['G6'] },\n    status: 'parcial'\n  },\n  {\n    id: 'cmp-dados', title: 'Análise de dados',\n    what: 'Leitura de planilhas e dados, cálculos, gráficos e tabelas.',\n    chatgpt: { has: 'sim', text: 'Lê planilhas e CSV, executa código Python em blocos de código e o Work gera planilhas e relatórios.', how: 'Envie a planilha e descreva a análise.', limits: 'Planilhas em torno de 50 MB.', src: ['O4', 'O7'] },\n    claude: { has: 'sim', text: 'Analisa CSV e XLSX executando código, gera gráficos e cria planilhas .xlsx; o artefato Sheets (beta) trabalha com fórmulas.', how: 'Ative \"Criar e editar arquivos\" e envie o arquivo.', limits: 'XLSX exige a criação de arquivos ativada; Sheets a partir do Pro.', src: ['C8', 'C3'] },\n    gemini: { has: 'sim', text: 'No Google Sheets, o painel do Gemini cria planilhas, gráficos e tabelas dinâmicas, e a função AI preenche colunas. No app, analisa arquivos enviados.', how: 'Sheets: Pergunte ao Gemini, no canto superior direito.', limits: 'Gemini no Sheets para conta pessoal exige Google AI Pro ou Ultra; sem plano, o recurso Build pode ter uso limitado.', src: ['G18', 'G24'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-integracoes', title: 'Integrações',\n    what: 'Conexão com e-mail, agenda, arquivos e outras ferramentas.',\n    chatgpt: { has: 'sim', text: 'Apps conectados e Plugins, que combinam skills e apps. O deep research usa apps em modo leitura.', how: 'Diretório de Plugins no modo Work ou apps nas configurações.', limits: 'No Free, apps limitados ao deep research; disponibilidade varia por workspace.', src: ['O10', 'O1'] },\n    claude: { has: 'sim', text: 'Conectores em todos os planos, incluindo Google Workspace, e o Claude in Chrome nos planos pagos.', how: 'Configurações, conectores, ou o menu de ferramentas da conversa.', limits: 'Conectores que pedem aprovação a cada ação não funcionam dentro de artefatos.', src: ['C1', 'C3'] },\n    gemini: { has: 'sim', text: 'Apps conectados do Google (Gmail, Agenda, Docs, Drive, Keep, Tasks, Fotos, YouTube) e o Gemini dentro dos próprios apps do Workspace.', how: 'Apps conectados nas configurações, ou conecte quando o Gemini pedir na conversa.', limits: 'Exige Manter atividade ligado. Contas de trabalho dependem do administrador.', src: ['G9', 'G16'] },\n    status: 'verificado'\n  },\n  {\n    id: 'cmp-educacao', title: 'Aplicações educacionais',\n    what: 'Recursos pensados para estudar, ensinar e praticar.',\n    chatgpt: { has: 'sim', text: 'Modo de estudo listado na página de planos, inclusive no Free.', how: 'Escolha o modo de estudo na conversa.', limits: 'Detalhes de funcionamento: consulte a central de ajuda da OpenAI.', src: ['O1'] },\n    claude: { has: 'parcial', text: 'Estilo \"Explicativo\" para respostas didáticas, artefatos para quizzes e materiais, e projetos para disciplinas.', how: 'Menu de ferramentas, Usar estilo, Explicativo.', limits: 'Não há modo de tutoria dedicado confirmado na documentação consultada.', src: ['C12', 'C3'] },\n    gemini: { has: 'sim', text: 'Guided Learning conduz o estudo passo a passo, com perguntas de prática, imagens e vídeos do YouTube. Canvas gera quizzes.', how: 'Adicionar arquivos, Guided Learning, e digite o tema.', limits: 'Não disponível para menores de 18 anos nem para contas de trabalho ou escola. Vídeos do YouTube só com Manter atividade ligado.', src: ['G13', 'G3'] },\n    status: 'parcial'\n  }\n);\n\n/* ---------- Qual ferramenta faz mais sentido para a tarefa ---------- */\nPLAYBOOK.compareByTask = [\n  { task: 'Escrever e revisar textos', chatgpt: 'Blocos de escrita na conversa.', claude: 'Docs para textos longos que você vai guardar e compartilhar.', gemini: 'Canvas ou direto no Google Docs.', hint: 'Escolha pelo lugar onde o texto vai morar.' },\n  { task: 'Pesquisar com fontes', chatgpt: 'Deep research (limitado no Free).', claude: 'Research nos planos pagos; busca web no Free.', gemini: 'Deep Research no Free com limites diários.', hint: 'Para custo zero, Gemini e ChatGPT oferecem pesquisa longa no plano gratuito.' },\n  { task: 'Analisar documentos longos', chatgpt: 'Arquivos até 512 MB.', claude: 'PDFs até 1.000 páginas no chat.', gemini: 'Arquivos do Drive direto na conversa; notebooks para estudar várias fontes.', hint: 'Se os arquivos já estão no Drive, o Gemini evita baixar e reenviar.' },\n  { task: 'Criar apresentação', chatgpt: 'Modo Work, conforme o plano.', claude: 'Slides em todos os planos, exporta para PowerPoint e Google Slides.', gemini: 'Canvas exporta para Google Slides.', hint: 'Use a que exporta no formato que sua escola ou empresa usa.' },\n  { task: 'Gerar imagens', chatgpt: 'ChatGPT Images em todos os planos.', claude: 'Não gera; cria diagramas e layouts.', gemini: 'Nano Banana em todos os planos.', hint: 'ChatGPT e Gemini geram imagens; compare o resultado no seu caso.' },\n  { task: 'Criar vídeo curto', chatgpt: 'Pendente de confirmação.', claude: 'Motion só em Team e Enterprise.', gemini: 'Gemini Omni nos planos Plus, Pro e Ultra.', hint: 'Para vídeo gerado por IA, o Gemini é a opção confirmada.' },\n  { task: 'Organizar um projeto recorrente', chatgpt: 'Projetos (inclusive no Free).', claude: 'Projetos (até 5 no Free).', gemini: 'Notebooks (conta pessoal).', hint: 'As três resolvem; use a que você já abre todo dia.' },\n  { task: 'Assistente personalizado', chatgpt: 'Projetos em conta pessoal.', claude: 'Projetos com instruções e conhecimento.', gemini: 'Skills chamadas com \"/\".', hint: 'Em conta pessoal, nenhuma das três usa mais GPTs ou Gems para criar assistentes novos.' },\n  { task: 'Analisar planilha', chatgpt: 'Envio de planilha e código.', claude: 'Análise com código e arquivo .xlsx.', gemini: 'Painel do Gemini no Google Sheets (plano pago).', hint: 'Planilha no Google Sheets e plano Google AI: Gemini.' },\n  { task: 'Trabalhar com Gmail, Drive e Docs', chatgpt: 'Apps conectados conforme o plano.', claude: 'Conectores do Google Workspace.', gemini: 'Integração nativa e painel dentro dos apps.', hint: 'Quem vive no Google ganha tempo com o Gemini.' },\n  { task: 'Estudo guiado', chatgpt: 'Modo de estudo.', claude: 'Estilo Explicativo.', gemini: 'Guided Learning (18+).', hint: 'Para alunos menores de idade, confira as regras de idade de cada ferramenta.' },\n  { task: 'Usar sem pagar', chatgpt: 'Conversa, projetos, busca e imagens com limites.', claude: 'Artefatos, arquivos, busca e até 5 projetos.', gemini: 'Canvas, Deep Research, imagens e skills com limites.', hint: 'Combinar duas ferramentas gratuitas costuma cobrir mais tarefas do que um único plano pago.' }\n];\n\nPLAYBOOK.compareCriteria.push(\n  'Se o seu trabalho já está no Gmail, Drive, Docs, Sheets ou Slides, o Gemini lê esses arquivos sem baixar e reenviar.',\n  'Para vídeos curtos gerados por IA, o Gemini é a opção confirmada entre as três, nos planos Google AI Plus, Pro e Ultra.'\n);\n\n/* =========================================================\n   EXPANSÃO GEMINI · orientações específicas por aplicação\n   Cada item acrescenta a seção \"Como fazer no Gemini\" ao\n   tutorial existente, sem alterar o conteúdo original.\n   ========================================================= */\nPLAYBOOK.appGemini = {\n  'aula-completa': {\n    avail: 'gratuito',\n    note: 'O prompt principal funciona igual no Gemini. A diferença está em onde o plano vai parar: o Canvas edita o plano ao lado da conversa e exporta para o Google Docs.',\n    steps: ['Em gemini.google.com, clique em Adicionar arquivos e depois em Canvas.', 'Anexe a ementa pelo Drive (Adicionar arquivos, Drive) se ela já estiver lá.', 'Cole o prompt principal e responda às perguntas do Gemini.', 'Ajuste trechos selecionando o texto no Canvas e pedindo a mudança.', 'Exporte para o Google Docs para guardar junto com seus outros planos.'],\n    tip: 'Se você planeja muitas aulas, crie uma skill com as regras do seu plano modelo e chame-a com \"/\" no início da conversa.',\n    src: ['G3', 'G7', 'G8']\n  },\n  'apresentacao-didatica': {\n    avail: 'gratuito',\n    note: 'No Gemini, o caminho mais direto é o Canvas: ele cria a apresentação a partir de um tema ou arquivo enviado e exporta para o Google Slides, onde você ajusta o visual.',\n    steps: ['Abra o Canvas (Adicionar arquivos, Canvas).', 'Escreva \"crie uma apresentação sobre...\" e anexe o plano de aula.', 'Use o mesmo prompt principal, mantendo as regras de uma ideia por slide e notas do professor.', 'Exporte para o Google Slides.', 'No Slides, com plano Google AI, use Pergunte ao Gemini para gerar uma imagem ou um slide novo.'],\n    tip: 'Peça ao Gemini para transformar a mesma apresentação em quiz no Canvas e use como fechamento da aula.',\n    src: ['G3', 'G19']\n  },\n  'exercicios-avaliacoes': {\n    avail: 'gratuito',\n    note: 'Além do prompt principal, o Canvas gera quizzes interativos que os alunos podem responder por link.',\n    steps: ['Cole o prompt principal na conversa para gerar a avaliação e o gabarito.', 'Peça ao Gemini para abrir o Canvas e transformar as questões objetivas em quiz.', 'Teste o quiz antes de compartilhar o link.', 'Exporte a versão para impressão para o Google Docs.'],\n    tip: 'Links do Canvas abrem apenas na web e qualquer pessoa com o link pode ver. Não coloque dados de alunos no quiz.',\n    src: ['G3']\n  },\n  'adaptar-niveis': {\n    avail: 'gratuito',\n    note: 'O prompt funciona igual. No Canvas, você seleciona um trecho e pede para simplificar ou aprofundar só aquela parte.',\n    steps: ['Abra o Canvas e cole o texto original.', 'Use o prompt principal para gerar as três versões.', 'Selecione trechos e use as ferramentas de edição para ajustar o tom.'],\n    tip: 'Para estudantes adultos, o Guided Learning pode conduzir o aluno pela versão iniciante com perguntas.',\n    src: ['G3', 'G13']\n  },\n  'plano-estudos': {\n    avail: 'depende',\n    note: 'O Gemini monta o plano com o mesmo prompt. Com plano Google AI Pro ou Ultra, uma ação agendada pode lembrar você das metas da semana.',\n    steps: ['Cole o prompt principal e o edital.', 'Peça a versão em tabela e exporte para o Google Sheets se quiser acompanhar.', 'Plano pago: peça \"todo domingo às 19h, me envie as metas da semana deste plano\" para criar uma ação agendada.'],\n    tip: 'Para revisar conteúdo, use o Guided Learning (18+), que faz perguntas em vez de entregar a resposta pronta.',\n    src: ['G12', 'G13']\n  },\n  'imagens-ia': {\n    avail: 'gratuito',\n    note: 'O Gemini também gera e edita imagens nativamente, com o Nano Banana 2. Você pode enviar uma foto e pedir alterações ou combinar várias imagens em uma nova.',\n    steps: ['Em gemini.google.com, clique em Criar imagem.', 'Cole o mesmo prompt de briefing visual.', 'Para editar, peça a mudança na conversa ou envie uma foto sua e descreva o ajuste.', 'Baixe a imagem final e confira textos e detalhes.'],\n    tip: 'Editar imagens exige 18 anos ou mais. As imagens geradas recebem marca d\\'água.',\n    src: ['G5']\n  },\n  'infograficos': {\n    avail: 'gratuito',\n    note: 'O Canvas transforma um documento ou relatório do Deep Research em infográfico interativo. No Google Slides, com plano pago, também há criação de infográfico como imagem (beta).',\n    steps: ['Aprove o conteúdo do infográfico na conversa.', 'Abra o Canvas e peça \"transforme este conteúdo em um infográfico\".', 'Confira cada número no resultado.', 'Compartilhe o link ou capture a tela para usar no material.'],\n    tip: 'Prefira o Canvas ao gerador de imagem quando o texto precisa estar exato.',\n    src: ['G3']\n  },\n  'materiais-visuais-aula': {\n    avail: 'gratuito',\n    note: 'Use o Canvas para fichas e cartões editáveis e o Criar imagem para ilustrações. A exportação para o Google Docs facilita a impressão.',\n    steps: ['Gere a ficha ou os cartões no Canvas com o prompt principal.', 'Gere as ilustrações em Criar imagem.', 'Exporte para o Google Docs, insira as imagens e imprima uma página de teste.'],\n    tip: 'Para cartões de revisão interativos, peça um quiz no Canvas.',\n    src: ['G3', 'G5']\n  },\n  'roteiros-storyboards': {\n    avail: 'depende',\n    note: 'O roteiro sai na conversa com o mesmo prompt. A diferença é que o Gemini pode gerar trechos de vídeo de até 10 segundos com o Gemini Omni nos planos pagos.',\n    steps: ['Gere roteiro e storyboard com o prompt principal.', 'Plano Google AI Plus, Pro ou Ultra: escolha Vídeo e peça uma cena curta para testar enquadramento e clima.', 'Use os quadros gerados como referência para a gravação real.'],\n    tip: 'Vídeos gerados são curtos e marcados como gerados por IA. Use para previsualizar, não como prova de algo real.',\n    src: ['G6']\n  },\n  'apresentacoes-identidade': {\n    avail: 'depende',\n    note: 'No Gemini, guarde as regras visua
